  const stageWarn=s.stage&&!CONFIRMED.includes(s.stage)?`<span class="pill warn" title="Stato del deal su HubSpot">${esc(s.stage)}: non ancora confermata</span>`:'';
  return `<div class="school ${V.tool===s.id?'on':''}" data-sid="${s.id}">
   <div class="school-head"><button class="swatch ${V.tool===s.id?'on':''}" data-pl="paint" style="background:${zcol(s)}" aria-label="Assegna posti a ${esc(s.nome||'questa scuola')}" title="Tocca e poi passa il dito sui posti"></button>
   <textarea class="in sname" data-f="nome" rows="1" placeholder="Nome scuola" aria-label="Nome scuola">${esc(s.nome)}</textarea>
   ${V.confirmDel===s.id?`<button class="icon-btn confirm" data-pl="delok">Elimina</button>`:`<button class="icon-btn" data-pl="del" aria-label="Elimina scuola">×</button>`}</div>
   ${s.dealId||s.docente||s.telDocente||stageWarn?`<div class="school-meta">${s.dealId?'<span class="tag">HubSpot</span>':''}${s.docente||s.telDocente?`<span class="muted small">${s.docente?'Prof. '+esc(s.docente):'Prof.'}${s.telDocente?` · <a class="link" href="${telHref(s.telDocente)}">${esc(s.telDocente)}</a>`:''}</span>`:''}${stageWarn}</div>`:''}
   <div class="school-fields">
    <div class="field"><span class="flabel">Persone</span><input class="in" type="number" inputmode="numeric" min="0" data-f="persone" value="${esc(s.persone)}" aria-label="Persone"></div>
    <div class="field"><span class="flabel">Livello</span><select class="in" data-f="livello" aria-label="Livello"><option value="medie" ${s.livello==='medie'?'selected':''}>Medie</option><option value="superiori" ${s.livello==='superiori'?'selected':''}>Superiori</option></select></div>
    <div class="field"><span class="flabel">Priorità</span><select class="in" data-f="priorita" aria-label="Priorità"><option value="" ${!pr?'selected':''}>Nessuna</option><option value="P1" ${pr==='P1'?'selected':''}>P1</option><option value="P2" ${pr==='P2'?'selected':''}>P2</option><option value="P3" ${pr==='P3'?'selected':''}>P3</option></select></div>
    <div class="field"><span class="flabel">Con disabilità</span><input class="in" type="number" inputmode="numeric" min="0" data-f="disabili" value="${esc(s.disabili||0)}" aria-label="Studenti con disabilità"></div>
   </div>
   <div class="school-fields" style="grid-template-columns:1fr">
    <div class="field"><span class="flabel">Note</span><input class="in" data-f="note" value="${esc(s.note||'')}" placeholder="Facoltative" aria-label="Note"></div>
   </div>
   <div class="status" data-status="${s.id}">${schoolStatus(s)}</div></div>`;
}
function refreshStatuses(){V.p.scuole.forEach(s=>{const el=document.querySelector(`[data-status="${s.id}"]`);if(el)el.innerHTML=schoolStatus(s);});updateStats();updateRegen();}
function isStale(p){return !!p.scuole.length&&p.genHash!==genHash(p);}
function updateRegen(){const p=V.p;const bar=document.getElementById('regenBar');const top=document.getElementById('regenTop');if(!bar)return;const st=isStale(p);
  bar.innerHTML=st?`<div class="banner">Hai cambiato dei dati delle scuole o dei posti esclusi: premi “Rigenera piantina” per aggiornarla prima di esportarla.</div>`:'';

function setSaveState(msg){const el=document.getElementById('pState');if(!el)return;el.textContent=msg||(V.saved?(S.mode==='local'?'Salvata solo su questo dispositivo':V.p&&pendOf(V.p.id)?'Non ancora online: riprovo appena torna la connessione':'Salvata online'):'');}
function scheduleSave(){V.saved=false;setSaveState('Salvataggio…');clearTimeout(V.saveT);V.saveT=setTimeout(savePiantina,900);}
async function savePiantina(){const p=V.p;if(!p)return;p.aggiornato=new Date().toISOString();
  try{await put('piantine',p.id,clone(p));V.saved=true;pendSet(p.id,null);setSaveState();qrStRefresh();archSoon('p',p.id);}catch(err){pendSet(p.id,clone(p));setSaveState('Non salvata');qrStRefresh();toast('Salvataggio non riuscito ('+(err.code||err.message)+'): i QR non sono aggiornati','bad');}}
/* piantine con modifiche non ancora arrivate all'archivio: i QR dei docenti mostrano ancora la versione vecchia */
const PEND_K='ml_pend_piantine';
function pendAll(){try{return JSON.parse(localStorage.getItem(PEND_K)||'{}');}catch(_){return {};}}
function pendSet(id,p){try{const o=pendAll();if(p)o[id]=p;else delete o[id];localStorage.setItem(PEND_K,JSON.stringify(o));}catch(_){}}
function pendOf(id){return pendAll()[id]||null;}
async function pendRetry(id,quiet){const o=pendAll();const ids=id?[id]:Object.keys(o);let ok=0,ko=0;
  for(const k of ids){const p=o[k];if(!p)continue;try{await put('piantine',k,clone(p));pendSet(k,null);ok++;}catch(_){ko++;}}
  if(!quiet||ok)toast(ko?'QR non aggiornati: controlla la connessione e riprova':'QR aggiornati',ko?'bad':undefined);
  if(ok&&(V.name==='qr'||V.name==='piantina'))(V.name==='qr'?render():qrStRefresh());return !ko;}
addEventListener('online',()=>{if(Object.keys(pendAll()).length)pendRetry(null,true);});
function qrStHTML(id){return pendOf(id)?`<div class="qr-st warn">${TRI}<span><b>QR non aggiornati</b><span class="muted small">Le ultime modifiche alla piantina non sono state salvate: i docenti vedono ancora i posti di prima.</span></span><button class="btn small primary" data-qrfix="${esc(id)}">Aggiorna QR</button></div>`
  :`<div class="qr-st ok"><span class="done-tick" aria-hidden="true">✓</span><span><b>QR aggiornati</b><span class="muted small">I docenti vedono l’ultima versione della piantina.</span></span></div>`;}
function qrStRefresh(){const el=document.getElementById('plQrSt');if(el&&V.p)el.innerHTML=qrStHTML(V.p.id);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-qrfix]');if(!b)return;b.disabled=true;
  if(V.name==='piantina'&&V.p&&V.p.id===b.dataset.qrfix){await savePiantina();if(!pendOf(V.p.id))toast('QR aggiornati');b.disabled=false;return;}
  await pendRetry(b.dataset.qrfix);b.disabled=false;});

  if(f==='nome')renderPlTools();refreshStatuses();scheduleSave();}

app.addEventListener('change',e=>{
  if(V.name!=='piantina')return;

app.addEventListener('click',async e=>{
  if(V.name!=='piantina')return;const p=V.p;
  if(V.ro){const bb=e.target.closest('[data-pl],[data-tool]');const ok=['back','zin','zout','fs','pdf'];if(bb&&((bb.dataset.pl&&!ok.includes(bb.dataset.pl))||(bb.dataset.tool&&bb.dataset.tool!=='pan'))){toast('Piantina bloccata: la modifica solo il Tour Manager','warn');return;}}
  const zt=e.target.closest('[data-zone]');if(zt){V.zi=+zt.dataset.zone;renderPlZones();renderPlTools();drawPl();return;}
  const tb=e.target.closest('[data-tool]');if(tb){V.tool=tb.dataset.tool;renderPlTools();highlightCards();return;}
  const b=e.target.closest('[data-pl]');if(!b)return;const a=b.dataset.pl;const card=b.closest('[data-sid]');const sid=card?card.dataset.sid:null;
  if(a==='back'){clearTimeout(V.saveT);if(!V.saved&&p.scuole.length)await savePiantina();const f=V.from;go(f||'piantine',f==='oggi'?{dayId:p.tappaId}:{});return;}
  if(a==='fs'){V.fs=!V.fs;document.querySelector('.stage-col').classList.toggle('fs',V.fs);document.body.classList.toggle('noscroll',V.fs);renderPlTools();return;}
  if(a==='zin'){V.zoom=Math.min(5,V.zoom*1.35);drawPl();return;}
  if(a==='zout'){V.zoom=Math.max(1,V.zoom/1.35);drawPl();return;}
  if(a==='sync'){const tp=curTappa();if(!tp)return;const r=syncFromDeals(p,dealsFor(tp,p.replica));
    const changed=r.added||r.updated||r.removed;if(changed){distribute(curT(),p);V.manual=false;}
    renderHs();renderPlTools();renderSchools();drawPl();scheduleSave();
    toast(changed?`HubSpot: ${r.added} nuove, ${r.updated} aggiornate, ${r.removed} tolte · posti ridistribuiti`:'Nessuna novità su HubSpot');return;}
  if(a==='addschool'){const s={id:uid('s'),nome:'',persone:'',livello:'medie',disabili:0,classeDis:'',priorita:'',note:'',c:nextColor(p)};p.scuole.push(s);
    renderSchools();renderPlTools();scheduleSave();const el=document.querySelector(`[data-sid="${s.id}"] [data-f="nome"]`);if(el)el.focus();return;}
  if(a==='paint'&&sid){V.tool=V.tool===sid?'pan':sid;renderPlTools();highlightCards();return;}
  if(a==='del'&&sid){V.confirmDel=sid;renderSchools();return;}
  if(a==='delok'&&sid){p.scuole=p.scuole.filter(s=>s.id!==sid);for(const k in p.assign)if(p.assign[k]===sid)delete p.assign[k];V.confirmDel=null;if(V.tool===sid)V.tool='pan';
    renderSchools();renderPlTools();drawPl();scheduleSave();return;}
  if(a==='dist'||a==='regen'){if(!p.scuole.length){toast('Aggiungi prima le scuole','warn');return;}if(Object.keys(p.assign).length&&V.manual){V.confirmDist=true;regenRefresh();return;}doDistribute();return;}
  if(a==='distok'){V.confirmDist=false;regenRefresh();doDistribute();return;}
  if(a==='clear'){V.confirmClear=true;renderSchools();return;}
  if(a==='clearno'){V.confirmClear=false;renderSchools();return;}
  if(a==='clearok'){V.confirmClear=false;p.assign={};p.esclusi={};V.manual=false;drawPl();renderSchools();renderPlTools();scheduleSave();toast('Disposizione svuotata: premi “Rigenera piantina” per ridistribuire');return;}
  if(a==='distno'){V.confirmDist=false;regenRefresh();return;}
  if(a==='pdf'){await exportPDF(b);return;}
});

function regenBtnHTML(){return V.confirmDist?`<button class="btn danger" data-pl="distok">Sovrascrivo le modifiche a mano?</button><button class="btn ghost" data-pl="distno">Annulla</button>`:`<button class="btn" data-pl="regen" id="regenTop">Rigenera piantina</button>`;}
function regenRefresh(){const w=document.getElementById('regenWrap');if(w)w.innerHTML=regenBtnHTML();updateRegen();}
function doDistribute(){const p=V.p;const miss=distribute(curT(),p);V.manual=false;drawPl();renderSchools();scheduleSave();
  toast(miss?`Posti insufficienti: ${miss} persone senza posto`:p.distMode==='condivise'?'Sala quasi piena: alcune scuole condividono una fila':'Posti distribuiti',miss?'bad':p.distMode==='file'?undefined:'warn');}

/* pittura con il dito */
let painting=false,paintedExcl=false;
app.addEventListener('pointerdown',e=>{
  if(V.name!=='piantina'||V.tool==='pan'||V.ro)return;const svg=e.target.closest('#plCanvas svg');if(!svg)return;
  e.preventDefault();
  if(V.tool==='carr'){const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest?el.closest('#plCanvas [data-k]'):null;const st=g&&V.GT&&V.GT.byK[g.dataset.k];if(!st||st.blocked)return;const p=V.p;p.carrozzina=p.carrozzina||{};
    if(p.carrozzina[st.k])delete p.carrozzina[st.k];else p.carrozzina[st.k]=true;drawPl();renderNote();scheduleSave();return;}
  painting=true;paintedExcl=false;try{svg.setPointerCapture(e.pointerId);}catch(_){}paintAt(e);
});
app.addEventListener('pointermove',e=>{if(painting)paintAt(e);});
function endPaint(){if(!painting)return;painting=false;if(paintedExcl)drawPl();else refreshStatuses();scheduleSave();}
app.addEventListener('pointerup',endPaint);app.addEventListener('pointercancel',endPaint);
function paintAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest?el.closest('#plCanvas [data-k]'):null;if(!g)return;
  const k=g.dataset.k;const seat=V.GT&&V.GT.byK[k];if(!seat||seat.fixed)return;const p=V.p;
  const rect=g.querySelector('rect'),txt=g.querySelector('text');
  const paintSeat=(fill,stroke,ink)=>{rect.style.fill=fill;rect.style.stroke=stroke;if(txt)txt.style.fill=ink;};
  if(V.tool==='erase'){
    if(p.esclusi[k]){delete p.esclusi[k];paintedExcl=true;}
    if(p.assign[k])delete p.assign[k];
    if(!paintedExcl)paintSeat('var(--seat)','var(--seat-stroke)','var(--seat-ink)');
  }else if(V.tool==='excl'){
    if(p.esclusi[k])return;p.esclusi[k]=true;delete p.assign[k];paintedExcl=true;paintSeat('var(--warn-soft)','var(--warn)','var(--warn)');
  }else{
    if(seat.excl||p.assign[k]===V.tool)return;const s=p.scuole.find(x=>x.id===V.tool);if(!s)return;const c=zcol(s);
    const max=int(s.persone);if(max>0){let n=0;for(const kk in p.assign)if(p.assign[kk]===s.id&&V.GT.byK[kk]&&!V.GT.byK[kk].blocked)n++;
      if(n>=max){const now=Date.now();if(!V.limT||now-V.limT>2500){V.limT=now;toast(`${s.nome||'La scuola'} ha già tutti i suoi ${max} posti. Per spostarli, prima cancellane qualcuno con la gomma.`,'warn');}return;}}
    p.assign[k]=V.tool;paintSeat(c,'rgba(0,0,0,.25)',inkFor(c));
  }
  V.manual=true;
}

/* ---------- esportazione PDF ---------- */
async function planPDF(doc,p,t){
  await loadScript(JSPDF);const {jsPDF}=window.jspdf;const GT=geomT(t,p.esclusi);
    const col=colorOf(p);const tot=p.scuole.reduce((a,s)=>a+int(s.persone),0);
    const zones=GT.order.filter(x=>x.G.seats.length);
    let PW=0,PH=0;const M=10;
    const poly=(pts,style)=>{const rel=pts.slice(1).map((q,i)=>[q[0]-pts[i][0],q[1]-pts[i][1]]);doc.lines(rel,pts[0][0],pts[0][1],[1,1],style,true);};
    const header=(sub)=>{doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor('#17202B');doc.text(`${t.nome}${t.citta?' – '+t.citta:''}`,M,M+5);
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor('#5B6675');doc.text(p._mappa?`Mappa della sala · ${Object.values(GT.byK).filter(q=>!q.blocked).length} posti${sub?' · '+sub:''}`:`${fmtDate(p.data)} · replica ore ${p.replica||''} · ${p.scuole.length} scuole · ${tot} persone${sub?' · '+sub:''}`,M,M+11);};
    let lastBottom=0;
    zones.forEach((x,zi)=>{
      const z=x.z,G=x.G,S0=G.S;const bb=contentBox(z,G);const land=bb.w>bb.h*1.15;
      if(!doc){doc=new jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a4'});}else doc.addPage('a4',land?'landscape':'portrait');
      PW=doc.internal.pageSize.getWidth();PH=doc.internal.pageSize.getHeight();
      header(zones.length>1?z.nome:'');
      const top=M+16,areaW=PW-2*M,isLast=zi===zones.length-1;const areaH=(PH-top-M)*(isLast?(land?0.72:0.66):1);
      const k=Math.min(areaW/bb.w,areaH/bb.h);const offX=M+(areaW-bb.w*k)/2;
      const X=v=>offX+(v-bb.x)*k,Y=v=>top+(v-bb.y)*k;
      if(z.front){const fs=frontShape(z,G);doc.setFillColor('#2A3039');doc.setDrawColor('#2A3039');poly(fs.P.map(q=>[X(q[0]),Y(q[1])]),'F');
        doc.setTextColor('#FFFFFF');doc.setFont('helvetica','bold');doc.setFontSize(Math.max(5,fs.fs*k*2.835));
        doc.text(fs.label,X(fs.mx),Y(fs.my),{align:'center',baseline:'middle',angle:-fs.ang});}
      const sz=S0*k;doc.setLineWidth(0.12);
      G.lines.forEach(l=>{const a=l.seats[0],b=l.seats[l.seats.length-1];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy);if(L<1e-6){dx=G.ux;dy=G.uy;}else{dx/=L;dy/=L;}
        doc.setFont('helvetica','bold');doc.setFontSize(Math.max(4,sz*0.62*2.835));doc.setTextColor('#5B6675');
        doc.text(String(l.fila),X(a.x-dx*S0*1.15),Y(a.y-dy*S0*1.15),{align:'center',baseline:'middle'});
        if(L>S0)doc.text(String(l.fila),X(b.x+dx*S0*1.15),Y(b.y+dy*S0*1.15),{align:'center',baseline:'middle'});});
      G.seats.forEach(s=>{const sid=s.blocked?null:p.assign[s.k];const c=s.fixed?'#8F98A3':s.excl?'#FBE3C8':(sid&&col[sid]?col[sid]:'#E8EBEF');
        doc.setFillColor(c);doc.setDrawColor(s.excl?'#A85A0C':(sid?'#55606C':'#A9B3BE'));
        const r=s.ang*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r),h=S0/2;
        const pts=[[-h,-h],[h,-h],[h,h],[-h,h]].map(([u,v])=>[X(s.x+u*cs-v*sn),Y(s.y+u*sn+v*cs)]);poly(pts,'FD');
        if(s.blocked){doc.setDrawColor(s.excl?'#A85A0C':'#FFFFFF');const q=h*0.52;
          const P1=[X(s.x-q*cs+q*sn),Y(s.y-q*sn-q*cs)],P2=[X(s.x+q*cs-q*sn),Y(s.y+q*sn+q*cs)],P3=[X(s.x+q*cs+q*sn),Y(s.y+q*sn-q*cs)],P4=[X(s.x-q*cs-q*sn),Y(s.y-q*sn+q*cs)];
          doc.line(P1[0],P1[1],P2[0],P2[1]);doc.line(P3[0],P3[1],P4[0],P4[1]);return;}
        if(s.carr||(p.carrozzina&&p.carrozzina[s.k])){doc.setDrawColor('#1E5BB8');doc.setLineWidth(0.5);const q=h*1.3;poly([[-q,-q],[q,-q],[q,q],[-q,q]].map(([u,v])=>[X(s.x+u*cs-v*sn),Y(s.y+u*sn+v*cs)]),'S');doc.setLineWidth(0.12);doc.setFillColor('#FFFFFF');doc.circle(X(s.x),Y(s.y),Math.max(0.4,sz*0.18),'F');return;}
        const fsz=sz*(String(s.label).length>2?0.4:0.46)*2.835;
        if(fsz>=2.2){doc.setFont('helvetica','bold');doc.setFontSize(fsz);doc.setTextColor(sid&&col[sid]?inkFor(col[sid]):'#4A5462');
          doc.text(String(s.label),X(s.x),Y(s.y),{align:'center',baseline:'middle',angle:Math.abs(s.ang)>2?-s.ang:0});}});
      lastBottom=top+bb.h*k;
    });
    if(!doc||!zones.length||p._mappa)return doc;
    // legenda
    let y=lastBottom+8;const lineH=4.6,areaW=PW-2*M;
    const exN=Object.values(GT.byK).filter(s=>s.excl).length;
    const mkItems=W=>p.scuole.map(s=>{const rs=rangesFor(GT,p.assign,s.id);const n=countFor(GT,p.assign,s.id);const cd=int(s.disabili)>0?Math.min(int(s.classeDis),int(s.persone)):0;
      const meta=`${LVL_L[s.livello]||''}${s.docente?' · Prof. '+s.docente:''}${s.telDocente?' · Tel. '+s.telDocente:''} · ${int(s.persone)} persone · ${n} posti${prioOf(s)?' · '+prioOf(s):''}${int(s.disabili)?` · ${int(s.disabili)} con disabilità`+(p.carrozzina&&Object.keys(p.carrozzina).length||Object.values(GT.byK).some(q=>q.carr)?', posto carrozzina':''):''}`;
      const lines=[...doc.splitTextToSize(rs.length?rangesText(GT,rs):'Nessun posto assegnato',W-8)];if(s.note)lines.push(...doc.splitTextToSize('Note: '+s.note,W-8));
      return {s,meta,lines};});
    doc.setFont('helvetica','normal');doc.setFontSize(9);let items=mkItems(areaW);
    const extra=[];if(Object.keys(p.carrozzina||{}).length||Object.values(GT.byK).some(q=>q.carr))extra.push('Riquadro blu con pallino bianco: posto per chi è in carrozzina.');if(p.distNote)extra.push(p.distNote);if(p1Conflict(p.scuole,t))extra.push('Ordine P1 da confermare dal referente di zona.');
    const need=items.reduce((a,it)=>a+lineH*(2+it.lines.length)+2,14+extra.length*lineH*3);
    if(y+need>PH-M){doc.addPage('a4','portrait');PW=doc.internal.pageSize.getWidth();PH=doc.internal.pageSize.getHeight();y=M+6;items=mkItems(PW-2*M);}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor('#17202B');doc.text('Legenda',M,y);
    if(exN){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor('#A85A0C');doc.text(`${exN} posti esclusi per questa data (es. console tecnici)`,M+22,y);}
    y+=6;
    extra.forEach(tx=>{const ls=doc.splitTextToSize(tx,PW-2*M-8);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor('#A85A0C');ls.forEach(l=>{doc.text(l,M,y);y+=lineH;});y+=1.5;});
    items.forEach(it=>{if(y+lineH*(2+it.lines.length)>PH-M){doc.addPage('a4','portrait');y=M+6;}
      doc.setFillColor(col[it.s.id]);doc.setDrawColor('#55606C');doc.rect(M,y-3.2,4,4,'FD');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor('#17202B');doc.text(it.s.nome||'Scuola',M+6,y);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor('#5B6675');doc.text(it.meta,M+6,y+lineH);
      doc.setTextColor('#17202B');it.lines.forEach((ln,i)=>doc.text(ln,M+6,y+lineH*(2+i)));y+=lineH*(2+it.lines.length)+2;});
  return doc;
}
async function exportPDF(btn){
  const p=V.p,t=curT(),GT=geomT(t,p.esclusi);
  if(isStale(p)&&!V.expOk){V.expOk=true;btn.textContent='Dati cambiati: esporto comunque?';btn.classList.add('danger');setTimeout(()=>{V.expOk=false;if(btn.isConnected){btn.textContent='Esporta PDF';btn.classList.remove('danger');}},5000);return;}
  V.expOk=false;btn.classList.remove('danger');
  if(!S.downloads){toast('Il download non è disponibile in questa vista','bad');return;}
  btn.disabled=true;btn.textContent='Preparo il PDF…';
  try{
    const doc=await planPDF(null,p,t);
    if(!doc){toast('Il teatro non ha posti mappati','bad');btn.disabled=false;btn.textContent='Esporta PDF';return;}
    const slug=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const filename=`Piantina_${slug(t.nome)}_${p.data||''}_${slug(p.replica)}.pdf`;
    await S.downloads.save({filename,data:doc.output('blob')});
    toast('PDF pronto');
  }catch(err){if(!(err&&err.code==='declined'))toast('PDF non creato ('+((err&&(err.code||err.message))||'errore')+')','bad');}
  btn.disabled=false;btn.textContent='Esporta PDF';
}

const DOC_TIPI=['Carta d’identità','Passaporto','Patente'];
function tourCast(){const tr=curTour();return Object.entries(S.c.cast).map(([k,c])=>c.id?c:{...c,id:k}).filter(c=>tr===ALL||c.tour===tr).sort((a,b)=>(tr===ALL?(a.tour||'').localeCompare(b.tour||''):0)||(a.cognome||'').localeCompare(b.cognome||''));}
function formOf(tr){const f=((S.c.impostazioni.formazioni||{})[tr])||{};return (f.list||[]).slice().sort((a,b)=>a.n-b.n);}
function hasForm(tr){return formOf(tr).length>0;}
function firstDate(tr){const l=Object.values(S.c.tappe).filter(t=>t.tour===tr).map(t=>t.data).sort();return l[0]||'';}
function lastDateOf(tr){const l=Object.values(S.c.tappe).filter(t=>t.tour===tr).map(t=>t.data).sort();return l[l.length-1]||'';}
function formRange(tr,n){const fs=formOf(tr);if(n==='tutte')return {dal:firstDate(tr),al:lastDateOf(tr)};
  const cur=n===1?{dal:firstDate(tr)}:fs.find(f=>f.n===n)||{};const nx=fs.find(f=>f.n===n+1);
  return {dal:cur.dal||'',al:nx&&nx.dal?addDays(nx.dal,-1):lastDateOf(tr),daDef:n>1&&!cur.dal};}
function formNow(tr){const t=today();let cur=1;formOf(tr).forEach(f=>{if(f.dal&&f.dal<=t)cur=f.n;});return cur;}
function castForm_(c){return c.formazione==='tutte'?'tutte':(+c.formazione||1);}
async function saveForm(tr,list){const all=clone(S.c.impostazioni.formazioni||{});all[tr]={list};await put('impostazioni','formazioni',all);}
function lastDate(){const l=tourTappe();return l.length?l[l.length-1].data:'';}

  const attori=list.filter(c=>!isTec(c)),tecnici=list.filter(isTec);
  let seq=[...attori,'__TEC__',...tecnici];
  if(FM){const now=formNow(trc);const groups=['tutte',1,...formOf(trc).map(f=>f.n)];seq=[];
    groups.forEach(g=>{const mem=list.filter(c=>castForm_(c)===g);if(g==='tutte'&&!mem.length)return;seq.push({__g:g,now,n:mem.length});seq.push(...mem.filter(c=>!isTec(c)),...mem.filter(isTec));});}

      const per=g==='tutte'?'Per tutta la tournée':r.daDef?'Data del cambio da definire':`${r.dal?'Dal '+fmtDate(r.dal):'Dall’inizio'}${r.al&&(!r.dal||r.al>=r.dal)?' al '+fmtDate(r.al):''}`;

        ${isDir()&&g!=='tutte'&&g>1?`<div class="form-ctl"><label class="muted small" for="fd_${g}">Cambio dal</label><input class="in" type="date" id="fd_${g}" data-formdate="${g}" value="${esc((formOf(trc).find(f=>f.n===g)||{}).dal||'')}">${!c.n&&g===formOf(trc).length+1?`<button class="btn small ghost" data-cs="delform" data-n="${g}">Togli</button>`:''}</div>`:''}</div><div class="list">`;return;}
    if(c==='__TEC__'){h+=`</div>${tecnici.length?`<h2 class="cast-sec">Tecnici</h2><p class="muted small" style="margin:0 0 10px">Fonico e tecnico luci di Mater Lingua che viaggiano con il tour.${role()==='tm'?' Il primo giorno scegli chi fa cosa e salva il numero.':''}</p>`:''}<div class="list">`;return;}

   Nome standard: "ZTL - CITTÀ - AAAA-MM-GG.pdf" (per una data) oppure "ZTL - CITTÀ.pdf" (per tutte le date in quella città). */
function ztlDate(s){let m=s.match(/(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/(\d{1,2})[-_.](\d{1,2})[-_.](\d{2,4})/);if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return '';}
function ztlDrive(tp){const fs=((S.c.impostazioni.ztl_files||{}).files)||[];const c=norm(tp.citta).replace(/[^a-z0-9]/g,'');if(!c)return null;
  const ok=fs.filter(f=>{const n=norm(f.name);if(!/^ztl/.test(n))return false;return n.replace(/[^a-z0-9]/g,'').includes(c);});
  return ok.find(f=>ztlDate(f.name)===tp.data)||ok.find(f=>!ztlDate(f.name))||null;}

  app.innerHTML=h;

function renderFbInbox(){const every=Object.values(S.c.segnalazioni||{}).sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));const all=every.filter(x=>!!x.risolta===!!V.fbRisolte);const nRis=every.filter(x=>x.risolta).length;const rl=V.fbRole||'';

/* ---------- archivio su Google Drive: copia automatica + pulizia di fine tournée ----------
   L'app non scrive mai sul Drive direttamente: passa dalla funzione "drive-archivio", che sul Drive
   può solo aggiungere/aggiornare file (mai cancellare). */
const ARCH_FN='drive-archivio';
function archCard(){return `<section class="card"><div class="card-head"><h2>Archivio Drive</h2></div><p class="muted small" style="margin:0">Piantine, checklist e foto vengono copiate da sole nel Drive “7. Archivio applicazione Tour Manager”. ${canPulizia()?' A fine tournée puoi liberare l’app: prima si controlla che sul Drive ci sia tutto.':''}</p><div class="row-btns">${canPulizia()?'<button class="btn small primary" data-pulizia>Pulizia di fine tournée</button>':''}</div>${ftCard()}</section>`;}
/* svuotare l'app a fine tournée: solo Clivia. Lo sviluppatore vede la scheda solo per provare il collegamento */
function ftCard(){if((S.pref.user||'').toLowerCase()!==DEV_EMAIL)return '';const has=!!(S.c.impostazioni.fineTournee||{}).asset;
  return `<p class="muted small" style="margin:8px 0 0">Foto di fine tournée (la vede solo Clivia dopo la pulizia): ${has?'<b>caricata</b>':'non ancora caricata'}.</p><div class="row-btns"><label class="btn small">${has?'Cambia la foto':'Carica la foto'}<input type="file" accept="image/png,image/webp,image/jpeg" data-ftup hidden></label>${has?`<button class="btn small ghost" data-ftdel>${V.ftDelOk?'Confermi? Togli la foto':'Togli la foto'}</button>`:''}</div>`;}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-ftdel]');if(!b||(S.pref.user||'').toLowerCase()!==DEV_EMAIL)return;

  try{toast('Carico la foto…');const old=(S.c.impostazioni.fineTournee||{}).asset;const up=await upAsset(f,true);if(old&&SB&&SB.storage)try{await SB.storage.from('priv').remove([old]);}catch(_){}await put('impostazioni','fineTournee',{asset:up.id,ts:new Date().toISOString()});S.c.impostazioni.fineTournee={asset:up.id,id:'fineTournee'};toast('Foto salvata nell’archivio privato');render();}
  catch(err){toast('Foto non caricata ('+(err.code||err.message||'errore')+')','bad');}});
function canPulizia(){return (S.pref.user||'').toLowerCase()==='clivia.lachkar@materlingua.eu';}
function canArch(){return canPulizia()||(S.pref.user||'').toLowerCase()===DEV_EMAIL;}
function hstr(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
const ARCH_K='ml_arch';let ARCH_H=null;
function archGet(){if(ARCH_H)return ARCH_H;try{ARCH_H=JSON.parse(localStorage.getItem(ARCH_K)||'{}');}catch(_){ARCH_H={};}return ARCH_H;}
function archSet(id,h){archGet()[id]=h;try{localStorage.setItem(ARCH_K,JSON.stringify(ARCH_H));}catch(_){}}
async function archCall(body){if(S.mode!=='supa'||!SB||!navigator.onLine)return null;
  try{const {data,error}=await SB.functions.invoke(ARCH_FN,{body});if(error)throw error;return data;}catch(e){console.warn('archivio Drive',e);return null;}}
let archSyncT=0;function archSync(){clearTimeout(archSyncT);archSyncT=setTimeout(()=>archCall({action:'sync'}),4000);}
const ARCH_T={};function archSoon(k,id){clearTimeout(ARCH_T[k+id]);ARCH_T[k+id]=setTimeout(()=>(k==='p'?archPlan(id):archTeatro(id)),20000);}
function blobB64(b){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=ko;r.readAsDataURL(b);});}
function tourOfP(p){return ((S.c.tappe||{})[p.tappaId]||{}).tour||p.tour||'';}
function teatroArchHash(t){return hstr(JSON.stringify([2,t.nome,t.citta,t.zone]));}
function planArchHash(p,t){return hstr(JSON.stringify([2,p.data,p.replica,tourOfP(p),p.scuole,p.assign,p.esclusi,p.carrozzina,p.distNote||'',t?hstr(JSON.stringify([t.nome,t.citta,t.zone])):'']));}
const MESI_U=['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
/* come le piantine dell'anno scorso: "02. OTTOBRE 2026" (numerato dall'inizio dell'anno scolastico) → "02.10.26 - VARESE" */
function planArchPath(p){const d=p.data||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return [];const [y,m,g]=d.split('-');const mi=+m;const n=mi>=9?mi-8:mi+4;
  const tp=(S.c.tappe||{})[p.tappaId]||{};const t=S.c.teatri[p.teatroId]||{};const city=String(tp.citta||t.citta||'').toUpperCase();
  return [`${String(n).padStart(2,'0')}. ${MESI_U[mi-1]} ${y}`,`${g}.${m}.${y.slice(2)}${city?' - '+city:''}`];}
function planArchable(p){const t=p&&S.c.teatri[p.teatroId];return !!(t&&(p.scuole||[]).length&&Object.keys(p.assign||{}).length);}
async function archPlan(id,force){const p=S.c.piantine[id];if(!planArchable(p))return false;const t=S.c.teatri[p.teatroId];const h=planArchHash(p,t);
  if(!force&&archGet()['pianta_'+id]===h)return true;
  try{await loadScript(JSPDF);const doc=await planPDF(null,prepP(clone(p)),t);if(!doc)return false;const tr=tourOfP(p);
    const name=[p.data||'senza-data',t.nome,tr,(p.replica||'').replace(':','-')].filter(Boolean).join('_')+'.pdf';
    const r=await archCall({action:'pdf',kind:'pianta',id,hash:h,tour:tr||'Senza tournée',path:planArchPath(p),name,b64:await blobB64(doc.output('blob'))});
    if(r&&r.ok){archSet('pianta_'+id,h);return true;}}catch(e){console.warn('archivio piantina',e);}return false;}
function teatroArchable(t){return !!(t&&!t.archiviato&&(t.zone||[]).some(z=>(z.rows||[]).length));}
async function archTeatro(id,force){const t=S.c.teatri[id];if(!teatroArchable(t))return false;const h=teatroArchHash(t);
  if(!force&&archGet()['teatro_'+id]===h)return true;
  try{await loadScript(JSPDF);const doc=await planPDF(null,{scuole:[],assign:{},esclusi:{},carrozzina:{},opzioni:{},data:'',replica:'',_mappa:true},t);if(!doc)return false;
    const r=await archCall({action:'pdf',kind:'teatro',id,hash:h,name:`${t.nome}${t.citta&&!norm(t.nome).includes(norm(t.citta))?' - '+t.citta:''}.pdf`,b64:await blobB64(doc.output('blob'))});
    if(r&&r.ok){archSet('teatro_'+id,h);return true;}}catch(e){console.warn('archivio teatro',e);}return false;}
function ckSheet(tp,ck){const prev=Object.values(S.c.tappe||{}).filter(x=>x.tour===tp.tour&&x.data<tp.data).sort((a,b)=>b.data.localeCompare(a.data))[0];
  const yn=v=>v==='si'?'Sì':v==='no'?'No':'';const H=['Data','Tour','Città','Teatro','TM','Hotel (notte prima)','Inviata il','Modificata dopo l’invio'];
  const R=[tp.data||'',tp.tour||'',tp.citta||'',tp.teatroNome||ck.teatro||'',ck.tm||'',prev&&prev.hotel?prev.hotel.nome||'':'',ck.inviataIl?new Date(ck.inviataIl).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'',ck.modificataDopoInvio?'Sì':''];
  CK.forEach(sec=>{sec.q.forEach(it=>{const r=(ck.risposte||{})[it[0]]||{};H.push(`${sec.t} · ${it[1]}`);R.push(ckVisible(ck,it)?[yn(r.v),(r.opts||[]).join(', '),r.nota||''].filter(Boolean).join(' – '):'');});
    (sec.sc||[]).forEach(([k,l])=>{H.push(`${sec.t} · ${l}`);R.push(ck.voti&&ck.voti[k]!=null?String(ck.voti[k]):'');});
    sec.x.forEach(([k,l])=>{H.push(`${sec.t} · ${l}`);R.push((ck.testi||{})[k]||'');});});
  H.push('Valutazione del teatro','Valutazione dell’hotel','Altre note per la Logistica');
  R.push(...['teatro','hotel'].map(k=>ck.voti&&ck.voti[k]!=null?String(ck.voti[k]):''),(ck.testi||{}).__note||'');return {H,R};}
function ckArchHash(id){const ck=S.c.checklist[id],tp=S.c.tappe[id];return ck&&tp?hstr(JSON.stringify(ckSheet(tp,ck).R)):'';}
async function archCk(id,force){const ck=S.c.checklist[id],tp=S.c.tappe[id];if(!ck||!ck.inviata||!tp)return false;const {H,R}=ckSheet(tp,ck);const h=hstr(JSON.stringify(R));
  if(!force&&archGet()['ck_'+id]===h)return true;const r=await archCall({action:'checklist',id,tour:tp.tour||'',hash:h,header:H,row:R});
  if(r&&r.ok){archSet('ck_'+id,h);return true;}return false;}
/* all'apertura: recupera ciò che non è arrivato sul Drive (es. telefono offline al momento del salvataggio) */
async function archCatchup(){if(S.mode!=='supa'||!navigator.onLine||!(isDir()||role()==='tm'))return;
  try{const {data,error}=await SB.from('docs').select('id,data').eq('coll','archivio');if(error)return;const srv={};(data||[]).forEach(r=>{srv[r.id]=(r.data||{}).hash||'';});
    ARCH_H={...archGet(),...srv};const mine=tp=>isDir()||(tp&&tp.tour===curTour());const todo=[];
    Object.entries(S.c.checklist||{}).forEach(([id,ck])=>{if(ck.inviata&&mine(S.c.tappe[id])&&srv['ck_'+id]!==ckArchHash(id))todo.push(()=>archCk(id,true));});
    Object.values(S.c.piantine||{}).forEach(p=>{if(planArchable(p)&&mine(S.c.tappe[p.tappaId])&&srv['pianta_'+p.id]!==planArchHash(p,S.c.teatri[p.teatroId]))todo.push(()=>archPlan(p.id,true));});

  document.body.appendChild(ov);const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);};const onKey=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',onKey);
  ov.addEventListener('click',e=>{if(e.target.closest('[data-vclose]'))close();else if(e.target.closest('[data-vdl]'))blobSave(id,(title||'file').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.'+(ext||'pdf'));});
  ov.querySelector('[data-vclose]').focus();
  const body=ov.querySelector('.viewer-body');let url;try{url=await blobURL(id);}catch(e){body.innerHTML='<p>Non riesco ad aprire il file.</p>';return;}
  try{
    if(['png','jpg','jpeg','webp','gif'].includes(ext)){body.innerHTML=`<img src="${url}" alt="${esc(title)}">`;}
    else if(ext==='pdf'){await loadScript(PDFJS);await loadScript(PDFJS_W);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_W;
      const buf=await (await fetch(url)).arrayBuffer();const pdf=await lib.getDocument({data:buf,isEvalSupported:false}).promise;body.innerHTML='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const pg=await pdf.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.2,1500/vp0.width)});
        const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);body.appendChild(cv);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;}}
    else body.innerHTML='<p>Anteprima non disponibile per questo tipo di file: usa “Scarica”.</p>';
  }catch(e){body.innerHTML='<p>Non riesco ad aprire il file: prova con “Scarica”.</p>';}
}

function pendenze(tr){const td=today(),hm=nowHM(),out=[];const lim=addDays(td,3),from=addDays(td,-7);
  const list=Object.values(S.c.tappe).filter(t=>t.tour===tr&&t.data>=from&&t.data<=lim).sort((a,b)=>a.data.localeCompare(b.data));
  const giorno=tp=>tp.data===td?'di oggi':tp.data===addDays(td,1)?'di domani':tp.data===addDays(td,-1)?'di ieri':'del '+shortDate(tp.data);
  list.forEach(tp=>{const reps=tp.repliche||[];const first=reps[0]||'';const last=reps.length?repEnd(tp,reps[reps.length-1]):'';const ck=S.c.checklist[tp.id]||{};const c=tp.citta||'';
    const add=(kind,o)=>out.push({id:tp.id+'_'+kind+(o.rep?'_'+o.rep.replace(':',''):''),kind,tour:tr,tappaId:tp.id,data:tp.data,citta:c,...o});
    if(!ck.inviata&&(tp.data<td||(tp.data===td&&last&&hm>=last)))add('check',{lvl:'oggi',dir:'Checklist non inviata',tm:`Ricordati di compilare la checklist ${giorno(tp)} (${c})`,auto:tp.data<td||hm>=addMin(last,60)});
    if(tp.data===td&&first&&hm>=first&&!fotoFor(tp).length)add('foto',{lvl:'oggi',dir:'Foto della scenografia non caricata',tm:`Ricordati di caricare la foto della scenografia (${c})`,auto:true});
    if(tp.data>=td&&!teatroOf(tp))add('sala',{lvl:tp.data===td?'oggi':'prossimi',dir:'Sala da mappare',tm:`Ricordati di mappare la sala ${tp.teatroNome?'del '+tp.teatroNome+' ':''}per la data ${giorno(tp)} (${c})`,auto:false});
    else if(tp.data>=td)reps.forEach(r=>{const st=pStatus(tp,r);
      if(st.k==='stale')add('piantina',{rep:r,lvl:tp.data===td?'oggi':'prossimi',dir:`Piantina ${r}: dati HubSpot cambiati`,tm:`I dati HubSpot della piantina delle ${r} ${giorno(tp)} (${c}) sono cambiati: aggiornala`,auto:tp.data===addDays(td,1)&&hm>='18:00'});
      else if(st.k==='todo'&&st.ds.length)add('piantina',{rep:r,lvl:tp.data===td?'oggi':'prossimi',dir:`Piantina ${r} da creare (${st.ds.length} scuole su HubSpot)`,tm:`Ricordati di preparare la piantina delle ${r} ${giorno(tp)} (${c})`,auto:tp.data===addDays(td,1)&&hm>='18:00'});});
    const ho=tp.hotel;if(ho&&tp.data<=td&&!fattureFor(tp).length&&(tp.data<td||hm>='14:00'))add('fattura',{lvl:'admin',dir:`Fattura hotel non allegata · ${ho.nome||'hotel'}${ho.pagamento==='pagato'?'':' (da pagare in struttura)'}`,tm:`Ricordati di allegare la fattura dell’hotel ${ho.nome||''} (${c})`,auto:false});});
  const v=S.c.impostazioni[vKey(tr)]||{};const rs=(v.letture||[]).map(x=>x.ts).sort();const lastKm=rs.length?rs[rs.length-1].slice(0,10):(v.kmIniTs||'').slice(0,10);
  if(list.some(t=>t.data>=td)&&(!lastKm||lastKm<addDays(td,-7)))out.push({id:'km_'+norm(tr).replace(/[^a-z0-9]+/g,'_'),kind:'km',tour:tr,lvl:'admin',data:td,citta:'',dir:lastKm?'Km del veicolo non aggiornati da più di 7 giorni':'Km del veicolo mai inseriti',tm:'Ricordati di aggiornare i km del veicolo (foto del contachilometri)',auto:false});
  return out;}

/* più scuole P1 nella stessa replica: è un errore del referente, che decide chi va davanti (su HubSpot).
   Con una platea a due blocchi due P1 stanno entrambe davanti (una per blocco): lì non è un problema. */
function twoBlocks(t){if(!t)return false;try{const GT=geomT(t,{});const z=GT.order.find(x=>(x.z.tipo||'platea')==='platea'&&x.G.lines.length);if(!z)return false;
  const first=z.G.lines[0];const f=first.fila;const seats=z.G.lines.filter(l=>l.fila===f).flatMap(l=>l.seats).filter(q=>!q.blocked).map(q=>q.proj).sort((a,b)=>a-b);
  if(seats.length<4)return false;const d=seats.slice(1).map((v,i)=>v-seats[i]);const md=d.slice().sort((a,b)=>a-b)[Math.floor(d.length/2)];const g=d.map((v,i)=>[v,i]).filter(([v])=>v>md*1.8);
  if(g.length!==1)return false;const l=g[0][1]+1;return Math.min(l,seats.length-l)/seats.length>=0.3;}catch(_){return false;}}
function p1Conflict(scuole,t){/* P1 vale dentro il proprio grado: una P1 delle medie e una delle superiori non si contendono il posto */
  const two=()=>twoBlocks(teatroOf({teatroId:t&&t.id})||null);let out=null;
  ['medie','superiori'].forEach(g=>{const ps=(scuole||[]).filter(s=>prioOf(s)==='P1'&&int(s.persone)>0&&(s.livello==='superiori'?'superiori':'medie')===g);
    if(ps.length<2||(ps.length===2&&two()))return;out=(out||[]).concat(ps);});return out;}

function renderControllo(){
  const td=today();const ts=tours();
  let h=`<div class="page-head"><span class="eyebrow">${esc(cap(new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})))}</span><h1>Controllo tournée</h1><p class="muted">Dove sono oggi i tour, se le piantine sono pronte e cosa hanno segnalato i Tour Manager.</p></div>${isDir()?promListHTML()+hsTeatriHTML():''}${isDir()||role()==='venditore'?p1HTML():''}<div class="ctl-grid${isDir()?' has-table':''}">`;
  const tOrd=ts.map(tr=>{const l=Object.values(S.c.tappe).filter(t=>t.tour===tr&&inZone(t)).sort((a,b)=>a.data.localeCompare(b.data));return {tr,d:l.length?l[pickDay(l).i].data:'9999'};}).sort((a,b)=>a.d.localeCompare(b.d)||a.tr.localeCompare(b.tr)).map(x=>x.tr);
  tOrd.forEach(tr=>{const list=Object.values(S.c.tappe).filter(t=>t.tour===tr&&inZone(t)).sort((a,b)=>a.data.localeCompare(b.data));if(!list.length)return;
    const pk=pickDay(list);const tp=list[pk.i];const tm=users().find(u=>u.ruolo==='tm'&&u.tour===tr);
    const past=list.filter(t=>t.data<=td);const last=past[past.length-1];const ck=last?S.c.checklist[last.id]:null;
    const nos=ck&&ck.risposte?ckProblems(ck,role()==='venditore'?REF_CK:null):0;
    const reps=tp.repliche||[];
    h+=`<article class="card ctl"><div class="card-head"><h2>Tour ${esc(tr)}</h2><span class="muted small">${tm?esc(tm.nome):'TM non assegnato'}</span></div>${tm&&(tm.telefono||tm.chat)?`<div class="row-btns">${contactBtns(tm,tm.telefono)}</div>`:''}
      <div class="ctl-day"><span class="eyebrow">${pk.kind==='oggi'?'Oggi':pk.kind==='prossima'?'Prossima data':'Ultima data'}</span><b>${esc(cap(shortDate(tp.data)))} · ${esc(tp.citta)}</b><span class="muted small">${esc(tp.teatroNome||'')}</span></div>
      <div class="ctl-row"><span class="flabel">Piantine</span>${reps.map(r=>{const st=pStatus(tp,r);const lk=st.p&&plLocked(st.p);return `<span class="pill ${st.k==='ok'?'ok':st.k==='stale'?'bad':'warn'}">${esc(r)} · ${st.l}${lk?' · bloccata':''}</span>`;}).join('')}</div>
      <div class="ctl-row"><span class="flabel">Ultima checklist</span>${!last?'<span class="muted small">Nessuna data passata</span>':ck&&ck.inviata?`<span class="pill ${nos?'warn':'ok'}">${fmtDate(last.data)} · ${nos?nos+' segnalazioni':'tutto ok'}</span>`:`<span class="pill bad">${fmtDate(last.data)} · non inviata</span>`}</div>
      ${(()=>{const fs=fotoFor(tp);return `<div class="ctl-row"><span class="flabel">Scenografia</span>${fs.length?thumbs(fs.slice(-2)):'<span class="muted small">Nessuna foto per questa data</span>'}</div>`;})()}
      <div class="row-btns"><button class="btn small primary" data-ctl="${tp.id}">Apri la giornata</button><button class="btn small" data-ctlmap="${esc(tr)}">Mappa</button></div></article>`;});
  h+=`</div>`;
  if(!tOrd.some(tr=>Object.values(S.c.tappe).some(t=>t.tour===tr&&inZone(t))))h+=`<div class="empty"><b>${S.ready?(role()==='venditore'?'Nessuna data in calendario nella tua zona.':'Nessuna data in calendario.'):'Carico…'}</b>${S.ready&&role()==='venditore'?'<p class="muted small">Quando un tour avrà date nelle tue regioni, le vedrai qui.</p>':''}</div>`;
  if(isDir()&&ts.length){h+=`<div class="ctl-table-wrap"><h2 class="alt-sec">Tutti i tour</h2><table class="ctl-table"><thead><tr><th>Tour</th><th>Tour Manager</th><th>Giornata</th><th>Piantine</th><th>Ultima rappresentazione</th><th>Da sistemare</th><th></th></tr></thead><tbody>`;
    tOrd.forEach(tr=>{const list=Object.values(S.c.tappe).filter(t=>t.tour===tr).sort((a,b)=>a.data.localeCompare(b.data));if(!list.length)return;const pk=pickDay(list);const tp=list[pk.i];
      const tm=users().find(u=>u.ruolo==='tm'&&u.tour===tr);const reps=tp.repliche||[];const okP=reps.filter(r=>pStatus(tp,r).k==='ok').length;
      const past=list.filter(t=>t.data<=td);const last=past[past.length-1];const ck=last?S.c.checklist[last.id]:null;const fs=fotoFor(tp);
      const v=S.c.impostazioni[vKey(tr)]||{};let km='—';if(v.kmIniziali!=null&&v.kmIniziali!==''||(v.letture||[]).length){const save=S.pref.tour;S.pref.tour=tr;const est=kmEstimate();S.pref.tour=save;km=est?est.km.toLocaleString('it-IT'):'—';}
      const iss=list.filter(t=>t.data>=td).reduce((a,t)=>a+dayIssues(t).length,0);
      h+=`<tr><td><b><span class="dot" style="background:${tourCol(tr)}"></span>${esc(tr)}</b></td><td>${tm?esc(tm.nome):'—'}</td><td>${esc(cap(shortDate(tp.data)))} · ${esc(tp.citta)}</td>
       <td><span class="pill ${okP===reps.length?'ok':'warn'}">${okP}/${reps.length} pronte</span></td>
       <td>${esc(cap(shortDate(list[list.length-1].data)))} · ${esc(list[list.length-1].citta)}</td>
       <td>${iss?`<span class="pill warn">⚠ ${iss}</span>`:'<span class="muted small">—</span>'}</td><td class="nowrap"><button class="btn small" data-ctl="${tp.id}">Apri</button> <button class="btn small ghost" data-ctlmap="${esc(tr)}">Mappa</button></td></tr>`;});
    h+=`</tbody></table></div>`;}
  app.innerHTML=h;
}
document.addEventListener('click',e=>{if(V.name!=='controllo')return;const b=e.target.closest('[data-ctl]');if(b){const tp=S.c.tappe[b.dataset.ctl];S.pref.tour=tp.tour;savePref();goFrom('oggi',{dayId:tp.id});return;}
  const m=e.target.closest('[data-ctlmap]');if(m){S.pref.tour=m.dataset.ctlmap;savePref();goFrom('mappa');}});

  const missing=list.filter(t=>t.lat==null);
  app.innerHTML=`<div class="page-head"><span class="eyebrow">${esc(tourLbl())}</span><h1>Mappa della tournée</h1><p class="muted">${list.length} date · in evidenza la tappa in corso e la successiva. Tocca un puntino per aprire la tappa.</p></div>
   <div class="mp-wrap"><div class="mp-map card">${svg}<div class="row-btns" style="justify-content:flex-end"><button class="btn small ghost" data-mpall>${V.mapAll?'Zoom sul tour':'Tutta Italia'}</button></div><div class="mp-leg">${ALLM?[...new Set(list.map(t=>t.tour))].map(tr=>`<span><i class="lg" style="background:${tourCol(tr)};border-color:${tourCol(tr)}"></i>${esc(tr)}</span>`).join(''):''}<span><i class="lg past"></i>Fatta</span><span><i class="lg cur"></i>In corso</span><span><i class="lg"></i>Da fare</span><span><i class="lg iss"></i>Da sistemare</span><span><i class="lg reg"></i>Regioni del tour</span></div><p class="mp-src">Confini regionali: ISTAT (CC BY 4.0)</p></div>${prev||'<div class="mp-prev card"><p class="muted">Tocca una tappa.</p></div>'}</div>
   ${missing.length?`<p class="muted small">Senza posizione sulla mappa: ${missing.map(t=>esc(t.citta)).join(', ')}.</p>`:''}`;
}
document.addEventListener('click',e=>{if(V.name!=='mappa')return;if(e.target.closest('[data-mpall]')){V.mapAll=!V.mapAll;render();return;}const p=e.target.closest('[data-mp]');if(p){V.mapSel=+p.dataset.mp;render();return;}
  const b=e.target.closest('[data-mpgo]');if(b){const tp=S.c.tappe[b.dataset.mpgo];if(tp&&S.pref.tour===ALL){S.pref.tour=tp.tour;savePref();}goFrom('oggi',{dayId:b.dataset.mpgo,from:'mappa'});}});
document.addEventListener('keydown',e=>{if(V.name==='mappa'&&e.target.dataset&&e.target.dataset.mp&&(e.key==='Enter'||e.key===' ')){e.preventDefault();V.mapSel=+e.target.dataset.mp;render();}});

/* ---------- accessi (Direzione) ---------- */
function renderAccessi(){
  if(!isDir()){app.innerHTML=`<div class="empty"><b>Sezione riservata alla Direzione.</b></div>`;return;}
  const lista=V.accEdit||clone(users());V.accEdit=lista;const ts=allTours();
  V.accOpen=V.accOpen||new Set();
  let h=`<div class="page-head"><span class="eyebrow">Direzione</span><h1>Accessi</h1><p class="muted">Ogni persona entra con la sua email Mater Lingua. Il ruolo decide cosa vede; al Tour Manager si assegna il suo tour.</p></div>
  <div class="t-filters" style="max-width:900px"><input class="in" id="accQ" type="search" placeholder="Cerca nome, email, tour o regione" value="${esc(V.accQ||'')}" aria-label="Cerca persone" style="flex:1 1 240px"><button class="btn" data-aadd>+ Aggiungi persona</button></div><div class="acc-list">`;
  const sub=u=>u.ruolo==='tm'?(u.tour||'Tour da assegnare'):u.ruolo==='venditore'?[u.area?'Area '+u.area:'',(u.regioni||[]).join(', ')].filter(Boolean).join(' · ')||'Regioni da assegnare':(u.reparto||'');
  ['direzione','venditore','tm'].forEach(rl=>{const idx=lista.map((u,i)=>i).filter(i=>(lista[i].ruolo||'tm')===rl);if(!idx.length)return;
   h+=`<div class="acc-group"><span class="tmonth">${esc(ROLE_L[rl])} · ${idx.length}</span>`;
   idx.forEach(i=>{const u=lista[i];const open=V.accOpen.has(i);
    h+=`<div class="card acc ${open?'open':''}" data-acc="${i}" data-s="${esc(norm([u.nome,u.email,u.tour,u.reparto,(u.regioni||[]).join(' '),u.area?'area '+u.area:''].join(' ')))}">
     <button class="acc-row" data-atog="${i}" aria-expanded="${open}"><span class="tmain"><b>${esc(u.nome||'Nuova persona')}</b><span class="muted small">${esc(u.email||'email da inserire')}${sub(u)?' · '+esc(sub(u)):''}</span></span>
      ${accStato(u)}${u.nota?'<span class="pill warn" title="'+esc(u.nota)+'">Nota</span>':''}<span class="acc-chev" aria-hidden="true">${open?'▴':'▾'}</span></button>`;
    if(!open){h+='</div>';return;}
    h+=`<div class="grid2">
    <div class="field"><label>Nome e cognome</label><input class="in" data-af="nome" value="${esc(u.nome||'')}"></div>
    <div class="field"><label>Email</label><input class="in" data-af="email" type="email" value="${esc(u.email||'')}" placeholder="nome@materlingua.eu"></div>
    <div class="field"><label>Ruolo</label><select class="in" data-af="ruolo">${Object.keys(ROLE_L).map(r=>`<option value="${r}" ${u.ruolo===r?'selected':''}>${ROLE_L[r]}</option>`).join('')}</select></div>
    ${u.ruolo==='tm'?`<div class="field"><label>Tour</label><select class="in" data-af="tour"><option value="">Nessuno</option>${ts.map(t=>`<option ${u.tour===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`
     :u.ruolo==='venditore'?`<div class="field"><label>Regioni (separate da virgola)</label><input class="in" data-af="regioni" value="${esc((u.regioni||[]).join(', '))}" placeholder="Piemonte, Liguria"></div>
       <div class="field"><label>Area</label><input class="in" data-af="area" value="${esc(u.area||'')}" placeholder="es. 6"></div>
       <div class="field"><label>Telefono per i TM</label><input class="in" data-af="telefono" type="tel" value="${esc(u.telefono||'')}" placeholder="Vuoto = numero Mater Lingua"></div>
       <div class="field"><label>Link alla chat Google</label><input class="in" data-af="chat" type="url" value="${esc(u.chat||'')}" placeholder="https://mail.google.com/chat/…"></div>`
     :`<div class="field"><label>Reparto</label><select class="in" data-af="reparto">${repartiList(u.reparto).map(x=>`<option ${x===(u.reparto||'')?'selected':''} value="${esc(x)}">${esc(x||'— Scegli —')}</option>`).join('')}</select></div>`}
    <div class="field" style="grid-column:1/-1"><label>Nota sul contatto</label><input class="in" data-af="nota" value="${esc(u.nota||'')}" placeholder="es. Non chiamare durante il congedo"></div>
    </div><div class="row-btns">${V.accDel===i?`<button class="btn small danger" data-adelok="${i}">Conferma: togli l’accesso</button>`:`<button class="btn small ghost" data-adel="${i}">Togli l’accesso</button>`}</div></div>`;});
   h+='</div>';});
  h+=`</div><div class="acc-save"><span class="muted small">${V.accDirty?'Hai modifiche non salvate':'Tocca una persona per modificarla'}</span><button class="btn primary" data-asave>Salva gli accessi</button></div>`;
  const ct=S.c.impostazioni.contatti||{};
  h+=`<section class="card" style="margin-top:16px;max-width:640px"><div class="card-head"><h2>Numero Mater Lingua per i TM</h2></div>
    <p class="muted small" style="margin:0">Il TM lo chiama per il referente di zona quando il referente non ha un numero suo.</p>
    <div class="grid2"><div class="field"><label for="numML">Numero da chiamare</label><input class="in" id="numML" type="tel" value="${esc(ct.numeroML||'')}" placeholder="es. 051 000 0000"></div>
    <div class="field"><label for="numWA">Numero WhatsApp (Rasayel)</label><input class="in" id="numWA" type="tel" value="${esc(ct.numeroWA||'')}" placeholder="se diverso, es. +39 333 000 0000"></div></div>
    <p class="muted small" style="margin:0">Il TM li vede quando il referente di zona non usa ancora l’app. Se il WhatsApp è vuoto si usa il numero da chiamare.</p>
    <div class="row-btns"><button class="btn small primary" data-numml>Salva i numeri</button></div></section>`;
  app.innerHTML=h+spCard();filterAcc();
}
function filterAcc(){const q=norm(V.accQ||'');document.querySelectorAll('.acc[data-s]').forEach(c=>{c.hidden=!!q&&!q.split(/\s+/).every(w=>c.dataset.s.includes(w));});
  document.querySelectorAll('.acc-group').forEach(g=>{g.hidden=![...g.querySelectorAll('.acc')].some(c=>!c.hidden);});}
document.addEventListener('input',e=>{if(V.name==='accessi'&&e.target.id==='accQ'){V.accQ=e.target.value;filterAcc();}});
document.addEventListener('input',e=>{if(V.name!=='accessi')return;const c=e.target.closest('[data-acc]');if(c&&e.target.dataset.af&&!V.accDirty){V.accDirty=true;const s=document.querySelector('.acc-save .muted');if(s)s.textContent='Hai modifiche non salvate';}const f=e.target.dataset.af;if(!c||!f)return;const u=V.accEdit[+c.dataset.acc];
  u[f]=f==='regioni'?e.target.value.split(',').map(x=>x.trim()).filter(Boolean):e.target.value;if(f==='ruolo')render();});
document.addEventListener('change',e=>{if(V.name!=='accessi')return;const c=e.target.closest('[data-acc]');const f=e.target.dataset.af;if(!c||!f||e.target.tagName!=='SELECT')return;V.accEdit[+c.dataset.acc][f]=e.target.value;if(f==='ruolo')render();});
document.addEventListener('click',async e=>{if(V.name!=='accessi')return;
  if(e.target.closest('[data-numml]')){try{await putImp('contatti',{numeroML:document.getElementById('numML').value.trim(),numeroWA:document.getElementById('numWA').value.trim()});toast('Numeri salvati');}catch(err){toast('Non salvato ('+(err.code||err.message)+')','bad');}return;}
  if(e.target.closest('[data-aadd]')){V.accEdit.push({nome:'',email:'',ruolo:'tm',tour:''});V.accOpen.add(V.accEdit.length-1);V.accDirty=true;V.accQ='';render();const el=document.querySelector(`[data-acc="${V.accEdit.length-1}"] [data-af="nome"]`);if(el){el.scrollIntoView({block:'center'});el.focus();}return;}
  const tg=e.target.closest('[data-atog]');if(tg){const i=+tg.dataset.atog;V.accOpen.has(i)?V.accOpen.delete(i):V.accOpen.add(i);render();return;}
  const d=e.target.closest('[data-adel]');if(d){V.accDel=+d.dataset.adel;render();return;}
  const k=e.target.closest('[data-adelok]');if(k){V.accEdit.splice(+k.dataset.adelok,1);V.accDel=null;V.accOpen=new Set();V.accDirty=true;render();return;}
  if(e.target.closest('[data-asave]')){const lista=V.accEdit.filter(u=>u.email).map(u=>({...u,email:u.email.trim().toLowerCase()}));
    if(!lista.some(u=>u.ruolo==='direzione')){toast('Serve almeno una persona della Direzione','bad');return;}
    try{await put('impostazioni','utenti',{lista});S.c.impostazioni.utenti={lista};V.accEdit=null;V.accDirty=false;V.accOpen=new Set();toast('Accessi salvati');render();}catch(err){toast('Non salvati ('+(err.code||err.message)+')','bad');}}
});

loadPref();applyTheme();
if(landingToken()){renderLanding();initStore().then(()=>{});}else{render();initStore();}
</script>

</body></html>
