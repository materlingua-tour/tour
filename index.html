<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#196457">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
</head><body>
<title>Tour Manager Mater Lingua</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app del Tour Manager. Menu fisso a sinistra (in basso sul telefono), contenuto a schede; la mappa della sala resta lo spazio dominante nelle viste di lavoro. */
:root{
  --hl-bg:#FFF6D6; --hl-bd:#F2D27A; --hl-ink:#5A4300; --mark:#FFE58A; --mark-ink:#1B1A10;
  --note-bg:#EAF1FB; --note-bd:#3B6FB6; --note-ink:#2C578F;
  --brand:#196457; --brand-ink:#FFFFFF; --brand-soft:#E3EFEB; --brand-deep:#133029;
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#F5F8F7; --canvas:#FAFCFB;
  --ink:#14201D; --muted:#56645F; --line:#D3DDDA;
  --accent:#196457; --accent-ink:#FFFFFF;
  --seat:#E0E6E4; --seat-stroke:#A6B4AF; --seat-ink:#46534F; --blocked:#8C9894;
  --stage:#1E2B28; --stage-ink:#E7EFEC;
  --ok:#23724A; --ok-soft:#DFF1E6; --warn:#A35A0E; --warn-soft:#FBEBD8; --bad:#B3261E; --bad-soft:#F8E1DF;
  --f-ui:'Work Sans','Segoe UI',Arial,sans-serif;
  --f-head:'Work Sans','Segoe UI',Arial,sans-serif;
  --side-bg:#244639; --side-ink:#FFFFFF; --side-muted:#B9CDC6; --gold:#ACA077;
  --r:12px; --side:236px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --hl-bg:#2E2610; --hl-bd:#7A6420; --hl-ink:#F3DE9A; --mark:#5C4A12; --mark-ink:#FFF3C4;
  --note-bg:#14243A; --note-bd:#5B8FD6; --note-ink:#A9C6EE;
  --brand:#5DBBA5; --brand-ink:#06221C; --brand-soft:#16352E; --brand-deep:#9ED9CA;
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --canvas:#111A17;
  --ink:#E3ECE9; --muted:#9AABA5;
  --line:#293733;
  --accent:#5DBBA5; --accent-ink:#06221C;
  --seat:#2F3D39; --seat-stroke:#51625C; --seat-ink:#C7D3CF; --blocked:#5B6A65;
  --stage:#3E4E49; --stage-ink:#F0F5F3; --side-bg:#11221D; --side-ink:#E3ECE9; --side-muted:#9AB2AA;
  --ok:#5FC28A; --ok-soft:#163222; --warn:#E9A25A; --warn-soft:#3A2714; --bad:#F08479; --bad-soft:#3B1A18;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --hl-bg:#2E2610; --hl-bd:#7A6420; --hl-ink:#F3DE9A; --mark:#5C4A12; --mark-ink:#FFF3C4;
  --note-bg:#14243A; --note-bd:#5B8FD6; --note-ink:#A9C6EE;
  --brand:#5DBBA5; --brand-ink:#06221C; --brand-soft:#16352E; --brand-deep:#9ED9CA;
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --canvas:#111A17;
  --ink:#E3ECE9; --muted:#9AABA5; --line:#293733;
  --accent:#5DBBA5; --accent-ink:#06221C;
  --seat:#2F3D39; --seat-stroke:#51625C; --seat-ink:#C7D3CF; --blocked:#5B6A65;
  --stage:#3E4E49; --stage-ink:#F0F5F3; --side-bg:#11221D; --side-ink:#E3ECE9; --side-muted:#9AB2AA;
  --ok:#5FC28A; --ok-soft:#163222; --warn:#E9A25A; --warn-soft:#3A2714; --bad:#F08479; --bad-soft:#3B1A18;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* SHELL */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--side-bg);color:var(--side-ink);border-right:0;
  display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px))}
@media (min-width:901px){.side{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.side>*{flex-shrink:0}}
.logo{display:block;width:132px;height:71px;background:var(--brand);flex:none}
.logo{-webkit-mask:url(logo.png) no-repeat left center/contain;mask:url(logo.png) no-repeat left center/contain}
.side .logo{background:#FFFFFF;-webkit-mask:url(logo.png) no-repeat left center/contain;mask:url(logo.png) no-repeat left center/contain}
.side-sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
.side .side-sub,.side .flabel,.side .store-pill{color:var(--side-muted)}
.side .in{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:var(--side-ink)}
.side select.in option{color:#14201D}
#navList{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;font-size:16px;text-align:left;color:var(--side-ink)}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.on{background:#FFFFFF;color:#133029}
.nav-item:focus-visible{outline-color:#FFFFFF}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .in{width:100%}
.store-pill{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.store-pill.db::before{background:var(--ok)}
.store-pill.local::before{background:var(--warn)}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main-in{max-width:1400px;margin-inline:auto}
@media (min-width:901px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:25;flex-direction:row;border-right:0;border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  .side .logo,.side .side-sub,.side .side-id,.side-foot{display:none!important}
  #navList{flex-direction:row;flex:1;justify-content:space-around}
  .nav-item{flex-direction:column;gap:2px;min-height:52px;padding:4px 6px;font-size:12px;flex:1;justify-content:center;text-align:center}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mtop .logo{width:96px;height:52px}
.mtop .in{max-width:170px}

/* BASE */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
a.btn{text-decoration:none;color:var(--ink)}a.btn.primary{color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
h1{font-family:var(--f-head);font-weight:700;font-size:32px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
h3{margin:0;font-family:var(--f-head);font-size:18px;font-weight:700}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--brand)}
h2{text-transform:uppercase;letter-spacing:.03em;font-size:17px;color:var(--brand)}
.card-title{color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14px}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.in,select.in{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:0}
.in.ta{padding:10px 12px;min-height:64px;resize:vertical;width:100%;line-height:1.4}
.in:focus{border-color:var(--brand)}
.in[disabled]{opacity:.45}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:#FF7A59;color:#2D0E05}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;max-width:75ch}
.page-head p{margin:0}
.empty{background:var(--surface);border:1px dashed var(--seat-stroke);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-weight:700;font-size:17px}
.card-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:3px}
.newp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.icon-btn.confirm{width:auto;padding:0 10px;font-size:13px;font-weight:700;color:var(--bad);border-color:var(--bad)}

/* OGGI */
.day-head{flex-direction:row;align-items:flex-start;gap:14px;max-width:none}
.day-nav{display:flex;gap:6px;padding-top:2px}
.day-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.day-grid .span2{grid-column:span 2}
@media (max-width:1100px){.day-grid{grid-template-columns:minmax(0,1fr)}.day-grid .span2{grid-column:auto}}
.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.timeline>div{display:flex;flex-direction:column;padding:10px 14px;border-radius:10px;background:var(--surface-2);min-width:110px}
.timeline b{font-family:var(--f-head);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.timeline span{font-size:13px;color:var(--muted);font-weight:600}
.timeline .tl-rep{background:var(--brand);color:var(--brand-ink)}
.timeline small{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.timeline .tl-dep{background:var(--brand-soft)}
.timeline .tl-dep span{color:var(--brand-deep)}
.timeline .tl-rep span{color:var(--brand-ink);opacity:.85}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 20px;margin:6px 0 0}
.facts dt{font-size:13px;font-weight:600;color:var(--muted)}
.facts dd{margin:0}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--surface-2)}
.prow-t{display:flex;align-items:center;gap:10px}
.prow-t b{font-family:var(--f-head);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo li:last-child{border-bottom:0}
.todo-l{flex:1 1 200px;min-width:0}
.todo li.done .todo-l{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--seat-stroke)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--seat-stroke);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;cursor:pointer;color:var(--brand-ink);padding:0}
span.tick{cursor:default;border-style:dashed}
.tick.on{background:var(--brand);border-color:var(--brand);border-style:solid}

/* TOURNÉE */
.tlist{display:flex;flex-direction:column;gap:6px;max-width:980px}
.tmonth{font-family:var(--f-head);font-weight:700;font-size:18px;margin:14px 0 4px}
.trow{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.trow:hover{border-color:var(--brand)}
.trow.today{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.tdate{display:flex;flex-direction:column;align-items:center;width:46px;flex:none}
.tdate b{font-family:var(--f-head);font-size:24px;font-weight:800;line-height:1}
.tdate span{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.tmain{display:flex;flex-direction:column;flex:1;min-width:0}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.stale{background:var(--bad)}
@media (max-width:640px){.trow{flex-wrap:wrap}.tmeta{width:100%;justify-content:flex-start;padding-left:60px}}

/* CHECKLIST */
.ck-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1100px){.ck-wrap{grid-template-columns:minmax(0,1fr)}}
.ck-q{display:flex;flex-direction:column;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ck-l{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;cursor:pointer;font-weight:600;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.bad{background:var(--bad);color:#fff}
.seg.sm button{min-height:38px;padding:0 12px}
.send-bar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
@media (max-width:900px){.send-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* AREA DI LAVORO */
.ws-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ws-top .grow{flex:1 1 220px;min-width:0;display:flex;gap:8px;flex-wrap:wrap}
.ws-top .grow .in{flex:1 1 160px}
.ws-title{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ws-title b{font-size:19px;font-family:var(--f-head)}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:1180px){.ws{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;max-width:230px}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:4px;flex:none}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.hint{font-size:15px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px}
.hs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.hs.alert{border-color:var(--bad)}
.hs-logo{font-weight:800;font-size:14px;color:#2D0E05;background:#FF7A59;border-radius:6px;padding:2px 8px}
.hs .btn{margin-left:auto}
.canvas-wrap{overflow:auto;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 250px);min-height:320px;-webkit-overflow-scrolling:touch}
@media (max-width:1180px){.canvas-wrap{max-height:62vh}}
.canvas{min-width:100%}
.canvas svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.canvas-wrap.painting svg{touch-action:none;cursor:crosshair}
.canvas-wrap.picking svg{cursor:crosshair}
#map text{font-family:var(--f-ui);text-anchor:middle;pointer-events:none;font-weight:700}
#map .st{cursor:pointer}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend-row b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tec-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}.tec-form .field{min-width:0}@media (max-width:420px){.tec-form{grid-template-columns:1fr}}
.guide{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.preview{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.rules .guide{margin-top:8px}
.schools{display:flex;flex-direction:column;gap:10px}
.school{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.school.on{border-color:var(--ink)}
.school-head{display:flex;gap:8px;align-items:center}
.school-head .in{flex:1;font-weight:600}
.school-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:9px;border:2px solid transparent;cursor:pointer;flex:none}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.school-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}

<script>
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_W='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const PALETTE=['#3B6FB6','#E07B28','#8A5BB0','#C8414B','#D9B22B','#2E9C9A','#D96BA0','#8C6A4F','#7FB53B','#4FA3E0','#6B7A8F','#B5562C'];
const TIPO_L={platea:'Platea',galleria:'Galleria',palchi:'Palchi'};
const TIPO_O={platea:0,galleria:1,palchi:2};
const LVL_L={medie:'Medie',superiori:'Superiori'};
const COLLS=['teatri','piantine','tappe','deals','checklist','cast','documenti','impostazioni','foto','consigli','note'];
const CONFIRMED=['Chiuso vinto','Pagamento completato','Fattura inviata'];

const S={mode:'pending',db:null,assets:null,downloads:null,ready:false,c:{teatri:{},piantine:{},tappe:{},deals:{},checklist:{},cast:{},documenti:{},impostazioni:{},foto:{},consigli:{},note:{}},pref:{tour:'',tm:''}};
let V={name:'oggi'};
const app=document.getElementById('app');

/* ---------- utilità ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function f2(n){return Math.round(n*100)/100;}
function int(v){const n=parseInt(v);return isNaN(n)?0:Math.max(0,n);}
function normAng(a){while(a>90)a-=180;while(a<=-90)a+=180;return a;}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
function dObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function longDate(s){return dObj(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});}
function shortDate(s){return dObj(s).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function addDays(s,n){const d=dObj(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addMin(hm,m){if(!hm||!/^\d{1,2}:\d{2}$/.test(hm))return '';const [h,mi]=hm.split(':').map(Number);let t=h*60+mi+m;t=(t+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function inkFor(hex){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16)/255,g=parseInt(h.substr(2,2),16)/255,b=parseInt(h.substr(4,2),16)/255;
  const L=[r,g,b].map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return (0.2126*L[0]+0.7152*L[1]+0.0722*L[2])>0.36?'#17202B':'#FFFFFF';}
let toastT;
function toast(msg,kind){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}
  el.className='toast'+(kind?' '+kind:'');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3400);}
const scriptP={};
function loadScript(src){if(!scriptP[src])scriptP[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scriptP[src];rej(new Error('Impossibile caricare la libreria'));};document.head.appendChild(s);});return scriptP[src];}
function distSeg(x,y,s){const dx=s.x2-s.x1,dy=s.y2-s.y1;const L=dx*dx+dy*dy;let t=L?((x-s.x1)*dx+(y-s.y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(s.x1+t*dx),y-(s.y1+t*dy));}
function svgPoint(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function zcol(s){return PALETTE[(s.c||0)%PALETTE.length];}
function isPhone(){return window.matchMedia('(max-width:640px)').matches;}
function startZoom(){return isPhone()?2:1;}
function centerOnce(wrapId){if(V.centered)return;const w=document.getElementById(wrapId);if(!w)return;V.centered=true;requestAnimationFrame(()=>{w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.scrollTop=Math.max(0,w.scrollHeight-w.clientHeight);});}
function mapsUrl(dest,origin){return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest||'')+(origin?'&origin='+encodeURIComponent(origin):'');}
function addrLink(addr,label){return addr?`<a class="link" href="${esc(mapsUrl(addr))}" target="_blank" rel="noopener" title="Apri le indicazioni in Google Maps">${esc(label||addr)}</a>`:'';}
function fmtMin(m){m=int(m);return m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min':m+' min';}
function traffic(v){if(!v||!v.min)return '';const r=(v.minTraffico||v.min)/v.min;
  return r<=1.1?'<span class="pill ok">Traffico scorrevole</span>':r<=1.3?'<span class="pill warn">Traffico moderato</span>':'<span class="pill bad">Traffico intenso</span>';}
async function copyText(txt,okMsg){try{await navigator.clipboard.writeText(txt);toast(okMsg||'Copiato');}catch(e){toast('Copia non riuscita: seleziona il testo a mano','warn');}}

/* ---------- modello dati ---------- */
function normT(t){t=clone(t);
  if(!t.zone){t.zone=[{id:'z1',nome:'Platea',tipo:'platea',w:t.w||1000,h:t.h||1000,bg:t.bg||null,front:t.stage||null,rows:t.rows||[]}];
    delete t.rows;delete t.stage;delete t.bg;delete t.w;delete t.h;}
  t.zone.forEach(z=>{z.rows=z.rows||[];z.w=z.w||1000;z.h=z.h||1000;});return t;}
function seatsTot(t){return t.zone.reduce((a,z)=>a+z.rows.reduce((b,r)=>b+r.posti.length-(r.bloccati||[]).length,0),0);}
function prioOf(s){if(s.priorita===true)return 'P1';return s.priorita==='P1'||s.priorita==='P2'?s.priorita:'';}

/* ---------- archivio ---------- */
const LS='piantine-sala-v2',PREF='piantine-sala-pref';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');COLLS.forEach(c=>S.c[c]=d[c]||{});Object.keys(S.c.teatri).forEach(k=>S.c.teatri[k]=normT(S.c.teatri[k]));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.c));}catch(e){}}
function loadPref(){try{Object.assign(S.pref,JSON.parse(localStorage.getItem(PREF)||'{}'));}catch(e){}}
function savePref(){try{localStorage.setItem(PREF,JSON.stringify(S.pref));}catch(e){}}
/* ---------- versione web (Supabase): attiva solo se c'è config.js ---------- */
const CFG=window.ML_CFG||null;let SB=null;
const SUPA_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js';
function isPriv(id){return /^priv_/.test(id||'');}
function B(id){if(!id)return '';if(!CFG)return '/_blob/'+id;return CFG.url+'/storage/v1/object/public/pub/'+encodeURIComponent(id);}
async function blobURL(id){if(!CFG||!isPriv(id))return B(id);const {data,error}=await SB.storage.from('priv').createSignedUrl(id,600);if(error)throw error;return data.signedUrl;}
async function upAsset(blob,priv){if(!S.assets)throw {code:'assets_unavailable'};return CFG?S.assets.upload(blob,priv):S.assets.upload(blob);}
function sbErr(e){return {code:(e&&(e.code||e.message))||'errore'};}
async function initSupa(){
  await loadScript(SUPA_JS);SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce',lock:async(_n,_t,fn)=>await fn()}});
  S.mode='supa';setPill();
  S.assets={upload:async(blob,priv)=>{const ext=((blob.type||'').split('/')[1]||'bin').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');
      const id=(priv?'priv_':'')+uid('f')+'.'+ext;const {error}=await SB.storage.from(priv?'priv':'pub').upload(id,blob,{contentType:blob.type||'application/octet-stream',upsert:false});if(error)throw sbErr(error);return {id};}};
  S.downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}};
  const tok=landingToken();
  if(tok){const m=tok.match(/^sala-([A-Za-z0-9_.-]+)~/);if(m){const {data}=await SB.rpc('landing',{pid:m[1]});
      if(data&&data.piantina){S.c.piantine[m[1]]={...data.piantina,id:m[1]};if(data.teatro)S.c.teatri[data.teatroId]=normT({...data.teatro,id:data.teatroId});
        if(data.tappa)S.c.tappe[data.tappaId]={...data.tappa,id:data.tappaId};if(data.spettacoli)S.c.impostazioni.spettacoli=data.spettacoli;}}
    S.ready=true;renderLanding();return;}
  const {data:{session}}=await SB.auth.getSession();
  SB.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){S.pref.user='';savePref();V={name:'welcome'};render();}});
  if(!session){S.pref.user='';S.ready=true;V={name:'welcome'};render();return;}
  S.pref.user=(session.user.email||'').toLowerCase();savePref();
  await loadAllSupa();S.ready=true;onData();
  const RT={};SB.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const c=(p.new&&p.new.coll)||(p.old&&p.old.coll);if(!c||!COLLS.includes(c))return;clearTimeout(RT[c]);RT[c]=setTimeout(()=>loadCollSupa(c).then(()=>onData(c)),1500);}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready)loadAllSupa().then(()=>onData());});
}
async function loadCollSupa(c){const data=[];for(let from=0;;from+=1000){const {data:part,error}=await SB.from('docs').select('id,data').eq('coll',c).order('id').range(from,from+999);if(error){toast('Archivio non raggiungibile ('+(error.code||error.message)+')','bad');return;}data.push(...part);if(part.length<1000)break;}
  const o={};data.forEach(r=>{o[r.id]={...r.data,id:r.id};if(c==='teatri')o[r.id]=normT(o[r.id]);});S.c[c]=o;}
async function loadAllSupa(){await Promise.all(COLLS.map(loadCollSupa));}

function tours(){const u=me();const all=allTours();if(!u)return all;
  if(u.ruolo==='tm')return all.filter(t=>t===u.tour);if(u.ruolo==='venditore')return all.filter(tr=>Object.values(S.c.tappe).some(t=>t.tour===tr&&inZone(t)));return all;}
function curTour(){const ts=tours();return ts.includes(S.pref.tour)?S.pref.tour:(ts[0]||'');}
function tourTappe(){const tr=curTour();return Object.values(S.c.tappe).filter(t=>t.tour===tr&&inZone(t)).sort((a,b)=>a.data.localeCompare(b.data));}
function pickDay(list){const td=today();let i=list.findIndex(t=>t.data===td);if(i>=0)return {i,kind:'oggi'};
  i=list.findIndex(t=>t.data>td);if(i>=0)return {i,kind:'prossima'};return {i:list.length-1,kind:'passata'};}
function teatroOf(tp){return tp&&tp.teatroId?S.c.teatri[tp.teatroId]:null;}
function findP(tappaId,rep){return Object.values(S.c.piantine).find(p=>p.tappaId===tappaId&&p.replica===rep);}
function sameTour(d,tp){return !d.tour||!tp.tour||d.tour===tp.tour;}
function dealsFor(tp,rep){return Object.values(S.c.deals).filter(d=>d.data===tp.data&&d.replica===rep&&norm(d.citta)===norm(tp.citta)&&sameTour(d,tp));}
function dealsHash(ds){return ds.filter(d=>d.stage!=='Chiuso perso').map(d=>[d.id,d.studenti,d.accompagnatori,d.disabili,d.grado,d.note,d.stage].join('|')).sort().join('#');}
function pStatus(tp,rep){const p=findP(tp.id,rep);const ds=dealsFor(tp,rep);
  if(!p)return {k:'todo',l:'Da creare',p:null,ds};
  if(p.hubspot&&ds.length&&p.hubspot.hash!==dealsHash(ds))return {k:'stale',l:'HubSpot cambiato',p,ds};
  const n=p.scuole.length;if(!n)return {k:'todo',l:'Senza scuole',p,ds};
  return {k:'ok',l:'Pronta',p,ds};}
function prevTappa(tp){const l=tourTappe();const i=l.findIndex(x=>x.id===tp.id);return i>0?l[i-1]:null;}
function nextTappa(tp){const l=tourTappe();const i=l.findIndex(x=>x.id===tp.id);return i>=0&&i<l.length-1?l[i+1]:null;}
function hotelPill(h){if(!h)return '';return h.pagamento==='pagato'?'<span class="pill ok">Hotel pagato</span>':'<span class="pill warn">Hotel da pagare</span>';}

/* ---------- import HubSpot ---------- */
function nextColor(p){const used=new Set(p.scuole.map(s=>s.c));let c=0;while(used.has(c)&&c<PALETTE.length)c++;return c>=PALETTE.length?p.scuole.length:c;}
function dealToSchool(d){const note=d.note||'';const pr=/\bP1\b/i.test(note)?'P1':/\bP2\b/i.test(note)?'P2':'';
  return {dealId:d.id,nome:d.scuola||d.dealname||'Scuola',docente:d.docente||'',telDocente:d.telefonoDocente||'',refScuola:d.referente||'',telRef:d.telefonoReferente||'',persone:int(d.studenti)+int(d.accompagnatori),livello:d.grado==='superiori'?'superiori':'medie',disabili:int(d.disabili),priorita:pr,note,stage:d.stage||''};}
function syncFromDeals(p,deals){
  const active=deals.filter(d=>d.stage!=='Chiuso perso');let added=0,updated=0,removed=0;
  active.forEach(d=>{const m=dealToSchool(d);const s=p.scuole.find(x=>x.dealId===d.id);
    if(s){const key=x=>JSON.stringify([int(x.persone),x.livello,int(x.disabili),prioOf(x),x.stage]);const before=key(s);Object.assign(s,m);if(key(s)!==before)updated++;}
    else{p.scuole.push({id:uid('s'),...m,classeDis:'',c:nextColor(p)});added++;}});
  p.scuole=p.scuole.filter(s=>{if(s.dealId&&!active.find(d=>d.id===s.dealId)){removed++;for(const k in p.assign)if(p.assign[k]===s.id)delete p.assign[k];return false;}return true;});
  p.hubspot={sync:new Date().toISOString(),hash:dealsHash(deals)};
  return {added,updated,removed,lost:deals.length-active.length};
}

async function offlinePDF(tp,btn){
  if(!S.downloads){toast('Il download non è disponibile in questa vista','bad');return;}
  const lbl=btn.textContent;btn.disabled=true;btn.textContent='Preparo il PDF…';
  try{await loadScript(JSPDF);const ps=(tp.repliche||[]).map(r=>findP(tp.id,r)).filter(Boolean);let doc=null;
    for(const p of ps){const t=S.c.teatri[p.teatroId];if(t)doc=await planPDF(doc,p,t);}
    const {jsPDF}=window.jspdf;if(!doc)doc=new jsPDF({unit:'mm',format:'a4'});else doc.addPage('a4','portrait');
    const M=12,PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();let y=M+4;
    const line=(txt,o)=>{o=o||{};doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.fs||10);doc.setTextColor(o.c||'#17202B');
      doc.splitTextToSize(txt,PW-2*M-(o.x||0)).forEach(l=>{if(y>PH-M){doc.addPage('a4','portrait');y=M+4;}doc.text(l,M+(o.x||0),y);y+=(o.fs||10)*0.45;});};
    line(`${tp.teatroNome||''} · ${tp.citta||''}`,{b:1,fs:15});line(`${cap(longDate(tp.data))} · repliche ${(tp.repliche||[]).join(', ')}`,{c:'#5B6675'});y+=2;
    if(tp.indirizzo)line('Teatro: '+tp.indirizzo);
    if(tp.referente)line(`Referente: ${tp.referente}${tp.telReferente?' · '+tp.telReferente:''}`);
    if(tp.tecnico)line(`Tecnico: ${tp.tecnico}${tp.telTecnico?' · '+tp.telTecnico:''}`);
    if(tp.hotel)line(`Hotel: ${tp.hotel.nome} · ${tp.hotel.indirizzo||''}${tp.hotel.telefono?' · '+tp.hotel.telefono:''}`);
    y+=4;
    (tp.repliche||[]).forEach(r=>{const p=findP(tp.id,r);line(`Replica ${r}${p?` · ${p.scuole.length} scuole · ${p.scuole.reduce((a,s)=>a+int(s.persone),0)} persone`:' · piantina non creata'}`,{b:1,fs:12});y+=1;
      if(p){const col=colorOf(p);p.scuole.forEach(s=>{if(y>PH-M-10){doc.addPage('a4','portrait');y=M+4;}
        doc.setFillColor(col[s.id]||'#cccccc');doc.setDrawColor('#55606C');doc.rect(M,y-3.2,4,4,'FD');
        line(s.nome||'Scuola',{b:1,x:6});line(`Referente: ${s.refScuola||(s.docente?'Prof. '+s.docente:'non indicato')} · Tel. ${s.telRef||s.telDocente||'non disponibile'}`,{x:6,fs:10});
        line(`${int(s.persone)} persone${int(s.disabili)?' · '+int(s.disabili)+' con disabilità':''}${s.note?' · '+s.note:''}`,{x:6,c:'#5B6675',fs:9});y+=2;});}
      y+=3;});
    const slug=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    await S.downloads.save({filename:`Giornata_${slug(tp.citta)}_${tp.data}.pdf`,data:doc.output('blob')});toast('PDF della giornata pronto');
  }catch(err){if(!(err&&err.code==='declined'))toast('PDF non creato ('+((err&&(err.code||err.message))||'errore')+')','bad');}
  btn.disabled=false;btn.textContent=lbl;
}

function spacing(z){const sp=[];(z.rows||[]).forEach(r=>{const n=r.posti.length;if(n>1)sp.push(Math.hypot(r.x2-r.x1,r.y2-r.y1)/(n-1));});
  if(!sp.length)return 0;sp.sort((a,b)=>a-b);return sp[Math.floor(sp.length/2)];}
function seatSize(z){const sp=spacing(z);return sp?Math.max(4,sp*0.84):Math.max(12,z.w/45);}
function geom(z,excl){
  const S0=seatSize(z);const st=z.front||{x1:0,y1:z.h,x2:z.w,y2:z.h};
  let ux=st.x2-st.x1,uy=st.y2-st.y1;const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;
  const seats=[];
  (z.rows||[]).forEach(r=>{const n=r.posti.length;const ang=normAng(Math.atan2(r.y2-r.y1,r.x2-r.x1)*180/Math.PI);const bl=r.bloccati||[];
    for(let i=0;i<n;i++){const tt=n===1?0:i/(n-1);const x=r.x1+(r.x2-r.x1)*tt,y=r.y1+(r.y2-r.y1)*tt;const k=r.id+'~'+i;
      const fixed=bl.includes(i),ex=!fixed&&!!(excl&&excl[k]);
      seats.push({k,r,i,label:r.posti[i],x,y,ang,fixed,excl:ex,blocked:fixed||ex,proj:(x-st.x1)*ux+(y-st.y1)*uy,dist:distSeg(x,y,st)});}});
  const g={};
  seats.forEach(s=>{const fila=(s.r.fila||'?');(g[fila]=g[fila]||{fila,seats:[]}).seats.push(s);});
  const lines=Object.values(g);
  lines.forEach(l=>{l.seats.sort((a,b)=>a.proj-b.proj);l.dist=l.seats.reduce((a,s)=>a+s.dist,0)/l.seats.length;});
  lines.sort((a,b)=>a.dist-b.dist);
  const byK={};seats.forEach(s=>byK[s.k]=s);
  return {S:S0,st,ux,uy,seats,lines,byK};
}
function geomT(t,excl){
  const zs=t.zone.map((z,zi)=>({z,zi,G:geom(z,excl)}));
  const order=zs.slice().sort((a,b)=>((TIPO_O[a.z.tipo]??0)-(TIPO_O[b.z.tipo]??0))||(a.zi-b.zi));
  const byK={};zs.forEach(x=>Object.assign(byK,x.G.byK));
  const lines=[];order.forEach(x=>x.G.lines.forEach(l=>lines.push({fila:l.fila,seats:l.seats,zona:x.z.nome})));
  return {zs,order,byK,lines,multi:t.zone.length>1};
}
function frontShape(z,G){
  const st=z.front,S0=G.S;let nx=-G.uy,ny=G.ux;
  if(G.seats.length){const cx=G.seats.reduce((a,s)=>a+s.x,0)/G.seats.length,cy=G.seats.reduce((a,s)=>a+s.y,0)/G.seats.length;
    if((cx-st.x1)*nx+(cy-st.y1)*ny>0){nx=-nx;ny=-ny;}}
  else if(ny<0){nx=-nx;ny=-ny;}
  const isStage=z.tipo==='platea';const d=S0*(isStage?2.4:1.1);
  const P=[[st.x1,st.y1],[st.x2,st.y2],[st.x2+nx*d,st.y2+ny*d],[st.x1+nx*d,st.y1+ny*d]];
  const mx=(st.x1+st.x2)/2+nx*d/2,my=(st.y1+st.y2)/2+ny*d/2;const ang=normAng(Math.atan2(G.uy,G.ux)*180/Math.PI);
  const label=isStage?'PALCOSCENICO':'BALAUSTRA';const fs=S0*(isStage?0.8:0.55);
  return {P,mx,my,ang,label,fs,svg:`<polygon points="${P.map(p=>f2(p[0])+','+f2(p[1])).join(' ')}" style="fill:var(--stage)"/>`+
    `<text x="${f2(mx)}" y="${f2(my+fs*0.35)}" transform="rotate(${f2(ang)} ${f2(mx)} ${f2(my)})" font-size="${f2(fs)}" letter-spacing="${f2(S0*0.14)}" style="fill:var(--stage-ink)">${label}</text>`};
}
function contentBox(z,G){
  if(!G.seats.length)return null;let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const S0=G.S;
  const ext=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  G.seats.forEach(s=>{ext(s.x-S0*2,s.y-S0*1.1);ext(s.x+S0*2,s.y+S0*1.1);});
  if(z.front)frontShape(z,G).P.forEach(q=>ext(q[0],q[1]));
  return {x:x0-S0*0.6,y:y0-S0*0.6,w:x1-x0+S0*1.2,h:y1-y0+S0*1.2};
}
function buildSVG(z,G,o){
  const S0=G.S,pad=S0*2.8;let vb=[-pad,-pad,z.w+2*pad,z.h+2*pad];
  if(o.crop){const b=contentBox(z,G);if(b)vb=[b.x,b.y,b.w,b.h];}
  vb=vb.map(f2);
  let s=`<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" role="img" aria-label="Piantina ${esc(z.nome||'')}">`;
  s+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:var(--canvas)"/>`;
  if(o.showBg&&o.bgUrl)s+=`<image href="${esc(o.bgUrl)}" x="0" y="0" width="${z.w}" height="${z.h}" opacity="${o.bgOp}" preserveAspectRatio="xMidYMid meet"/>`;
  if(z.front)s+=frontShape(z,G).svg;
  G.lines.forEach(l=>{const a=l.seats[0],b=l.seats[l.seats.length-1];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy);
    if(L<1e-6){dx=G.ux;dy=G.uy;}else{dx/=L;dy/=L;}const off=S0*1.15;
    s+=`<text x="${f2(a.x-dx*off)}" y="${f2(a.y-dy*off+S0*0.22)}" font-size="${f2(S0*0.62)}" style="fill:var(--muted)">${esc(l.fila)}</text>`;
    if(L>S0)s+=`<text x="${f2(b.x+dx*off)}" y="${f2(b.y+dy*off+S0*0.22)}" font-size="${f2(S0*0.62)}" style="fill:var(--muted)">${esc(l.fila)}</text>`;});
  G.seats.forEach(x=>{s+=seatSVG(x,S0,o);});
  (o.pts||[]).forEach(p=>{s+=`<circle cx="${f2(p.x)}" cy="${f2(p.y)}" r="${f2(S0*0.38)}" style="fill:var(--accent);stroke:var(--surface);stroke-width:${f2(S0*0.08)}"/>`;});
  return s+'</svg>';
}
function seatSVG(x,S0,o){
  const sid=o.assign&&!x.blocked?o.assign[x.k]:null;const c=sid&&o.colorOf?o.colorOf[sid]:null;
  const sel=o.selRow&&x.r.id===o.selRow;const h=S0/2;
  const fill=x.fixed?'fill:var(--blocked)':x.excl?'fill:var(--warn-soft)':(c?'fill:'+c:'fill:var(--seat)');
  const stroke=sel?'stroke:var(--accent)':x.excl?'stroke:var(--warn)':(c?'stroke:rgba(0,0,0,.25)':'stroke:var(--seat-stroke)');
  const sw=f2(sel?S0*0.13:S0*0.05);
  let s=`<g class="st" data-k="${x.k}" transform="translate(${f2(x.x)} ${f2(x.y)}) rotate(${f2(x.ang)})"><rect x="${f2(-h)}" y="${f2(-h)}" width="${f2(S0)}" height="${f2(S0)}" rx="${f2(S0*0.18)}" style="${fill};${stroke};stroke-width:${sw}"/>`;
  if(x.blocked)s+=`<path d="M${f2(-S0*.26)} ${f2(-S0*.26)}L${f2(S0*.26)} ${f2(S0*.26)}M${f2(S0*.26)} ${f2(-S0*.26)}L${f2(-S0*.26)} ${f2(S0*.26)}" style="stroke:${x.excl?'var(--warn)':'var(--surface)'};stroke-width:${f2(S0*.1)}"/>`;
  else s+=`<text y="${f2(S0*0.17)}" font-size="${f2(S0*(String(x.label).length>2?0.4:0.46))}" style="fill:${c?inkFor(c):'var(--seat-ink)'}">${esc(x.label)}</text>`;
  return s+'</g>';
}

function parseSpec(spec){const out=[];String(spec).split(/[,;\s]+/).filter(Boolean).forEach(tok=>{const m=tok.match(/^(\d+)-(\d+)$/);
  if(m){const a=+m[1],b=+m[2];if(Math.abs(b-a)>300)return;const st=a<=b?1:-1;for(let i=a;st>0?i<=b:i>=b;i+=st)out.push(String(i));}
  else out.push(tok.toUpperCase());});return out.slice(0,300);}
function postiFrom(r){if(r.spec&&String(r.spec).trim())return parseSpec(r.spec);
  const n=Math.min(300,int(r.n));const p=parseInt(r.primo);const a=isNaN(p)?1:p;return Array.from({length:n},(_,i)=>String(a+i));}
function previewLabels(arr){if(!arr.length)return 'Nessun posto: indica quanti sono.';
  const show=arr.length>8?arr.slice(0,4).join(', ')+' … '+arr.slice(-3).join(', '):arr.join(', ');return `${show} · <b>${arr.length} posti</b>`;}

/* ---------- distribuzione ---------- */
/* Ordine: 1) classi con studenti con disabilità  2) P1  3) P2  4) medie  5) superiori.
   Se in un livello di priorità ci sono 2 o più gruppi, i posti si dividono in colonne verticali:
   ogni scuola ha la sua porzione delle prime file invece di una fascia orizzontale. */
function distribute(t,p){
  const GT=geomT(t,p.esclusi);
  const lines=[];GT.order.forEach(({G})=>G.lines.forEach(l=>lines.push({l,step:G.S/0.84})));
  const free=new Set(Object.values(GT.byK).filter(s=>!s.blocked).map(s=>s.k));
  const lv=s=>s.livello==='superiori'?1:0;
  const sch=p.scuole.map((s,idx)=>{const n=int(s.persone),dis=int(s.disabili);const cl=int(s.classeDis);return {s,idx,n,dis,cd:dis>0?(cl>0?Math.min(cl,n):n):0,pr:prioOf(s)};});
  const byIdx=(a,b)=>a.idx-b.idx;
  const wholeDis=(a,b)=>(((b.dis>0&&!b.cd)?1:0)-((a.dis>0&&!a.cd)?1:0));
  const tiers=[
    {vert:true,groups:sch.filter(x=>x.cd>0).sort((a,b)=>lv(a.s)-lv(b.s)||byIdx(a,b)).map(x=>({sid:x.s.id,n:x.cd}))},
    {vert:true,groups:sch.filter(x=>x.pr==='P1').sort((a,b)=>wholeDis(a,b)||lv(a.s)-lv(b.s)||byIdx(a,b)).map(x=>({sid:x.s.id,n:x.n-x.cd}))},
    {vert:true,groups:sch.filter(x=>x.pr==='P2').sort((a,b)=>wholeDis(a,b)||lv(a.s)-lv(b.s)||byIdx(a,b)).map(x=>({sid:x.s.id,n:x.n-x.cd}))},
    {vert:false,groups:sch.filter(x=>!x.pr&&lv(x.s)===0).sort((a,b)=>wholeDis(a,b)||byIdx(a,b)).map(x=>({sid:x.s.id,n:x.n-x.cd}))},
    {vert:false,groups:sch.filter(x=>!x.pr&&lv(x.s)===1).sort((a,b)=>wholeDis(a,b)||byIdx(a,b)).map(x=>({sid:x.s.id,n:x.n-x.cd}))}];
  const assign={};let missing=0;const gap=!!(p.opzioni&&p.opzioni.gap);
  tiers.forEach(tier=>{
    const groups=tier.groups.filter(g=>g.n>0);if(!groups.length)return;
    if(tier.vert&&groups.length>=2){
      const need=groups.reduce((a,g)=>a+g.n,0);const region=[];let have=0;
      for(let li=0;li<lines.length&&have<need;li++){const {l,step}=lines[li];l.seats.forEach(s=>{if(free.has(s.k)){region.push({s,li,col:Math.round(s.proj/step)});have++;}});}
      region.sort((a,b)=>(a.col-b.col)||(a.li-b.li));
      let pos=0;groups.forEach(g=>{for(let c=0;c<g.n;c++){if(pos>=region.length){missing++;continue;}const k=region[pos++].s.k;assign[k]=g.sid;free.delete(k);}});
    }else{
      const seq=[];let li=0;lines.forEach(({l})=>{const arr=l.seats.filter(s=>free.has(s.k));if(!arr.length)return;(li++%2?arr.slice().reverse():arr).forEach(s=>seq.push(s));});
      let pos=0,last=null;
      groups.forEach(g=>{if(gap&&last&&last!==g.sid&&pos>0&&pos<seq.length)pos++;
        for(let c=0;c<g.n;c++){if(pos>=seq.length){missing++;continue;}const k=seq[pos++].k;assign[k]=g.sid;free.delete(k);}last=g.sid;});
    }
  });
  p.assign=assign;p.genHash=genHash(p);return missing;
}
function genHash(p){return JSON.stringify([p.scuole.map(s=>[s.id,int(s.persone),s.livello,prioOf(s),int(s.disabili),int(s.classeDis)]),Object.keys(p.esclusi||{}).sort(),!!(p.opzioni&&p.opzioni.gap)]);}
function countFor(GT,assign,sid){let n=0;for(const k in assign){const s=GT.byK[k];if(assign[k]===sid&&s&&!s.blocked)n++;}return n;}
function rangesFor(GT,assign,sid){const out=[];
  GT.lines.forEach(l=>{const runs=[];let cur=null;l.seats.forEach(s=>{if(assign[s.k]===sid&&!s.blocked){if(cur)cur.b=s;else cur={a:s,b:s};}else if(cur){runs.push(cur);cur=null;}});
    if(cur)runs.push(cur);if(runs.length)out.push({fila:l.fila,zona:l.zona,txt:runs.map(r=>r.a===r.b?r.a.label:r.a.label+'–'+r.b.label).join(', ')});});
  return out;}
function rangesText(GT,rs){return rs.map(r=>(GT.multi?r.zona+' ':'')+'fila '+r.fila+': '+r.txt).join(' · ');}
function colorOf(p){const o={};p.scuole.forEach(s=>o[s.id]=zcol(s));return o;}

function suggestRow(a,b){
  const z=Z();const S0=seatSize(z);const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

  const sp=spacing(z);const len=Math.hypot(b.x-a.x,b.y-a.y);const n=sp?Math.round(len/sp)+1:'';
  let primo='';
  if(near){const nums=z.rows.filter(r=>r.fila===near.fila).flatMap(r=>r.posti.map(x=>parseInt(x)).filter(x=>!isNaN(x)));if(nums.length)primo=Math.max(...nums)+1;}
  return {fila:near?near.fila:'',n,primo,spec:''};
}

function edCanvasClick(e,svg){
  const z=Z();const p=svgPoint(svg,e);const seatEl=e.target.closest('[data-k]');
  if(V.pending){const r=z.rows.find(x=>x.id===V.pending.rowId);if(!r){V.pending=null;renderHint();return;}pushHist();

      z.rows.push(nr);V.selRow=nr.id;V.form={mode:'edit',...rowForm(nr)};toast('Fila duplicata: scrivi la lettera');}
    else if(V.pending.type==='start'){r.x1=p.x;r.y1=p.y;}else{r.x2=p.x;r.y2=p.y;}
    V.pending=null;markDirty();renderTools();renderPanel();drawEd();
    if(V.form){const el=document.getElementById('fFila');if(el&&!el.value)el.focus();}return;}
  if(V.tool==='palco'||V.tool==='fila'){
    if(V.draft)return;

      if(Math.hypot(b.x-a.x,b.y-a.y)<1){renderHint();drawEd();return;}
      if(V.tool==='palco'){pushHist();z.front={x1:a.x,y1:a.y,x2:b.x,y2:b.y};markDirty();toast(z.tipo==='platea'?'Palco segnato':'Balaustra segnata');V.tool='fila';renderTools();}
      else{const sg=suggestRow(a,b);V.draft={id:uid('r'),x1:a.x,y1:a.y,x2:b.x,y2:b.y,bloccati:[],...sg};V.draft.posti=postiFrom(V.draft);V.selRow=V.draft.id;V.form={mode:'new',...rowForm(V.draft)};V.form.n=sg.n;renderPanel();}}
    renderHint();drawEd();return;}
  if(V.tool==='seleziona'){if(seatEl){const rid=seatEl.dataset.k.split('~')[0];const r=z.rows.find(x=>x.id===rid);if(r){pushHist();V.selRow=r.id;V.confirmRow=false;V.form={mode:'edit',...rowForm(r)};}}
    else{V.selRow=null;V.form=null;}renderTools();renderPanel();drawEd();return;}
  if(V.tool==='blocca'&&seatEl){const [rid,i]=seatEl.dataset.k.split('~');const r=z.rows.find(x=>x.id===rid);if(!r)return;pushHist();

}
async function loadBackground(file){
  try{toast('Carico la piantina…');
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
      await loadScript(PDFJS);await loadScript(PDFJS_W);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_W;
      V.pdf=await lib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;V.pdfZone=Z().id;V.pdfPage=Math.min(V.zi+1,V.pdf.numPages);await renderPdfPage();
      if(V.pdf.numPages>1)toast(`Il PDF ha ${V.pdf.numPages} pagine: scegli quella di questa zona`);}
    else{const url=URL.createObjectURL(file);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
      const c=document.createElement('canvas');const sc=Math.min(1,2000/img.naturalWidth);c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);await setBgCanvas(c);V.pdf=null;toast('Piantina caricata');}
    renderTools();

}
async function renderPdfPage(){
  const page=await V.pdf.getPage(V.pdfPage);const vp0=page.getViewport({scale:1});const vp=page.getViewport({scale:2000/vp0.width});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;await setBgCanvas(c);renderTools();
}
async function setBgCanvas(c){
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const z=Z();
  V.bg[z.id]={url:URL.createObjectURL(blob),blob};V.showBg=true;

async function saveTeatro(btn){
  const t=V.t;
  if(V.draft){toast('Conferma o annulla prima la fila in corso','bad');return;}
  if(!t.nome.trim()){toast('Scrivi il nome del teatro','bad');document.getElementById('tNome').focus();return;}
  if(!t.zone.some(z=>z.rows.length)){toast('Aggiungi almeno una fila prima di salvare','bad');return;}
  btn.disabled=true;btn.textContent='Salvataggio…';
  try{
    const up=new Map();
    for(const z of t.zone){const b=V.bg[z.id];if(b&&b.blob){
      if(!S.assets){continue;}
      try{if(!up.has(b.blob))up.set(b.blob,(await S.assets.upload(b.blob)).id);z.bg=up.get(b.blob);b.blob=null;}
      catch(err){toast('Mappa salvata senza scansione ('+(err.code||'errore')+')','warn');}}}
    t.aggiornato=new Date().toISOString();
    const out={id:t.id,nome:t.nome,citta:t.citta,aggiornato:t.aggiornato,zone:t.zone.map(z=>({id:z.id,nome:z.nome,tipo:z.tipo,w:z.w,h:z.h,bg:z.bg||null,front:z.front?{x1:f2(z.front.x1),y1:f2(z.front.y1),x2:f2(z.front.x2),y2:f2(z.front.y2)}:null,
      rows:z.rows.map(r=>({id:r.id,fila:r.fila,x1:f2(r.x1),y1:f2(r.y1),x2:f2(r.x2),y2:f2(r.y2),n:r.n??r.posti.length,primo:r.primo??'',spec:r.spec||'',posti:r.posti,bloccati:r.bloccati||[]}))}))};
    await put('teatri',t.id,out);V.dirty=false;toast('Mappa salvata');
    if(V.linkTappa){const tp=S.c.tappe[V.linkTappa];if(tp&&tp.teatroId!==t.id){const o={...clone(tp),teatroId:t.id};delete o.id;await put('tappe',tp.id,o);toast('Mappa salvata e collegata alla data');}}
    const s=document.getElementById('edState');if(s)s.textContent='Salvata';
  }catch(err){toast('Salvataggio non riuscito ('+(err.code||err.message)+')','bad');}
  btn.disabled=false;btn.textContent='Salva mappa';
}

let painting=false,paintedExcl=false;
app.addEventListener('pointerdown',e=>{
  if(V.name!=='piantina'||V.tool==='pan'||V.ro)return;const svg=e.target.closest('#plCanvas svg');if(!svg)return;

});

function paintAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest?el.closest('#plCanvas [data-k]'):null;if(!g)return;
  const k=g.dataset.k;const seat=V.GT&&V.GT.byK[k];if(!seat||seat.fixed)return;const p=V.p;
  const rect=g.querySelector('rect'),txt=g.querySelector('text');
  const paintSeat=(fill,stroke,ink)=>{rect.style.fill=fill;rect.style.stroke=stroke;if(txt)txt.style.fill=ink;};
  if(V.tool==='erase'){
    if(p.esclusi[k]){delete p.esclusi[k];paintedExcl=true;}
    if(p.assign[k])delete p.assign[k];
    if(!paintedExcl)paintSeat('var(--seat)','var(--seat-stroke)','var(--seat-ink)');
  }else if(V.tool==='excl'){
    if(p.esclusi[k])return;p.esclusi[k]=true;delete p.assign[k];paintedExcl=true;paintSeat('var(--warn-soft)','var(--warn)','var(--warn)');
  }else{
    if(seat.excl||p.assign[k]===V.tool)return;const s=p.scuole.find(x=>x.id===V.tool);if(!s)return;const c=zcol(s);
    const max=int(s.persone);if(max>0){let n=0;for(const kk in p.assign)if(p.assign[kk]===s.id&&V.GT.byK[kk]&&!V.GT.byK[kk].blocked)n++;
      if(n>=max){const now=Date.now();if(!V.limT||now-V.limT>2500){V.limT=now;toast(`${s.nome||'La scuola'} ha già tutti i suoi ${max} posti. Per spostarli, prima cancellane qualcuno con la gomma.`,'warn');}return;}}
    p.assign[k]=V.tool;paintSeat(c,'rgba(0,0,0,.25)',inkFor(c));
  }
  V.manual=true;
}

async function planPDF(doc,p,t){
  await loadScript(JSPDF);const {jsPDF}=window.jspdf;const GT=geomT(t,p.esclusi);
    const col=colorOf(p);const tot=p.scuole.reduce((a,s)=>a+int(s.persone),0);
    const zones=GT.order.filter(x=>x.G.seats.length);
    let PW=0,PH=0;const M=10;
    const poly=(pts,style)=>{const rel=pts.slice(1).map((q,i)=>[q[0]-pts[i][0],q[1]-pts[i][1]]);doc.lines(rel,pts[0][0],pts[0][1],[1,1],style,true);};
    const header=(sub)=>{doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor('#17202B');doc.text(`${t.nome}${t.citta?' – '+t.citta:''}`,M,M+5);
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor('#5B6675');doc.text(`${fmtDate(p.data)} · replica ore ${p.replica||''} · ${p.scuole.length} scuole · ${tot} persone${sub?' · '+sub:''}`,M,M+11);};
    let lastBottom=0;
    zones.forEach((x,zi)=>{
      const z=x.z,G=x.G,S0=G.S;const bb=contentBox(z,G);const land=bb.w>bb.h*1.15;
      if(!doc){doc=new jsPDF({orientation:land?'landscape':'portrait',unit:'mm',format:'a4'});}else doc.addPage('a4',land?'landscape':'portrait');
      PW=doc.internal.pageSize.getWidth();PH=doc.internal.pageSize.getHeight();
      header(zones.length>1?z.nome:'');
      const top=M+16,areaW=PW-2*M,isLast=zi===zones.length-1;const areaH=(PH-top-M)*(isLast?(land?0.72:0.66):1);
      const k=Math.min(areaW/bb.w,areaH/bb.h);const offX=M+(areaW-bb.w*k)/2;
      const X=v=>offX+(v-bb.x)*k,Y=v=>top+(v-bb.y)*k;
      if(z.front){const fs=frontShape(z,G);doc.setFillColor('#2A3039');doc.setDrawColor('#2A3039');poly(fs.P.map(q=>[X(q[0]),Y(q[1])]),'F');
        doc.setTextColor('#FFFFFF');doc.setFont('helvetica','bold');doc.setFontSize(Math.max(5,fs.fs*k*2.835));
        doc.text(fs.label,X(fs.mx),Y(fs.my),{align:'center',baseline:'middle',angle:-fs.ang});}
      const sz=S0*k;doc.setLineWidth(0.12);
      G.lines.forEach(l=>{const a=l.seats[0],b=l.seats[l.seats.length-1];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy);if(L<1e-6){dx=G.ux;dy=G.uy;}else{dx/=L;dy/=L;}
        doc.setFont('helvetica','bold');doc.setFontSize(Math.max(4,sz*0.62*2.835));doc.setTextColor('#5B6675');
        doc.text(String(l.fila),X(a.x-dx*S0*1.15),Y(a.y-dy*S0*1.15),{align:'center',baseline:'middle'});
        if(L>S0)doc.text(String(l.fila),X(b.x+dx*S0*1.15),Y(b.y+dy*S0*1.15),{align:'center',baseline:'middle'});});
      G.seats.forEach(s=>{const sid=s.blocked?null:p.assign[s.k];const c=s.fixed?'#8F98A3':s.excl?'#FBE3C8':(sid&&col[sid]?col[sid]:'#E8EBEF');
        doc.setFillColor(c);doc.setDrawColor(s.excl?'#A85A0C':(sid?'#55606C':'#A9B3BE'));
        const r=s.ang*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r),h=S0/2;
        const pts=[[-h,-h],[h,-h],[h,h],[-h,h]].map(([u,v])=>[X(s.x+u*cs-v*sn),Y(s.y+u*sn+v*cs)]);poly(pts,'FD');
        if(s.blocked){doc.setDrawColor(s.excl?'#A85A0C':'#FFFFFF');const q=h*0.52;
          const P1=[X(s.x-q*cs+q*sn),Y(s.y-q*sn-q*cs)],P2=[X(s.x+q*cs-q*sn),Y(s.y+q*sn+q*cs)],P3=[X(s.x+q*cs+q*sn),Y(s.y+q*sn-q*cs)],P4=[X(s.x-q*cs-q*sn),Y(s.y-q*sn+q*cs)];
          doc.line(P1[0],P1[1],P2[0],P2[1]);doc.line(P3[0],P3[1],P4[0],P4[1]);return;}
        const fsz=sz*(String(s.label).length>2?0.4:0.46)*2.835;
        if(fsz>=2.2){doc.setFont('helvetica','bold');doc.setFontSize(fsz);doc.setTextColor(sid&&col[sid]?inkFor(col[sid]):'#4A5462');
          doc.text(String(s.label),X(s.x),Y(s.y),{align:'center',baseline:'middle',angle:Math.abs(s.ang)>2?-s.ang:0});}});
      lastBottom=top+bb.h*k;
    });
    if(!doc||!zones.length)return doc;
    // legenda
    let y=lastBottom+8;const lineH=4.6,areaW=PW-2*M;
    const exN=Object.values(GT.byK).filter(s=>s.excl).length;
    const items=p.scuole.map(s=>{const rs=rangesFor(GT,p.assign,s.id);const n=countFor(GT,p.assign,s.id);const cd=int(s.disabili)>0?Math.min(int(s.classeDis),int(s.persone)):0;
      const meta=`${LVL_L[s.livello]||''} · ${int(s.persone)} persone · ${n} posti${prioOf(s)?' · '+prioOf(s):''}${int(s.disabili)?` · ${int(s.disabili)} con disabilità`+(cd?`, classe di ${cd} davanti`:''):''}`;
      const lines=[...doc.splitTextToSize(rs.length?rangesText(GT,rs):'Nessun posto assegnato',areaW-8)];if(s.note)lines.push(...doc.splitTextToSize('Note: '+s.note,areaW-8));
      return {s,meta,lines};});
    const need=items.reduce((a,it)=>a+lineH*(2+it.lines.length)+2,14);
    if(y+need>PH-M){doc.addPage('a4','portrait');PW=doc.internal.pageSize.getWidth();PH=doc.internal.pageSize.getHeight();y=M+6;}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor('#17202B');doc.text('Legenda',M,y);
    if(exN){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor('#A85A0C');doc.text(`${exN} posti esclusi per questa data (es. console tecnici)`,M+22,y);}
    y+=6;
    items.forEach(it=>{if(y+lineH*(2+it.lines.length)>PH-M){doc.addPage('a4','portrait');y=M+6;}
      doc.setFillColor(col[it.s.id]);doc.setDrawColor('#55606C');doc.rect(M,y-3.2,4,4,'FD');
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor('#17202B');doc.text(it.s.nome||'Scuola',M+6,y);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor('#5B6675');doc.text(it.meta,M+6,y+lineH);
      doc.setTextColor('#17202B');it.lines.forEach((ln,i)=>doc.text(ln,M+6,y+lineH*(2+i)));y+=lineH*(2+it.lines.length)+2;});
  return doc;
}
async function exportPDF(btn){

async function viewFile(id,ext,title){

  ov.innerHTML=`<div class="viewer-bar"><b>${esc(title)}</b><span class="row-btns"><button class="btn small" data-vdl>Scarica</button><button class="btn small primary" data-vclose>Chiudi</button></span></div><div class="viewer-body"><p class="muted">Apro il file…</p></div>`;
  document.body.appendChild(ov);const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);};const onKey=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',onKey);
  ov.addEventListener('click',e=>{if(e.target.closest('[data-vclose]'))close();else if(e.target.closest('[data-vdl]'))blobSave(id,(title||'file').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.'+(ext||'pdf'));});
  ov.querySelector('[data-vclose]').focus();
  const body=ov.querySelector('.viewer-body');let url;try{url=await blobURL(id);}catch(e){body.innerHTML='<p>Non riesco ad aprire il file.</p>';return;}

    if(['png','jpg','jpeg','webp','gif'].includes(ext)){body.innerHTML=`<img src="${url}" alt="${esc(title)}">`;}
    else if(ext==='pdf'){await loadScript(PDFJS);await loadScript(PDFJS_W);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_W;
      const buf=await (await fetch(url)).arrayBuffer();const pdf=await lib.getDocument({data:buf,isEvalSupported:false}).promise;body.innerHTML='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const pg=await pdf.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.2,1500/vp0.width)});
        const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);body.appendChild(cv);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;}}
    else body.innerHTML='<p>Anteprima non disponibile per questo tipo di file: usa “Scarica”.</p>';
  }catch(e){body.innerHTML='<p>Non riesco ad aprire il file: prova con “Scarica”.</p>';}
}

const ROLE_L={direzione:'Direzione',venditore:'Referente di zona',tm:'Tour Manager'};
function deptOf(u){return u.ruolo==='tm'?'Tour Manager':u.ruolo==='venditore'?'Referente di zona':(u.reparto||'Direzione');}
function users(){return ((S.c.impostazioni.utenti||{}).lista)||[];}
function me(){const e=(S.pref.user||'').toLowerCase();return e?users().find(u=>(u.email||'').toLowerCase()===e)||null:null;}
function role(){const u=me();return u?u.ruolo:'tm';}
function isDir(){return role()==='direzione';}
function tmName(){const u=me();return (u&&u.nome)||S.pref.tm||'';}
function allTours(){return [...new Set([...Object.values(S.c.tappe),...Object.values(S.c.cast||{})].map(t=>t.tour).filter(Boolean))].sort();}
function regMatch(a,b){a=norm(a);b=norm(b);return !!a&&!!b&&(a===b||a.startsWith(b)||b.startsWith(a));}
function inZone(tp){const u=me();if(!u||u.ruolo!=='venditore')return true;return (u.regioni||[]).some(r=>regMatch(r,tp.regione));}
function lockAt(p){if(!p||!p.data)return null;const d=dObj(p.data);d.setHours(6,0,0,0);return d;}
function plLocked(p){if(role()==='tm')return false;const l=lockAt(p);return !!l&&new Date()>=l;}

  return [['controllo','Controllo','m'],['tournee','Tournée','m'],['piantine','Piantine','m'],['mappa','Mappa','m'],['checklist','Checklist',''],['teatri','Teatri',''],['cast','Cast',''],['documenti','Documenti',''],['qr','QR docenti',''],['auto','Auto ed emergenze',''],['accessi','Accessi',''],['profilo','Il mio profilo','']];}

  if(tp.hotel&&tp.hotel.pagamento!=='pagato')out.push('Hotel da pagare');
  if(!teatroOf(tp))out.push('Sala da mappare');
  const miss=(tp.repliche||[]).filter(r=>pStatus(tp,r).k!=='ok');if(miss.length)out.push(miss.length===1?`Piantina ${miss[0]} da fare`:`${miss.length} piantine da fare`);
  return out;}
function triSvg(x,y,sz){const h=sz*0.88,t=y-h/2,bt=y+h/2,l=x-sz/2,r=x+sz/2;const tri=`M${f2(x)} ${f2(t)}L${f2(r)} ${f2(bt)}H${f2(l)}Z`;
  return `<g class="it-alert" aria-hidden="true" pointer-events="none"><path d="${tri}" style="fill:#FFFFFF;stroke:#FFFFFF;stroke-width:${f2(sz*0.22)};stroke-linejoin:round"/><path d="${tri}" style="fill:#F2B705;stroke:#8A6400;stroke-width:${f2(sz*0.06)};stroke-linejoin:round"/>
   <path d="M${f2(x)} ${f2(y-h*0.14)}V${f2(y+h*0.14)}" style="fill:none;stroke:#2B2000;stroke-width:${f2(sz*0.11)};stroke-linecap:round"/><path d="M${f2(x)} ${f2(y+h*0.33)}h0.01" style="fill:none;stroke:#2B2000;stroke-width:${f2(sz*0.13)};stroke-linecap:round"/></g>`;}
function renderMappa(){
  const list=tourTappe();const td=today();
  const groups=[];list.forEach((tp,i)=>{if(tp.lat==null||tp.lng==null)return;const g=groups.find(x=>Math.abs(x.lat-tp.lat)<0.02&&Math.abs(x.lng-tp.lng)<0.02);
    if(g)g.items.push({tp,n:i+1});else groups.push({lat:+tp.lat,lng:+tp.lng,items:[{tp,n:i+1}]});});
  const pk=list.length?pickDay(list):null;const curId=pk?list[pk.i].id:null;
  const sel=V.mapSel||(curId&&groups.findIndex(g=>g.items.some(it=>it.tp.id===curId)));
  const path=list.filter(t=>t.lat!=null).map(t=>proj(+t.lng,+t.lat));
  const regs=new Set(list.map(t=>norm(t.regione)));
  let vb=[0,0,920,1085];const pts=groups.map(g=>proj(g.lng,g.lat));
  if(!V.mapAll&&pts.length){let x0=Math.min(...pts.map(q=>q[0])),x1=Math.max(...pts.map(q=>q[0])),y0=Math.min(...pts.map(q=>q[1])),y1=Math.max(...pts.map(q=>q[1]));
    let w=Math.max(x1-x0+240,420),h=Math.max(y1-y0+240,460);if(w/h<0.85)w=h*0.85;else h=Math.max(h,w/0.85*0.75);
    const cx=(x0+x1)/2,cy=(y0+y1)/2;vb=[cx-w/2,cy-h/2,w,h];}
  const k=vb[2]/920;
  let svg=`<svg viewBox="${vb.map(f2).join(' ')}" class="it-map" role="img" aria-label="Mappa del percorso della tournée" style="--k:${f2(k)}">`;
  Object.entries(IT_REG).forEach(([n,d])=>{svg+=`<path d="${d}" class="it-reg ${regs.has(norm(n))?'on':''}"><title>${esc(n)}</title></path>`;});
  if(path.length>1)svg+=`<polyline points="${path.map(q=>q.map(f2).join(',')).join(' ')}" class="it-path"/>`;
  groups.forEach((g,gi)=>{const [x,y]=proj(g.lng,g.lat);const past=g.items.every(it=>it.tp.data<td);const cur=g.items.some(it=>it.tp.id===curId);
    const lbl=g.items.length>1?g.items[0].n+'–'+g.items[g.items.length-1].n:String(g.items[0].n);const r=vb[2]*(lbl.length>2?0.046:0.036);
    const iss=g.items.flatMap(it=>dayIssues(it.tp));
    svg+=`<g class="it-pt ${past?'past':''} ${cur?'cur':''} ${gi===sel?'sel':''}" data-mp="${gi}" tabindex="0" role="button" aria-label="${esc(g.items[0].tp.citta)}${iss.length?': da sistemare, '+esc(iss.join(', ')):''}"><circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" style="stroke-width:${f2(r*0.18)}"/><text x="${f2(x)}" y="${f2(y+r*0.35)}" style="font-size:${f2(r*(lbl.length>2?0.7:0.95))}px">${lbl}</text>${iss.length?triSvg(x+r*0.95,y-r*0.95,r*1.05):''}</g>`;});
  svg+=`</svg>`;
  const g=groups[sel];
  let prev='';
  if(g){prev=`<div class="mp-prev"><span class="eyebrow">Tappa ${g.items.map(i=>i.n).join(', ')}</span><h2 class="mp-city">${esc(g.items[0].tp.citta)}</h2>`+g.items.map(({tp})=>{
      const paganti=Object.values(S.c.deals).filter(d=>d.data===tp.data&&norm(d.citta)===norm(tp.citta)&&sameTour(d,tp)&&d.stage!=='Chiuso perso').reduce((a,d)=>a+int(d.studenti),0);
      const iss=dayIssues(tp);
      return `<div class="mp-day"><b>${esc(cap(longDate(tp.data)))}</b>${iss.filter(x=>x!=='Hotel da pagare').length?`<div class="mp-iss">${iss.filter(x=>x!=='Hotel da pagare').map(x=>`<span class="pill warn">⚠ ${esc(x)}</span>`).join('')}</div>`:''}
        <dl class="facts one"><div><dt>Teatro</dt><dd>${esc(tp.teatroNome||'—')}</dd></div><div><dt>Hotel</dt><dd>${tp.hotel?esc(tp.hotel.nome)+' '+hotelPill(tp.hotel):'—'}</dd></div></dl>
        <div class="mp-nums"><span><b>${paganti}</b> studenti paganti</span><span><b>${(tp.repliche||[]).length}</b> repliche</span></div>
        <button class="btn small" data-mpgo="${tp.id}">Apri la giornata</button></div>`;}).join('')+`</div>`;}
  const missing=list.filter(t=>t.lat==null);
  app.innerHTML=`<div class="page-head"><span class="eyebrow">Tour ${esc(curTour())}</span><h1>Mappa della tournée</h1><p class="muted">${list.length} date · le tappe passate sono piene, quella in corso è evidenziata. Tocca un punto per i dettagli.</p></div>
   <div class="mp-wrap"><div class="mp-map card">${svg}<div class="row-btns" style="justify-content:flex-end"><button class="btn small ghost" data-mpall>${V.mapAll?'Zoom sul tour':'Tutta Italia'}</button></div><div class="mp-leg"><span><i class="lg past"></i>Fatta</span><span><i class="lg cur"></i>In corso o prossima</span><span><i class="lg"></i>Da fare</span><span>${TRI.replace('width="20" height="20"','width="16" height="16"')}Da sistemare</span><span><i class="lg reg"></i>Regioni del tour</span></div><p class="mp-src">Confini regionali: ISTAT (CC BY 4.0)</p></div>${prev||'<div class="mp-prev card"><p class="muted">Tocca una tappa.</p></div>'}</div>
   ${missing.length?`<p class="muted small">Senza posizione sulla mappa: ${missing.map(t=>esc(t.citta)).join(', ')}.</p>`:''}`;
}
document.addEventListener('click',e=>{if(V.name!=='mappa')return;if(e.target.closest('[data-mpall]')){V.mapAll=!V.mapAll;render();return;}const p=e.target.closest('[data-mp]');if(p){V.mapSel=+p.dataset.mp;render();return;}
  const b=e.target.closest('[data-mpgo]');if(b)goFrom('oggi',{dayId:b.dataset.mpgo,from:'mappa'});});
document.addEventListener('keydown',e=>{if(V.name==='mappa'&&e.target.dataset&&e.target.dataset.mp&&(e.key==='Enter'||e.key===' ')){e.preventDefault();V.mapSel=+e.target.dataset.mp;render();}});

/* ---------- accessi (Direzione) ---------- */
function renderAccessi(){
  if(!isDir()){app.innerHTML=`<div class="empty"><b>Sezione riservata alla Direzione.</b></div>`;return;}
  const lista=V.accEdit||clone(users());V.accEdit=lista;const ts=allTours();
  let h=`<div class="page-head"><span class="eyebrow">Direzione</span><h1>Accessi</h1><p class="muted">Ogni persona entra con la sua email Mater Lingua. Il ruolo decide cosa vede; al Tour Manager si assegna il suo tour.</p></div><div class="acc-list">`;
  lista.forEach((u,i)=>{h+=`<div class="card acc" data-acc="${i}"><div class="grid2">
    <div class="field"><label>Nome e cognome</label><input class="in" data-af="nome" value="${esc(u.nome||'')}"></div>
    <div class="field"><label>Email</label><input class="in" data-af="email" type="email" value="${esc(u.email||'')}" placeholder="nome@materlingua.eu"></div>
    <div class="field"><label>Ruolo</label><select class="in" data-af="ruolo">${Object.keys(ROLE_L).map(r=>`<option value="${r}" ${u.ruolo===r?'selected':''}>${ROLE_L[r]}</option>`).join('')}</select></div>
    ${u.ruolo==='tm'?`<div class="field"><label>Tour</label><select class="in" data-af="tour"><option value="">Nessuno</option>${ts.map(t=>`<option ${u.tour===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`
     :u.ruolo==='venditore'?`<div class="field"><label>Regioni (separate da virgola)</label><input class="in" data-af="regioni" value="${esc((u.regioni||[]).join(', '))}" placeholder="Piemonte, Liguria"></div>
       <div class="field"><label>Area</label><input class="in" data-af="area" value="${esc(u.area||'')}" placeholder="es. 6"></div>
       <div class="field"><label>Telefono per i TM</label><input class="in" data-af="telefono" type="tel" value="${esc(u.telefono||'')}" placeholder="Vuoto = numero Mater Lingua"></div>
       <div class="field"><label>Link alla chat Google</label><input class="in" data-af="chat" type="url" value="${esc(u.chat||'')}" placeholder="https://mail.google.com/chat/…"></div>`
     :`<div class="field"><label>Reparto</label><input class="in" data-af="reparto" list="reparti" value="${esc(u.reparto||'')}" placeholder="es. Logistica, Marketing"><datalist id="reparti"><option value="Direzione"><option value="Logistica"><option value="Marketing"><option value="Amministrazione"></datalist></div>`}
    <div class="field" style="grid-column:1/-1"><label>Nota sul contatto</label><input class="in" data-af="nota" value="${esc(u.nota||'')}" placeholder="es. Non chiamare durante il congedo"></div>
    </div><div class="row-btns">${V.accDel===i?`<button class="btn small danger" data-adelok="${i}">Conferma: togli l’accesso</button>`:`<button class="btn small ghost" data-adel="${i}">Togli l’accesso</button>`}</div></div>`;});
  h+=`</div><div class="row-btns" style="margin-top:14px"><button class="btn" data-aadd>+ Aggiungi persona</button><button class="btn primary" data-asave>Salva gli accessi</button></div>`;
  const ct=S.c.impostazioni.contatti||{};
  h+=`<section class="card" style="margin-top:16px;max-width:640px"><div class="card-head"><h2>Numero Mater Lingua per i TM</h2></div>
    <p class="muted small" style="margin:0">Il TM lo chiama per il referente di zona quando il referente non ha un numero suo.</p>
    <div class="newp" style="margin:0"><input class="in" id="numML" type="tel" value="${esc(ct.numeroML||'')}" placeholder="es. 051 000 0000" style="flex:1 1 200px;max-width:280px"><button class="btn small primary" data-numml>Salva numero</button></div></section>`;
  app.innerHTML=h+spCard();
}
document.addEventListener('input',e=>{if(V.name!=='accessi')return;const c=e.target.closest('[data-acc]');const f=e.target.dataset.af;if(!c||!f)return;const u=V.accEdit[+c.dataset.acc];
  u[f]=f==='regioni'?e.target.value.split(',').map(x=>x.trim()).filter(Boolean):e.target.value;if(f==='ruolo')render();});
document.addEventListener('change',e=>{if(V.name!=='accessi')return;const c=e.target.closest('[data-acc]');const f=e.target.dataset.af;if(!c||!f||e.target.tagName!=='SELECT')return;V.accEdit[+c.dataset.acc][f]=e.target.value;if(f==='ruolo')render();});
document.addEventListener('click',async e=>{if(V.name!=='accessi')return;
  if(e.target.closest('[data-numml]')){try{await putImp('contatti',{numeroML:document.getElementById('numML').value.trim()});toast('Numero salvato');}catch(err){toast('Non salvato ('+(err.code||err.message)+')','bad');}return;}
  if(e.target.closest('[data-aadd]')){V.accEdit.push({nome:'',email:'',ruolo:'tm',tour:''});render();return;}
  const d=e.target.closest('[data-adel]');if(d){V.accDel=+d.dataset.adel;render();return;}
  const k=e.target.closest('[data-adelok]');if(k){V.accEdit.splice(+k.dataset.adelok,1);V.accDel=null;render();return;}
  if(e.target.closest('[data-asave]')){const lista=V.accEdit.filter(u=>u.email).map(u=>({...u,email:u.email.trim().toLowerCase()}));
    if(!lista.some(u=>u.ruolo==='direzione')){toast('Serve almeno una persona della Direzione','bad');return;}
    try{await put('impostazioni','utenti',{lista});S.c.impostazioni.utenti={lista};V.accEdit=null;toast('Accessi salvati');render();}catch(err){toast('Non salvati ('+(err.code||err.message)+')','bad');}}
});

loadPref();applyTheme();
if(landingToken()){renderLanding();initStore().then(()=>{});}else{render();initStore();}
</script>
