<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#196457">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
</head><body>
<title>Tour Manager Mater Lingua</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app del Tour Manager. Menu fisso a sinistra (in basso sul telefono), contenuto a schede; la mappa della sala resta lo spazio dominante nelle viste di lavoro. */
:root{
  --hl-bg:#FFF6D6; --hl-bd:#F2D27A; --hl-ink:#5A4300; --mark:#FFE58A; --mark-ink:#1B1A10;
  --note-bg:#EAF1FB; --note-bd:#3B6FB6; --note-ink:#2C578F;
  --brand:#196457; --brand-ink:#FFFFFF; --brand-soft:#E3EFEB; --brand-deep:#133029;
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#F5F8F7; --canvas:#FAFCFB;
  --ink:#14201D; --muted:#56645F; --line:#D3DDDA;
  --accent:#196457; --accent-ink:#FFFFFF;
  --seat:#E0E6E4; --seat-stroke:#A6B4AF; --seat-ink:#46534F; --blocked:#8C9894;
  --stage:#1E2B28; --stage-ink:#E7EFEC;
  --ok:#23724A; --ok-soft:#DFF1E6; --warn:#A35A0E; --warn-soft:#FBEBD8; --bad:#B3261E; --bad-soft:#F8E1DF;
  --f-ui:'Work Sans','Segoe UI',Arial,sans-serif;
  --f-head:'Work Sans','Segoe UI',Arial,sans-serif;
  --side-bg:#244639; --side-ink:#FFFFFF; --side-muted:#B9CDC6; --gold:#ACA077;
  --r:12px; --side:236px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --hl-bg:#2E2610; --hl-bd:#7A6420; --hl-ink:#F3DE9A; --mark:#5C4A12; --mark-ink:#FFF3C4;
  --note-bg:#14243A; --note-bd:#5B8FD6; --note-ink:#A9C6EE;
  --brand:#5DBBA5; --brand-ink:#06221C; --brand-soft:#16352E; --brand-deep:#9ED9CA;
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --canvas:#111A17;
  --ink:#E3ECE9; --muted:#9AABA5;
  --line:#293733;
  --accent:#5DBBA5; --accent-ink:#06221C;
  --seat:#2F3D39; --seat-stroke:#51625C; --seat-ink:#C7D3CF; --blocked:#5B6A65;
  --stage:#3E4E49; --stage-ink:#F0F5F3; --side-bg:#11221D; --side-ink:#E3ECE9; --side-muted:#9AB2AA;
  --ok:#5FC28A; --ok-soft:#163222; --warn:#E9A25A; --warn-soft:#3A2714; --bad:#F08479; --bad-soft:#3B1A18;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --hl-bg:#2E2610; --hl-bd:#7A6420; --hl-ink:#F3DE9A; --mark:#5C4A12; --mark-ink:#FFF3C4;
  --note-bg:#14243A; --note-bd:#5B8FD6; --note-ink:#A9C6EE;
  --brand:#5DBBA5; --brand-ink:#06221C; --brand-soft:#16352E; --brand-deep:#9ED9CA;
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --canvas:#111A17;
  --ink:#E3ECE9; --muted:#9AABA5; --line:#293733;
  --accent:#5DBBA5; --accent-ink:#06221C;
  --seat:#2F3D39; --seat-stroke:#51625C; --seat-ink:#C7D3CF; --blocked:#5B6A65;
  --stage:#3E4E49; --stage-ink:#F0F5F3; --side-bg:#11221D; --side-ink:#E3ECE9; --side-muted:#9AB2AA;
  --ok:#5FC28A; --ok-soft:#163222; --warn:#E9A25A; --warn-soft:#3A2714; --bad:#F08479; --bad-soft:#3B1A18;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* SHELL */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--side-bg);color:var(--side-ink);border-right:0;
  display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px))}
@media (min-width:901px){.side{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.side>*{flex-shrink:0}}
.logo{display:block;width:132px;height:71px;background:var(--brand);flex:none}
.logo{-webkit-mask:url(logo.png) no-repeat left center/contain;mask:url(logo.png) no-repeat left center/contain}
.side .logo{background:#FFFFFF;-webkit-mask:url(logo.png) no-repeat left center/contain;mask:url(logo.png) no-repeat left center/contain}
.side-sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
.side .side-sub,.side .flabel,.side .store-pill{color:var(--side-muted)}
.side .in{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:var(--side-ink)}
.side select.in option{color:#14201D}
#navList{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;white-space:nowrap;padding:0 14px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-weight:600;font-size:16px;text-align:left;color:var(--side-ink)}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.on{background:#FFFFFF;color:#133029}
.nav-item:focus-visible{outline-color:#FFFFFF}
@media (min-width:901px) and (max-height:980px){.side{gap:12px;padding-top:14px}.nav-item{min-height:38px;font-size:15px}.side .logo{width:110px;height:59px}}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .in{width:100%}
.store-pill{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.store-pill.db::before{background:var(--ok)}
.store-pill.local::before{background:var(--warn)}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main-in{max-width:1400px;margin-inline:auto}
@media (min-width:901px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:25;flex-direction:row;border-right:0;border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  .side .logo,.side .side-sub,.side .side-id,.side-foot{display:none!important}
  #navList{flex-direction:row;flex:1;justify-content:space-around}
  .nav-item{flex-direction:column;gap:2px;min-height:52px;padding:4px 6px;font-size:12px;flex:1;justify-content:center;text-align:center}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mtop .logo{width:96px;height:52px}
.mtop .in{max-width:170px}

/* BASE */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
a.btn{text-decoration:none;color:var(--ink)}a.btn.primary{color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
h1{font-family:var(--f-head);font-weight:700;font-size:32px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
h3{margin:0;font-family:var(--f-head);font-size:18px;font-weight:700}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--brand)}
h2{text-transform:uppercase;letter-spacing:.03em;font-size:17px;color:var(--brand)}
.card-title{color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14px}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.in,select.in{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:0}
.in.ta{padding:10px 12px;min-height:64px;resize:vertical;width:100%;line-height:1.4}
.in:focus{border-color:var(--brand)}
.in[disabled]{opacity:.45}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:#FF7A59;color:#2D0E05}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;max-width:75ch}
.page-head p{margin:0}
.empty{background:var(--surface);border:1px dashed var(--seat-stroke);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-title{font-weight:700;font-size:17px}
.card-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:3px}
.newp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.icon-btn.confirm{width:auto;padding:0 10px;font-size:13px;font-weight:700;color:var(--bad);border-color:var(--bad)}

/* OGGI */
.day-head{flex-direction:row;align-items:flex-start;gap:14px;max-width:none}
.day-nav{display:flex;gap:6px;padding-top:2px}
.auto-grid .au-emg{grid-row:span 2}
.day-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.day-grid .span2{grid-column:span 2}
.day-grid.mas-on{display:flex;flex-direction:column;gap:14px;align-items:stretch}.day-grid.mas-on>*{width:100%;max-width:none;box-sizing:border-box}.mas-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.mas-col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1100px){.day-grid{grid-template-columns:minmax(0,1fr)}.day-grid .span2{grid-column:auto}}
.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.timeline>div{display:flex;flex-direction:column;padding:10px 14px;border-radius:10px;background:var(--surface-2);min-width:110px}
.timeline b{font-family:var(--f-head);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.timeline span{font-size:13px;color:var(--muted);font-weight:600}
.timeline .tl-rep{background:var(--brand);color:var(--brand-ink)}
.timeline small{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.timeline .tl-dep{background:var(--brand-soft)}
.timeline .tl-dep span{color:var(--brand-deep)}
.timeline .tl-rep span{color:var(--brand-ink);opacity:.85}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 20px;margin:6px 0 0}
.facts dt{font-size:13px;font-weight:600;color:var(--muted)}
.facts dd{margin:0}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--surface-2)}
.prow-t{display:flex;align-items:center;gap:10px}
.prow-t b{font-family:var(--f-head);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo li:last-child{border-bottom:0}
.todo-l{flex:1 1 200px;min-width:0}
.todo li.done .todo-l{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--seat-stroke)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--seat-stroke);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;cursor:pointer;color:var(--brand-ink);padding:0}
span.tick{cursor:default;border-style:dashed}
.tick.on{background:var(--brand);border-color:var(--brand);border-style:solid}

/* TOURNÉE */
.tlist{display:flex;flex-direction:column;gap:6px;max-width:980px}
.tmonth{font-family:var(--f-head);font-weight:700;font-size:18px;margin:14px 0 4px}
.trow{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.trow:hover{border-color:var(--brand)}
.trow.today{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.tdate{display:flex;flex-direction:column;align-items:center;width:46px;flex:none}
.tdate b{font-family:var(--f-head);font-size:24px;font-weight:800;line-height:1}
.tdate span{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.tmain{display:flex;flex-direction:column;flex:1;min-width:0}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.stale{background:var(--bad)}
@media (max-width:640px){.trow{flex-wrap:wrap}.tmeta{width:100%;justify-content:flex-start;padding-left:60px}}

/* CHECKLIST */
.ck-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1100px){.ck-wrap{grid-template-columns:minmax(0,1fr)}}
.ck-q{display:flex;flex-direction:column;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ck-l{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;cursor:pointer;font-weight:600;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.bad{background:var(--bad);color:#fff}
.seg.sm button{min-height:38px;padding:0 12px}
.send-bar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
@media (max-width:900px){.send-bar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* AREA DI LAVORO */
.ws-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ws-top .grow{flex:1 1 220px;min-width:0;display:flex;gap:8px;flex-wrap:wrap}
.ws-top .grow .in{flex:1 1 160px}
.ws-title{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ws-title b{font-size:19px;font-family:var(--f-head)}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media (max-width:1180px){.ws{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;max-width:230px}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:4px;flex:none}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.hint{min-height:calc(2.9em + 18px);display:flex;align-items:center;font-size:15px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px}
.hs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.hs.alert{border-color:var(--bad)}
.hs-logo{font-weight:800;font-size:14px;color:#2D0E05;background:#FF7A59;border-radius:6px;padding:2px 8px}
.hs .btn{margin-left:auto}
.canvas-wrap{overflow:auto;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 250px);min-height:320px;-webkit-overflow-scrolling:touch}
@media (max-width:1180px){.canvas-wrap{max-height:62vh}}
.canvas{min-width:100%}
.canvas svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.canvas-wrap.painting svg{touch-action:none;cursor:crosshair}
.canvas-wrap.picking svg{cursor:crosshair}
#map text{font-family:var(--f-ui);text-anchor:middle;pointer-events:none;font-weight:700}
#map .st{cursor:pointer}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend-row b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tec-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}.tec-form .field{min-width:0}@media (max-width:420px){.tec-form{grid-template-columns:1fr}}
.guide{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.preview{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.rules .guide{margin-top:8px}
.schools{display:flex;flex-direction:column;gap:10px}

<script>
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_W='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const PALETTE=['#3B6FB6','#E07B28','#8A5BB0','#C8414B','#D9B22B','#2E9C9A','#D96BA0','#8C6A4F','#7FB53B','#4FA3E0','#6B7A8F','#B5562C'];
const TIPO_L={platea:'Platea',galleria:'Galleria',palchi:'Palchi'};
const TIPO_O={platea:0,galleria:1,palchi:2};
const LVL_L={medie:'Medie',superiori:'Superiori'};
const COLLS=['teatri','piantine','tappe','deals','checklist','cast','documenti','impostazioni','foto','consigli','note','presenze','promemoria','segnalazioni'];
const CONFIRMED=['Chiuso vinto','Pagamento completato','Fattura inviata'];

const S={mode:'pending',db:null,assets:null,downloads:null,ready:false,c:{teatri:{},piantine:{},tappe:{},deals:{},checklist:{},cast:{},documenti:{},impostazioni:{},foto:{},consigli:{},note:{},presenze:{}},pref:{tour:'',tm:''}};
let V={name:'oggi'};
const app=document.getElementById('app');

/* ---------- utilità ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function f2(n){return Math.round(n*100)/100;}
function int(v){const n=parseInt(v);return isNaN(n)?0:Math.max(0,n);}
function normAng(a){while(a>90)a-=180;while(a<=-90)a+=180;return a;}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;}
function dObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function longDate(s){return dObj(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});}
function shortDate(s){return dObj(s).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function addDays(s,n){const d=dObj(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addMin(hm,m){if(!hm||!/^\d{1,2}:\d{2}$/.test(hm))return '';const [h,mi]=hm.split(':').map(Number);let t=h*60+mi+m;t=(t+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function inkFor(hex){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16)/255,g=parseInt(h.substr(2,2),16)/255,b=parseInt(h.substr(4,2),16)/255;
  const L=[r,g,b].map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return (0.2126*L[0]+0.7152*L[1]+0.0722*L[2])>0.36?'#17202B':'#FFFFFF';}
let toastT;
function toast(msg,kind){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}
  el.className='toast'+(kind?' '+kind:'');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3400);}
const scriptP={};
function loadScript(src){if(!scriptP[src])scriptP[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scriptP[src];rej(new Error('Impossibile caricare la libreria'));};document.head.appendChild(s);});return scriptP[src];}
function distSeg(x,y,s){const dx=s.x2-s.x1,dy=s.y2-s.y1;const L=dx*dx+dy*dy;let t=L?((x-s.x1)*dx+(y-s.y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(s.x1+t*dx),y-(s.y1+t*dy));}
function svgPoint(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function zcol(s){return PALETTE[(s.c||0)%PALETTE.length];}
function isPhone(){return window.matchMedia('(max-width:640px)').matches;}
function startZoom(){return isPhone()?2:1;}
function centerOnce(wrapId){if(V.centered)return;const w=document.getElementById(wrapId);if(!w)return;V.centered=true;requestAnimationFrame(()=>{w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.scrollTop=Math.max(0,w.scrollHeight-w.clientHeight);});}
function mapsUrl(dest,origin){return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(dest||'')+(origin?'&origin='+encodeURIComponent(origin):'');}
function addrLink(addr,label){return addr?`<a class="link" href="${esc(mapsUrl(addr))}" target="_blank" rel="noopener" title="Apri le indicazioni in Google Maps">${esc(label||addr)}</a>`:'';}
function fmtMin(m){m=int(m);return m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min':m+' min';}
function traffic(v){if(!v||!v.min)return '';const r=(v.minTraffico||v.min)/v.min;
  return r<=1.1?'<span class="pill ok">Traffico scorrevole</span>':r<=1.3?'<span class="pill warn">Traffico moderato</span>':'<span class="pill bad">Traffico intenso</span>';}
async function copyText(txt,okMsg){try{await navigator.clipboard.writeText(txt);toast(okMsg||'Copiato');}catch(e){toast('Copia non riuscita: seleziona il testo a mano','warn');}}

/* ---------- modello dati ---------- */
function normT(t){t=clone(t);
  if(!t.zone){t.zone=[{id:'z1',nome:'Platea',tipo:'platea',w:t.w||1000,h:t.h||1000,bg:t.bg||null,front:t.stage||null,rows:t.rows||[]}];
    delete t.rows;delete t.stage;delete t.bg;delete t.w;delete t.h;}
  t.zone.forEach(z=>{z.rows=z.rows||[];z.w=z.w||1000;z.h=z.h||1000;});return t;}
function seatsTot(t){return t.zone.reduce((a,z)=>a+z.rows.reduce((b,r)=>b+r.posti.length-(r.bloccati||[]).length,0),0);}
function prioOf(s){if(s.priorita===true)return 'P1';return ['P1','P2','P3'].includes(s.priorita)?s.priorita:'';}

/* ---------- archivio ---------- */
const LS='piantine-sala-v2',PREF='piantine-sala-pref';
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');COLLS.forEach(c=>S.c[c]=d[c]||{});Object.keys(S.c.teatri).forEach(k=>S.c.teatri[k]=normT(S.c.teatri[k]));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.c));}catch(e){}}
function loadPref(){try{Object.assign(S.pref,JSON.parse(localStorage.getItem(PREF)||'{}'));}catch(e){}}
function savePref(){try{localStorage.setItem(PREF,JSON.stringify(S.pref));}catch(e){}}
/* ---------- versione web (Supabase): attiva solo se c'è config.js ---------- */
const CFG=window.ML_CFG||null;let SB=null;
const SUPA_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js';
function isPriv(id){return /^priv_/.test(id||'');}
function B(id){if(!id)return '';if(!CFG)return '/_blob/'+id;return CFG.url+'/storage/v1/object/public/pub/'+encodeURIComponent(id);}
async function blobURL(id){if(!CFG||!isPriv(id))return B(id);const {data,error}=await SB.storage.from('priv').createSignedUrl(id,600);if(error)throw error;return data.signedUrl;}
async function upAsset(blob,priv){if(!S.assets)throw {code:'assets_unavailable'};return CFG?S.assets.upload(blob,priv):S.assets.upload(blob);}
function sbErr(e){return {code:(e&&(e.code||e.message))||'errore'};}
async function initSupa(){
  await loadScript(SUPA_JS);SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'pkce',lock:async(_n,_t,fn)=>await fn()}});
  S.mode='supa';setPill();
  S.assets={upload:async(blob,priv)=>{const ext=((blob.type||'').split('/')[1]||'bin').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');
      const id=(priv?'priv_':'')+uid('f')+'.'+ext;const {error}=await SB.storage.from(priv?'priv':'pub').upload(id,blob,{contentType:blob.type||'application/octet-stream',upsert:false});if(error)throw sbErr(error);return {id};}};
  S.downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}};
  const tok=landingToken();
  if(tok){const m=tok.match(/^sala-([A-Za-z0-9_.-]+)~/);if(m){const {data}=await SB.rpc('landing',{pid:m[1]});
      if(data&&data.piantina){S.c.piantine[m[1]]={...data.piantina,id:m[1]};if(data.teatro)S.c.teatri[data.teatroId]=normT({...data.teatro,id:data.teatroId});
        if(data.tappa)S.c.tappe[data.tappaId]={...data.tappa,id:data.tappaId};if(data.spettacoli)S.c.impostazioni.spettacoli=data.spettacoli;}}
    S.ready=true;renderLanding();return;}
  const {data:{session}}=await SB.auth.getSession();
  SB.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){S.pref.user='';savePref();V={name:'welcome'};render();}});
  if(!session){S.pref.user='';S.ready=true;V={name:'welcome'};render();return;}
  S.pref.user=(session.user.email||'').toLowerCase();savePref();
  await loadAllSupa();S.ready=true;onData();segnaPresenza();startOnline();setTimeout(archCatchup,45000);setTimeout(hsLearn,20000);
  const RT={};SB.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const c=(p.new&&p.new.coll)||(p.old&&p.old.coll);if(!c||!COLLS.includes(c))return;clearTimeout(RT[c]);RT[c]=setTimeout(()=>loadCollSupa(c).then(()=>onData(c)),1500);}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ready)loadAllSupa().then(()=>{onData();segnaPresenza();});});
}
/* primo accesso della giornata: serve al TM per sapere se il referente di zona oggi c'è */
function presKey(email){return String(email||'').toLowerCase().replace(/[^a-z0-9]+/g,'_');}
function presenteOggi(u){const p=u&&S.c.presenze[presKey(u.email)];return !!(p&&p.giorno===today());}
async function segnaPresenza(){const u=me();if(!u||!u.confermato)return;const k=presKey(u.email);const p=S.c.presenze[k];const now=nowStamp();
  if(p&&p.giorno===today()&&p.ultimo&&minsBetween(p.ultimo,now)<10)return;
  try{await put('presenze',k,{email:u.email,giorno:today(),ora:p&&p.giorno===today()?p.ora:nowHM(),ultimo:now});}catch(e){}}
function minsBetween(a,b){return Math.abs((new Date(b)-new Date(a))/60000);}
/* chi ha l'app aperta in questo momento (presenza in tempo reale di Supabase, gratuita) */
let ONLINE=new Set();
function startOnline(){const e=(S.pref.user||'').toLowerCase();if(!e||!SB||!SB.channel)return;
  try{const ch=SB.channel('online',{config:{presence:{key:e}}});if(!ch.track)return;
    ch.on('presence',{event:'sync'},()=>{ONLINE=new Set(Object.keys(ch.presenceState()).map(x=>x.toLowerCase()));paintOnline();});
    ch.subscribe(st=>{if(st==='SUBSCRIBED')ch.track({da:nowStamp()});});}catch(_){}}
function accStato(u){const e=String(u.email||'').toLowerCase();if(e&&ONLINE.has(e))return `<span class="pill ok" data-ast="${esc(e)}">Online ora</span>`;
  const p=S.c.presenze[presKey(e)];const last=p?(p.ultimo||(p.giorno&&p.ora?p.giorno+'T'+p.ora:'')):'';
  if(last){const d=last.slice(0,10),hh=last.slice(11,16);const quando=d===today()?'oggi':d===addDays(today(),-1)?'ieri':dObj(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
    return `<span class="pill" data-ast="${esc(e)}" title="Ultimo accesso">Ultimo accesso ${quando}${hh?' '+hh:''}</span>`;}
  return u.confermato?`<span class="pill" data-ast="${esc(e)}">Entrato in passato</span>`:`<span class="pill" data-ast="${esc(e)}">Mai entrato</span>`;}
function paintOnline(){document.querySelectorAll('[data-ast]').forEach(el=>{const u=users().find(x=>String(x.email||'').toLowerCase()===el.dataset.ast);if(u)el.outerHTML=accStato(u);});}
async function loadCollSupa(c){const data=[];for(let from=0;;from+=1000){const {data:part,error}=await SB.from('docs').select('id,data').eq('coll',c).order('id').range(from,from+999);if(error){toast('Archivio non raggiungibile ('+(error.code||error.message)+')','bad');return;}data.push(...part);if(part.length<1000)break;}
  const o={};data.forEach(r=>{if(r.data&&(r.data.rimossa||r.data.escluso||/DA ASSEGNARE/i.test(r.data.tour||'')))return;o[r.id]={...r.data,id:r.id};if(c==='teatri')o[r.id]=normT(o[r.id]);});S.c[c]=o;}
async function loadAllSupa(){await Promise.all(COLLS.map(loadCollSupa));}
async function googleLogin(){if(!SB)return;const {error}=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});if(error)toast('Accesso non riuscito ('+error.message+')','bad');}
async function put(coll,id,data){
  if(S.mode==='supa'){const d=clone(data);delete d.id;
    // se il documento esiste già: UPDATE (le regole di accesso permettono ad es. a TM e referenti di aggiornare il proprio profilo)
    const {data:upd,error}=await SB.from('docs').update({data:d}).eq('coll',coll).eq('id',id).select('id');if(error)throw sbErr(error);
    if(!upd||!upd.length){const {error:e2}=await SB.from('docs').insert({coll,id,data:d});if(e2)throw sbErr(e2);}S.c[coll][id]=coll==='teatri'?normT({...d,id}):{...d,id};return;}
  if(S.mode==='db'){await S.db.doc(coll+'/'+id).set(data);}
  else{S.c[coll][id]=coll==='teatri'?normT(data):clone(data);saveLocal();}
}
async function del(coll,id){
  if(S.mode==='supa'){const {error}=await SB.from('docs').delete().eq('coll',coll).eq('id',id);if(error)throw sbErr(error);delete S.c[coll][id];onData(coll);return;}
  if(S.mode==='db'){await S.db.doc(coll+'/'+id).delete();}
  else{delete S.c[coll][id];saveLocal();onData();}
}
function setPill(){const p=document.getElementById('storePill');if(!p)return;
  if(S.mode==='db'||S.mode==='supa'){p.className='store-pill db';p.textContent='Archivio condiviso';}
  else if(S.mode==='local'){p.className='store-pill local';p.textContent='Solo su questo dispositivo';}
  else{p.className='store-pill';p.textContent='Collegamento…';}}
async function initStore(){
  if(CFG){try{await initSupa();}catch(e){console.error('[ML] avvio',e);S.ready=true;toast('Errore all’avvio ('+((e&&e.message)||e)+')','bad');try{render();}catch(_){}}return;}
  let db=null;
  try{if(window.claude&&typeof claude.use==='function'){
    const r=await Promise.all([claude.use('db'),claude.use('assets'),claude.use('downloads')]);
    db=r[0];S.assets=r[1];S.downloads=r[2];}}catch(e){}
  if(db){
    S.db=db;S.mode='db';setPill();let first=0;
    COLLS.forEach(c=>db.collection(c).onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id};if(c==='teatri')o[d.id]=normT(o[d.id]);});S.c[c]=o;
        if(!S.ready&&++first>=COLLS.length)S.ready=true;onData(c);},
      e=>toast('Archivio non raggiungibile ('+e.code+')','bad')));
  }else{S.mode='local';loadLocal();S.ready=true;setPill();onData();}
}
const LIVE_VIEWS=['oggi','tournee','piantine','teatri','checklist','cast','documenti','altro','qr','welcome','controllo','mappa','acc','auto'];
function onData(c){if(landingToken()){renderLanding();return;}if(c==='segnalazioni'||c===undefined)fbNotify();renderNav();if((V.name==='cast'&&V.edit)||(V.name==='documenti'&&V.up)||(V.name==='oggi'&&V.cronoEdit)||(V.name==='documenti'&&V.fattEdit)||(V.name==='auto'&&(V.vEdit||V.rNew||V.eEdit))||(V.name==='oggi'&&(V.tipOpen||V.noteEdit))||(V.name==='profilo'&&V.profDirty)||((V.name==='altro'||V.name==='accessi')&&V.spEdit))return;if(LIVE_VIEWS.includes(V.name))render();}

/* ---------- tournée ---------- */
function tours(){const u=me();const all=allTours();if(!u)return all;
  if(u.ruolo==='tm')return all.filter(t=>t===u.tour);if(u.ruolo==='venditore')return all.filter(tr=>Object.values(S.c.tappe).some(t=>t.tour===tr&&inZone(t)));return all;}
const ALL='__ALL__',ALL_VIEWS=['tournee','mappa','cast','piantine','auto','checklist','documenti','qr'];
const TOUR_COLS={'FRANCESE 1':'#1F4FEA','FRANCESE 2':'#0B6E78','INGLESE':'#C8414B','SPAGNOLO':'#D98A1C'};
function tourShort(tr){const t=String(tr||'').toUpperCase().trim();let m=t.match(/^FRANCESE\s*(.*)$/);if(m)return ('FRA '+m[1]).trim();if(t.startsWith('INGLESE'))return 'ING'+t.slice(7);if(t.startsWith('SPAGNOLO'))return 'SPA'+t.slice(8);return tr;}
function tTag(tr){return tr?`<span class="tour-tag" style="--tc:${tourCol(tr)}" title="${esc(tr)}">${esc(tourShort(tr))}</span>`:'';}
function tourCol(tr){return TOUR_COLS[tr]||PALETTE[Math.abs([...String(tr)].reduce((a,c)=>a*31+c.charCodeAt(0),7))%PALETTE.length];}
function canAll(){const u=me();return !!u&&u.ruolo!=='tm';}
function curTour(){const ts=tours();if(S.pref.tour===ALL&&canAll()&&ALL_VIEWS.includes(V.name))return ALL;return ts.includes(S.pref.tour)?S.pref.tour:(ts[0]||'');}
document.addEventListener('click',e=>{if(!e.target.closest('[data-alltours]'))return;S.pref.tour=ALL;try{savePref();}catch(_){}V.qrDay=null;V.vEdit=false;V.vChange=false;V.rNew=false;render();window.scrollTo(0,0);});
function tourLbl(){const t=curTour();return t===ALL?'Tutti i tour':'Tour '+t;}
function tourTappe(){const tr=curTour();return Object.values(S.c.tappe).filter(t=>(tr===ALL||t.tour===tr)&&inZone(t)).sort((a,b)=>a.data.localeCompare(b.data));}
function pickDay(list){const td=today();let i=list.findIndex(t=>t.data===td);if(i>=0)return {i,kind:'oggi'};
  i=list.findIndex(t=>t.data>td);if(i>=0)return {i,kind:'prossima'};return {i:list.length-1,kind:'passata'};}
function teatroDoc(tp){return tp&&tp.teatroId?S.c.teatri[tp.teatroId]||null:null;}

function findP(tappaId,rep){return Object.values(S.c.piantine).find(p=>p.tappaId===tappaId&&p.replica===rep);}
function sameTour(d,tp){return !d.tour||!tp.tour||d.tour===tp.tour;}
function dealsFor(tp,rep){return Object.values(S.c.deals).filter(d=>d.data===tp.data&&d.replica===rep&&norm(d.citta)===norm(tp.citta)&&sameTour(d,tp));}
function dealsHash(ds){return ds.filter(d=>d.stage!=='Chiuso perso').map(d=>[d.id,d.studenti,d.accompagnatori,d.disabili,d.grado,d.note,d.stage].join('|')).sort().join('#');}
function pStatus(tp,rep){const p=findP(tp.id,rep);const ds=dealsFor(tp,rep);
  if(!p)return {k:'todo',l:'Da creare',p:null,ds};

function prevTappa(tp){const l=tourTappe();const i=l.findIndex(x=>x.id===tp.id);return i>0?l[i-1]:null;}
function nextTappa(tp){const l=tourTappe();const i=l.findIndex(x=>x.id===tp.id);return i>=0&&i<l.length-1?l[i+1]:null;}

function nextColor(p){const used=new Set(p.scuole.map(s=>s.c));let c=0;while(used.has(c)&&c<PALETTE.length)c++;return c>=PALETTE.length?p.scuole.length:c;}
function dealToSchool(d){const note=d.note||'';const pr=/\bP1\b/i.test(note)?'P1':/\bP2\b/i.test(note)?'P2':/\bP3\b/i.test(note)?'P3':'';
  return {dealId:d.id,nome:d.scuola||d.dealname||'Scuola',docente:d.docente||'',telDocente:d.telefonoDocente||'',refScuola:d.referente||'',telRef:d.telefonoReferente||'',persone:int(d.studenti)+int(d.accompagnatori),livello:d.grado==='superiori'?'superiori':'medie',disabili:int(d.disabili),priorita:pr,note,stage:d.stage||''};}
function syncFromDeals(p,deals){
  const active=deals.filter(d=>d.stage!=='Chiuso perso');let added=0,updated=0,removed=0;
  active.forEach(d=>{const m=dealToSchool(d);const s=p.scuole.find(x=>x.dealId===d.id);
    if(s){const key=x=>JSON.stringify([int(x.persone),x.livello,int(x.disabili),prioOf(x),x.stage]);const before=key(s);Object.assign(s,m);if(key(s)!==before)updated++;}
    else{p.scuole.push({id:uid('s'),...m,classeDis:'',c:nextColor(p)});added++;}});
  p.scuole=p.scuole.filter(s=>{if(s.dealId&&!active.find(d=>d.id===s.dealId)){removed++;for(const k in p.assign)if(p.assign[k]===s.id)delete p.assign[k];return false;}return true;});
  p.hubspot={sync:new Date().toISOString(),hash:dealsHash(deals)};
  return {added,updated,removed,lost:deals.length-active.length};
}

async function saveAcc(pid,fn){const cur=S.c.piantine[pid];if(!cur)return;const A=clone(accOf(cur));fn(A);const out={...clone(cur),accoglienza:A};delete out.id;
  S.c.piantine[pid]={...out,id:pid};try{await put('piantine',pid,out);}catch(err){toast('Non salvato ('+(err.code||err.message)+')','bad');}}

  if(a==='back'){const y=V.y0||0;go('oggi',{dayId:V.dayId});window.scrollTo(0,y);return;}if(role()!=='tm')return;const sid=b.dataset.s;const y=window.scrollY;

async function shrinkImage(file,max){max=max||1600;const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));}catch(e){return file;}finally{URL.revokeObjectURL(url);}}
async function uploadPhoto(file,priv){const blob=await shrinkImage(file);const up=await upAsset(blob,priv);return up.id;}
function fotoFor(tp){return Object.values(S.c.foto||{}).filter(f=>f.tappaId===tp.id&&f.tipo==='scenografia').sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));}
function fotoRepFor(tp){return Object.values(S.c.foto||{}).filter(f=>f.tappaId===tp.id&&f.tipo==='replica').sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));}
function thumbsRep(fs){return `<div class="thumbs">${fs.map(f=>`<button class="thumb" data-view="${esc(f.asset)}" data-ext="jpg" data-title="Replica ${esc(f.replica||'')} · ${esc(f.teatroNome||'')} · ${esc(shortDate(f.data))}"><img data-bid="${esc(f.asset)}" alt="Foto della replica del ${esc(shortDate(f.data))}" loading="lazy"><span>${esc(shortDate(f.data))}${f.replica?' · '+esc(f.replica):''}</span></button>`).join('')}</div>`;}

function emg(){return {...EMG_DEF,...(S.c.impostazioni.emergenze||{})};}
function vKey(tr){return 'veicolo_'+norm(tr||curTour()).replace(/[^a-z0-9]+/g,'_');}
function vData(){return S.c.impostazioni[vKey()]||{};}
function flotta(){return ((S.c.impostazioni.flotta||{}).veicoli||[]);}
function vehOf(v){return flotta().find(x=>x.id===(v||{}).veicoloId)||null;}
function parseNum(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf(':');return i>0?{nome:l.slice(0,i).trim(),tel:l.slice(i+1).trim()}:{nome:l,tel:''};});}
function vehLbl(x){return [x.modello,x.targa].filter(Boolean).join(' · ')||'Veicolo';}
function tourLegs(){const l=tourTappe();const out=[];
  l.forEach((tp,i)=>{const v=tp.viaggio||{};const f=(tp.repliche||[])[0]||'09:00';const pv=l[i-1];
    if(v.hotelTeatro&&v.hotelTeatro.km)out.push({ts:tp.data+'T'+f,km:+v.hotelTeatro.km,l:`${pv&&pv.hotel?pv.hotel.nome:'Hotel'} → ${tp.teatroNome||'Teatro'}`,data:tp.data,quando:'mattina'});
    if(v.teatroHotel&&v.teatroHotel.km)out.push({ts:tp.data+'T20:00',km:+v.teatroHotel.km,l:`${tp.teatroNome||'Teatro'} → ${tp.hotel?tp.hotel.nome:'Hotel'}`,data:tp.data,quando:'sera'});});
  return out;}
function kmEstimate(){const v=vData();const rs=[...(v.letture||[])].sort((a,b)=>a.ts.localeCompare(b.ts));const base=rs.length?rs[rs.length-1]:(v.kmIniziali!=null&&v.kmIniziali!==''?{km:+v.kmIniziali,ts:v.kmIniTs||''}:null);
  if(!base)return null;const now=nowStamp();const legs=tourLegs();const done=legs.filter(x=>x.ts>base.ts&&x.ts<=now);
  return {km:Math.round(base.km+done.reduce((a,x)=>a+x.km,0)),base,done,legs,now,toEnd:Math.round(legs.filter(x=>x.ts>now).reduce((a,x)=>a+x.km,0))};}

function vehTour(id){return allTours().find(t=>t!==curTour()&&(S.c.impostazioni[vKey(t)]||{}).veicoloId===id)||'';}
function kmOfTour(t){const save=S.pref.tour;try{S.pref.tour=t;const e=kmEstimate();return e?e.km:'';}finally{S.pref.tour=save;}}
document.addEventListener('change',e=>{if(V.name!=='auto'||e.target.id!=='cVeh')return;const o=vehTour(e.target.value);const box=document.getElementById('cSwapBox');

async function putImp(key,o){const cur=clone(S.c.impostazioni[key]||{});const out={...cur,...o};delete out.id;S.c.impostazioni[key]={...out,id:key};await put('impostazioni',key,out);}
document.addEventListener('click',async e=>{if(V.name!=='auto')return;const b=e.target.closest('[data-au]');if(!b)return;const a=b.dataset.au;const y=window.scrollY;const re=()=>{render();window.scrollTo(0,y);};
  try{
  if(a==='opent'){S.pref.tour=b.dataset.t;try{savePref&&savePref();}catch(_){}render();window.scrollTo(0,0);return;}
  if(a==='vedit'){V.vEdit=true;V.rNew=false;V.vChange=false;re();}
  else if(a==='vchange'){V.vChange=true;V.vEdit=false;V.rNew=false;re();}
  else if(a==='ccancel'){V.vChange=false;re();}
  else if(a==='csave'){const v=vData();const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};const vid=g('cVeh');const sel=vid&&vid!=='__altro'?flotta().find(x=>x.id===vid):null;
    const targa=sel?sel.targa:g('cTarga').toUpperCase();const km=g('cKm');const kmOld=g('cKmOld');
    if(!targa){toast('Scegli il nuovo veicolo o scrivi la targa','warn');return;}if(km===''){toast('Scrivi i km del nuovo veicolo','warn');return;}
    const old=vehOf(v);const now=nowStamp();const est0=(()=>{const e=kmEstimate();return e?e.km:'';})();const lett=[...(v.letture||[])];if(kmOld!=='')lett.push({km:int(kmOld),ts:now,tm:tmName(),finale:true});
    const storico=[...(v.storico||[]),{veicoloId:v.veicoloId||'',targa:v.targa||'',modello:old?old.modello||'':'',kmIniziali:v.kmIniziali??'',kmIniTs:v.kmIniTs||'',dal:v.kmIniTs||'',al:now,kmFinali:kmOld===''?'':int(kmOld),letture:lett}];
    const ot=sel?vehTour(sel.id):'';const swap=ot&&document.getElementById('cSwap')&&document.getElementById('cSwap').checked;
    await putImp(vKey(),{veicoloId:sel?sel.id:'',targa,kmIniziali:int(km),kmIniTs:now,letture:[],storico});
    if(swap){/* l'altro tour prende il veicolo lasciato da questo */const ok=vKey(ot);const ov=S.c.impostazioni[ok]||{};const oldKm=kmOld!==''?int(kmOld):(est0!==''?est0:'');
      const ost=[...(ov.storico||[]),{veicoloId:ov.veicoloId||'',targa:ov.targa||'',modello:sel.modello||'',kmIniziali:ov.kmIniziali??'',kmIniTs:ov.kmIniTs||'',dal:ov.kmIniTs||'',al:now,kmFinali:int(km),letture:[...(ov.letture||[]),{km:int(km),ts:now,tm:tmName(),finale:true}]}];
      await putImp(ok,{veicoloId:v.veicoloId||'',targa:v.targa||'',kmIniziali:oldKm,kmIniTs:now,letture:[],storico:ost});}
    V.vChange=false;toast(swap?`Scambio fatto: qui ${targa}, ${tourShort(ot)} prende ${v.targa||'il veicolo precedente'}`:`Cambio fatto: ora il tour usa ${targa}`);re();}
  else if(a==='fnew'){V.fEdit='new';re();}
  else if(a==='fedit'){V.fEdit=b.dataset.id;re();}
  else if(a==='fcancel'){V.fEdit=null;re();}
  else if(a==='fsave'){const g=id=>document.getElementById(id).value.trim();const fl=clone(flotta());const id=b.dataset.id==='new'?uid('v'):b.dataset.id;
    const o={id,modello:g('fMod'),targa:g('fTarga').toUpperCase(),compagnia:g('fComp'),polizza:g('fPol'),assistenza:g('fAss'),sinistri:g('fSin'),altri:document.getElementById('fAltri').value.trim(),noleggio:document.getElementById('fNol').checked};
    const i=fl.findIndex(x=>x.id===id);if(i>=0)fl[i]=o;else fl.push(o);await putImp('flotta',{veicoli:fl});V.fEdit=null;toast('Veicolo salvato');re();}
  else if(a==='cpins'){const veh=vehOf(vData());if(veh)copyText(`Targa ${veh.targa} · ${veh.compagnia} · polizza ${veh.polizza}`,'Targa e polizza copiate');}
  else if(a==='cppos'){if(!navigator.geolocation){toast('Posizione non disponibile','warn');return;}toast('Cerco la posizione…');
    navigator.geolocation.getCurrentPosition(pp=>{const {latitude:la,longitude:lo}=pp.coords;copyText(`Posizione: https://maps.google.com/?q=${la.toFixed(6)},${lo.toFixed(6)}`,'Posizione copiata: incollala dove ti serve');},()=>toast('Attiva la posizione del telefono e riprova','warn'),{enableHighAccuracy:true,timeout:15000});}
  else if(a==='vcancel'){V.vEdit=false;re();}
  else if(a==='vsave'){const km=document.getElementById('vKm0').value;const v=vData();const vs=document.getElementById('vVeh'),vt=document.getElementById('vTarga');const sel=vs?flotta().find(x=>x.id===vs.value):null;
    await putImp(vKey(),{...(vs?{veicoloId:vs.value,targa:sel?sel.targa:''}:{targa:vt.value.trim().toUpperCase()}),kmIniziali:km===''?'':int(km),kmIniTs:String(km)!==String(v.kmIniziali??'')?nowStamp():(v.kmIniTs||nowStamp())});V.vEdit=false;toast('Veicolo salvato');re();}
  else if(a==='rnew'){V.rNew=true;V.vEdit=false;re();}
  else if(a==='rcancel'){V.rNew=false;re();}
  else if(a==='rsave'){const km=document.getElementById('rKm').value;const f=document.getElementById('rFoto').files[0];
    if(km===''){toast('Scrivi i km','warn');return;}if(!f){toast('Aggiungi la foto del contachilometri','warn');return;}
    b.disabled=true;b.textContent='Carico…';const foto=await uploadPhoto(f);const v=vData();
    await putImp(vKey(),{letture:[...(v.letture||[]),{km:int(km),ts:nowStamp(),foto,tm:tmName()}]});V.rNew=false;archSync();toast('Km aggiornati');re();}
  else if(a==='eedit'){V.eEdit=true;re();}
  else if(a==='ecancel'){V.eEdit=false;re();}
  else if(a==='esave'){const numeri=document.getElementById('eNum').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf(':');return i>0?{nome:l.slice(0,i).trim(),tel:l.slice(i+1).trim()}:{nome:l,tel:''};});
    await putImp('emergenze',{assicurazione:{nome:document.getElementById('eAssN').value.trim(),tel:document.getElementById('eAssT').value.trim()},numeri});V.eEdit=false;toast('Numeri salvati');re();}
  }catch(err){toast('Non salvato ('+(err.code||err.message||'errore')+')','bad');b.disabled=false;}
});

/* ---------- PDF della giornata (offline) ---------- */
async function offlinePDF(tp,btn){
  if(!S.downloads){toast('Il download non è disponibile in questa vista','bad');return;}
  const lbl=btn.textContent;btn.disabled=true;btn.textContent='Preparo il PDF…';
  try{await loadScript(JSPDF);const ps=(tp.repliche||[]).map(r=>findP(tp.id,r)).filter(Boolean);let doc=null;
    for(const p of ps){const t=S.c.teatri[p.teatroId];if(t)doc=await planPDF(doc,p,t);}
    const {jsPDF}=window.jspdf;if(!doc)doc=new jsPDF({unit:'mm',format:'a4'});else doc.addPage('a4','portrait');
    const M=12,PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight();let y=M+4;
    const line=(txt,o)=>{o=o||{};doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.fs||10);doc.setTextColor(o.c||'#17202B');
      doc.splitTextToSize(txt,PW-2*M-(o.x||0)).forEach(l=>{if(y>PH-M){doc.addPage('a4','portrait');y=M+4;}doc.text(l,M+(o.x||0),y);y+=(o.fs||10)*0.45;});};
    line(`${tp.teatroNome||''} · ${tp.citta||''}`,{b:1,fs:15});line(`${cap(longDate(tp.data))} · repliche ${(tp.repliche||[]).join(', ')}`,{c:'#5B6675'});y+=2;
    if(tp.indirizzo)line('Teatro: '+tp.indirizzo);
    if(tp.referente)line(`Referente: ${tp.referente}${tp.telReferente?' · '+tp.telReferente:''}`);
    if(tp.tecnico)line(`Tecnico: ${tp.tecnico}${tp.telTecnico?' · '+tp.telTecnico:''}`);
    if(tp.hotel)line(`Hotel: ${tp.hotel.nome} · ${tp.hotel.indirizzo||''}${tp.hotel.telefono?' · '+tp.hotel.telefono:''}`);
    y+=4;
    (tp.repliche||[]).forEach(r=>{const p=findP(tp.id,r);line(`Replica ${r}${p?` · ${p.scuole.length} scuole · ${p.scuole.reduce((a,s)=>a+int(s.persone),0)} persone`:' · piantina non creata'}`,{b:1,fs:12});y+=1;
      if(p){const col=colorOf(p);p.scuole.forEach(s=>{if(y>PH-M-10){doc.addPage('a4','portrait');y=M+4;}
        doc.setFillColor(col[s.id]||'#cccccc');doc.setDrawColor('#55606C');doc.rect(M,y-3.2,4,4,'FD');
        line(s.nome||'Scuola',{b:1,x:6});line(`Referente: ${s.refScuola||(s.docente?'Prof. '+s.docente:'non indicato')} · Tel. ${s.telRef||s.telDocente||'non disponibile'}`,{x:6,fs:10});
        line(`${int(s.persone)} persone${int(s.disabili)?' · '+int(s.disabili)+' con disabilità':''}${s.note?' · '+s.note:''}`,{x:6,c:'#5B6675',fs:9});y+=2;});}
      y+=3;});
    const slug=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    await S.downloads.save({filename:`Giornata_${slug(tp.citta)}_${tp.data}.pdf`,data:doc.output('blob')});toast('PDF della giornata pronto');
  }catch(err){if(!(err&&err.code==='declined'))toast('PDF non creato ('+((err&&(err.code||err.message))||'errore')+')','bad');}
  btn.disabled=false;btn.textContent=lbl;
}

/* =================== TOURNÉE =================== */
function renderTournee(){
  const list=tourTappe();const td=today();
  let h=`<div class="page-head"><span class="eyebrow">${esc(tourLbl())}</span><h1>Tournée</h1><p class="muted" style="margin:0">Tocca una data per aprire la sua giornata.</p><div class="row-btns"><button class="btn small" data-trmap>${IC.mappa} Vedi la mappa della tournée</button></div></div>`;
  if(!list.length){app.innerHTML=h+`<div class="empty"><b>Nessuna data.</b></div>`;return;}
  const isAll=curTour()===ALL;let month='';h+=`<div class="tlist">`;
  list.forEach(tp=>{const m=dObj(tp.data).toLocaleDateString('it-IT',{month:'long',year:'numeric'});if(m!==month){month=m;h+=`<div class="tmonth">${esc(cap(m))}</div>`;}
    const ck=S.c.checklist[tp.id]||{};const past=tp.data<td;
    h+=`<button class="trow ${tp.data===td?'today':''}" data-tr="${tp.id}"${isAll?` style="border-left:5px solid ${tourCol(tp.tour)}"`:''}>
      <span class="tdate"><b>${dObj(tp.data).getDate()}</b><span>${dObj(tp.data).toLocaleDateString('it-IT',{weekday:'short'})}</span></span>
      <span class="tmain">${isAll?`<span class="tour-tag" style="--tc:${tourCol(tp.tour)}">${esc(tp.tour)}</span>`:''}<b>${esc(tp.citta)}</b><span class="muted small">${esc(tp.teatroNome||'')}${teatroOf(tp)?'':' · sala da mappare'}</span></span>
      <span class="tmeta">${(tp.repliche||[]).map(r=>{const st=pStatus(tp,r);return `<span class="dot ${st.k}" title="Piantina ${esc(r)}: ${st.l}"></span>`;}).join('')}
        ${tp.hotel?hotelPill(tp.hotel):''}${ck.inviata?'<span class="pill ok">Checklist</span>':past?'<span class="pill bad">Checklist mancante</span>':''}</span></button>`;});
  h+=`</div><p class="muted small">Pallini: un pallino per replica · verde piantina pronta, arancio da creare, rosso dati HubSpot cambiati.</p>`;

function folderGuess(path){const segs=String(path).split('/');const src=segs.length>1?segs[segs.length-2]:(bulkFolder(path)||segs[0].replace(/\s*\(\d+ file\)$/,'').replace(/\.(pdf|png|jpe?g|webp)$/i,''));

/* una cartella = un teatro: tutti i file della stessa cartella vanno nello stesso teatro (platea, galleria, palchi…) */
function bulkFolder(path){const segs=String(path).split('/');if(segs.length>1)return segs[segs.length-2];const m=segs[0].match(/^(.*?) __ /);return m?m[1]:'';}
function bulkStart(files){const fl=[...files].filter(f=>f.size>0&&(/pdf|image/.test(f.type)||/\.(pdf|png|jpe?g|webp)$/i.test(f.name)));

/* ogni pagina del PDF diventa un'immagine (max 6 pagine) */
async function bulkPages(f){const out=[];const mk=(w,hh)=>{const c=document.createElement('canvas');c.width=w;c.height=hh;return c;};

    try{const files=x.files||[x.f];let t=x.t?normT(clone(S.c.teatri[x.t.id])):{id:uid('t'),nome:x.nuovo.nome,citta:x.nuovo.citta,zone:[]};
      const up=async pg=>(await upAsset(pg.blob,false)).id;
      if(x.t&&hasPlan(t)){for(const f of files)for(const pg of await bulkPages(f))t.pianteAltre=[...(t.pianteAltre||[]),{id:await up(pg),file:(x.key?x.key+'/':'')+f.name,w:pg.w,h:pg.h,ts}];}
      else{const pl=bulkPlan(files);const zones=[];
        for(const zz of pl.zones){const pgs=await bulkPages(zz.f);for(const pg of pgs){const zn=pageZone(zz.z,zz.f,pg.page);zones.push({id:uid('z'),nome:zn.nome,tipo:zn.tipo||'platea',w:1000,h:Math.round(1000*pg.h/pg.w),bg:await up(pg),front:null,rows:[],...(zn.controlla?{daControllare:true}:{})});}}
        if(zones.length)t.zone=zones;
        for(const f of pl.altre)for(const pg of await bulkPages(f))t.pianteAltre=[...(t.pianteAltre||[]),{id:await up(pg),file:(x.key?x.key+'/':'')+f.name,w:pg.w,h:pg.h,ts}];
        t.piantaOriginale=(x.key||'')+' — '+files.map(f=>f.name).join(', ');}
      t.aggiornato=ts;const id=t.id;delete t.id;await put('teatri',id,t);S.c.teatri[id]=normT({...t,id});ok++;}catch(e){ko++;console.error(e);}}
  V.bulk=null;render();toast(`${ok} teatri caricati${ko?` · ${ko} non riusciti`:''}: ora le sale sono pronte da mappare`,ko?'warn':undefined);}

function gemelloArchivio(t){if(!t.nome||/^[\s\-–—]*$/.test(t.nome))return null;let best=null,bs=0;
  Object.values(S.c.teatri).forEach(c=>{if(c.id===t.id||c.daHubspot||c.archiviato||!hasPlan(c))return;const sc=Math.max(bulkScore(t.nome+' '+t.citta,c),bulkScore(c.nome+' '+c.citta,t));if(sc>bs){bs=sc;best=c;}});
  return bs>=1.5?best:null;}

function teatroInfo(t,byT){const td=today();const tps=(byT[t.id]||[]).slice().sort((a,b)=>a.data.localeCompare(b.data));const next=tps.find(x=>x.data>=td);
  const rows=t.zone.reduce((a,z)=>a+z.rows.length,0);const bg=t.zone.some(z=>z.bg);const noFront=t.zone.some(z=>z.rows.length&&!z.front);const iss=[];
  const twin=!hasPlan(t)&&t.daHubspot?gemelloArchivio(t):null;if(twin)iss.push({k:'bad',l:`La pianta c’è già in archivio come “${twin.nome}” (${twin.citta||''}): collegala`,twin});
  if(/^[\s\-–—]*$/.test(t.nome||'')||/da definire/i.test(t.nome||''))iss.push({k:'bad',l:'Nome del teatro mancante su HubSpot'});
  if(!rows&&next)iss.push({k:'bad',l:`Sala da mappare · prima data ${shortDate(next.data)}`});
  else if(!rows&&bg)iss.push({k:'warn',l:'Pianta caricata, file e posti da disegnare'});
  else if(!rows&&!bg&&!twin)iss.push({k:'warn',l:'Manca la pianta'});
  if(noFront)iss.push({k:'warn',l:'Palco non segnato'});
  if(t.zone.some(z=>z.daControllare))iss.push({k:'warn',l:'Pagine in più della pianta: controlla i nomi delle zone'});
  if((t.pianteAltre||[]).length)iss.push({k:'warn',l:`${t.pianteAltre.length} piante aggiuntive da controllare`});
  return {tours:[...new Set(tps.map(x=>x.tour))],next,iss,urg:iss.some(x=>x.k==='bad')?0:iss.length?1:2};}

function spacing(z){const sp=[];(z.rows||[]).forEach(r=>{const n=r.posti.length;if(n>1)sp.push(Math.hypot(r.x2-r.x1,r.y2-r.y1)/(n-1));});

      seats.push({k,r,i,label:r.posti[i],x,y,ang,fixed,excl:ex,blocked:fixed||ex,carr:!fixed&&(r.carrozzina||[]).includes(i),proj:(x-st.x1)*ux+(y-st.y1)*uy,dist:distSeg(x,y,st)});}});

  lines.sort((a,b)=>a.dist-b.dist);

function buildSVG(z,G,o){

  if(o.crop){const b=contentBox(z,G);if(b)vb=[b.x,b.y,b.w,b.h];}
  vb=vb.map(f2);
  let s=`<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" role="img" aria-label="Piantina ${esc(z.nome||'')}">`;
  s+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:var(--canvas)"/>`;
  if(o.showBg&&o.bgUrl)s+=`<image href="${esc(o.bgUrl)}" x="0" y="0" width="${z.w}" height="${z.h}" opacity="${o.bgOp}" preserveAspectRatio="xMidYMid meet"/>`;
  if(z.front)s+=frontShape(z,G).svg;
  G.lines.forEach(l=>{const a=l.seats[0],b=l.seats[l.seats.length-1];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy);
    if(L<1e-6){dx=G.ux;dy=G.uy;}else{dx/=L;dy/=L;}const off=S0*1.15;
    s+=`<text x="${f2(a.x-dx*off)}" y="${f2(a.y-dy*off+S0*0.22)}" font-size="${f2(S0*0.62)}" style="fill:var(--muted)">${esc(l.fila)}</text>`;
    if(L>S0)s+=`<text x="${f2(b.x+dx*off)}" y="${f2(b.y+dy*off+S0*0.22)}" font-size="${f2(S0*0.62)}" style="fill:var(--muted)">${esc(l.fila)}</text>`;});
  G.seats.forEach(x=>{s+=seatSVG(x,S0,o);});
  (o.pts||[]).forEach(p=>{s+=`<circle cx="${f2(p.x)}" cy="${f2(p.y)}" r="${f2(S0*0.38)}" style="fill:var(--accent);stroke:var(--surface);stroke-width:${f2(S0*0.08)}"/>`;});
  return s+'</svg>';
}
function seatSVG(x,S0,o){
  const sid=o.assign&&!x.blocked?o.assign[x.k]:null;const c=sid&&o.colorOf?o.colorOf[sid]:null;
  const sel=(o.selRow&&x.r.id===o.selRow)||(o.selSet&&o.selSet.has(x.r.id));const h=S0/2;
  const fill=x.fixed?'fill:var(--blocked)':x.excl?'fill:var(--warn-soft)':(c?'fill:'+c:'fill:var(--seat)');
  const stroke=sel?'stroke:var(--accent)':x.excl?'stroke:var(--warn)':(c?'stroke:rgba(0,0,0,.25)':'stroke:var(--seat-stroke)');
  const sw=f2(sel?S0*0.13:S0*0.05);
  let s=`<g class="st" data-k="${x.k}" transform="translate(${f2(x.x)} ${f2(x.y)}) rotate(${f2(x.ang)})"><rect x="${f2(-h)}" y="${f2(-h)}" width="${f2(S0)}" height="${f2(S0)}" rx="${f2(S0*0.18)}" style="${fill};${stroke};stroke-width:${sw}"/>`;
  if(x.blocked)s+=`<path d="M${f2(-S0*.26)} ${f2(-S0*.26)}L${f2(S0*.26)} ${f2(S0*.26)}M${f2(S0*.26)} ${f2(-S0*.26)}L${f2(-S0*.26)} ${f2(S0*.26)}" style="stroke:${x.excl?'var(--warn)':'var(--surface)'};stroke-width:${f2(S0*.1)}"/>`;
  else if((o.carr&&o.carr[x.k])||x.carr)s+=`<rect x="${f2(-h*1.25)}" y="${f2(-h*1.25)}" width="${f2(S0*1.25)}" height="${f2(S0*1.25)}" rx="${f2(S0*0.25)}" style="fill:none;stroke:#1E5BB8;stroke-width:${f2(S0*0.12)}"/><text y="${f2(S0*0.2)}" font-size="${f2(S0*0.62)}" style="fill:${c?inkFor(c):'#1E5BB8'}">♿</text>`;
  else s+=`<text y="${f2(S0*0.17)}" font-size="${f2(S0*(String(x.label).length>2?0.4:0.46))}" style="fill:${c?inkFor(c):'var(--seat-ink)'}">${esc(x.label)}</text>`;
  return s+'</g>';
}

function parseSpec(spec){const out=[];String(spec).split(/[,;\s]+/).filter(Boolean).forEach(tok=>{const m=tok.match(/^(\d+)-(\d+)$/);
  if(m){const a=+m[1],b=+m[2];if(Math.abs(b-a)>300)return;const st=a<=b?1:-1;for(let i=a;st>0?i<=b:i>=b;i+=st)out.push(String(i));}
  else out.push(tok.toUpperCase());});return out.slice(0,300);}
function postiFrom(r){if(r.spec&&String(r.spec).trim())return parseSpec(r.spec);
  const n=Math.min(300,int(r.n));const p=parseInt(r.primo);const a=isNaN(p)?1:p;return Array.from({length:n},(_,i)=>String(a+i));}
function previewLabels(arr){if(!arr.length)return 'Nessun posto: indica quanti sono.';
  const show=arr.length>8?arr.slice(0,4).join(', ')+' … '+arr.slice(-3).join(', '):arr.join(', ');return `${show} · <b>${arr.length} posti</b>`;}

/* ---------- distribuzione ---------- */
/* Distribuzione automatica dei posti.
   Ordine dal palco: prima le medie, poi le superiori; dentro ogni grado P1, P2, P3, poi le altre (a parità, l’ordine dell’elenco; tra due P1 la più piccola). L’ordine si rispetta sempre.
   - Le scuole stanno una DIETRO l’altra: ogni fila è di una sola scuola.
   - Si riempie prima la platea. Se una scuola non ci sta intera: se in platea restano almeno 2 file la
     scuola si divide (davanti in platea, il resto in galleria); se resta 1 fila sola va tutta in galleria
     e la piantina segnala i posti liberi in platea.
   - Se la platea ha due blocchi separati dal corridoio, ogni scuola sta in un blocco solo, in colonna: si riempie per prima la colonna più avanti.
   - Una scuola con studenti con disabilità non va mai in galleria; se è segnato un posto carrozzina
     la scuola si dispone attorno a quel posto.
   - Se con queste regole i posti non bastano, le scuole possono condividere le file (sala quasi piena). */
function distribute(t,p){
  const GT=geomT(t,p.esclusi);const carr=p.carrozzina||{};
  const free=new Set(Object.values(GT.byK).filter(s=>!s.blocked).map(s=>s.k));
  const lv=s=>s.livello==='superiori'?1:0;
  const zones=GT.order.map(({z,G})=>{const m=new Map(),lc=new Map();G.lines.forEach((l,i)=>{const f=String(l.fila||'').trim()||('#'+i);if(!m.has(f)){m.set(f,[]);lc.set(f,[]);}m.get(f).push(...l.seats.filter(s=>free.has(s.k)));lc.get(f).push(l);});
    const keys=[...m.keys()].filter(f=>m.get(f).length);const all=keys.flatMap(f=>m.get(f));const c=all.length?all.reduce((a,x)=>a+x.proj,0)/all.length:0;
    return {nome:z.nome,pl:(z.tipo||'platea')==='platea',c,rows:keys.map(f=>({fila:f,seats:m.get(f).slice().sort((a,b)=>a.proj-b.proj),lines:lc.get(f)}))};});
  const rank=x=>lv(x.s)*4+(x.pr==='P1'?0:x.pr==='P2'?1:x.pr==='P3'?2:3);
  const sch0=p.scuole.map((s,idx)=>({s,idx,n:int(s.persone),dis:int(s.disabili),pr:prioOf(s)})).filter(x=>x.n>0)
    .sort((a,b)=>rank(a)-rank(b)||(a.pr==='P1'&&b.pr==='P1'?a.n-b.n:0)||a.idx-b.idx);
  const near=(arr,c)=>arr.slice().sort((a,b)=>Math.abs(a.proj-c)-Math.abs(b.proj-c));
  /* posto carrozzina: la scuola con disabilità si mette attorno a quel posto */
  let anchor=null;const isCarr=k=>!!carr[k]||!!(GT.byK[k]&&GT.byK[k].carr);const ck=Object.keys(carr).find(k=>free.has(k))||Object.values(GT.byK).filter(q=>q.carr&&free.has(q.k)).map(q=>q.k)[0];
  if(ck){const D=sch0.filter(x=>x.dis>0).sort((a,b)=>b.dis-a.dis)[0];
    if(D){zones.forEach((z,zi)=>z.rows.forEach((r,ri)=>{if(r.seats.some(q=>q.k===ck))anchor={D,zi,ri,proj:GT.byK[ck].proj};}));}}
  const place=order=>{
    const taken=zones.map(z=>z.rows.map(()=>false)),res={};const notes=[];
    const fill=(x,zi,ris,n,c)=>{let left=n;for(const ri of ris){const r=zones[zi].rows[ri];taken[zi][ri]=true;
      const sq=near(r.seats,c==null?zones[zi].c:c);if(c!=null&&anchor)sq.sort((a,b)=>(isCarr(b.k)?1:0)-(isCarr(a.k)?1:0));
      for(const q of sq){if(!left)break;res[q.k]=x.s.id;left--;}}return n-left;};
    const freeRows=zi=>zones[zi].rows.map((r,ri)=>ri).filter(ri=>!taken[zi][ri]);
    if(anchor){const z=zones[anchor.zi];const ris=[anchor.ri];let cap=z.rows[anchor.ri].seats.length,d=1;
      while(cap<anchor.D.n&&(anchor.ri+d<z.rows.length||anchor.ri-d>=0)){for(const ri of [anchor.ri+d,anchor.ri-d]){if(cap>=anchor.D.n)break;if(ri>=0&&ri<z.rows.length){ris.push(ri);cap+=z.rows[ri].seats.length;}}d++;}
      if(cap<anchor.D.n)return null;ris.sort((a,b)=>Math.abs(a-anchor.ri)-Math.abs(b-anchor.ri));fill(anchor.D,anchor.zi,ris,anchor.D.n,anchor.proj);}
    let rest=order.filter(x=>!anchor||x!==anchor.D);
    /* platea con due blocchi separati dal corridoio: ogni scuola sta in un blocco, in colonna (come a Milano) */
    const z0=zones[0];let cz=0;
    const aisleOf=r=>{const ps=r.seats.map(q=>q.proj);if(ps.length<4)return null;const d=ps.slice(1).map((v,i)=>v-ps[i]);const md=d.slice().sort((a,b)=>a-b)[Math.floor(d.length/2)];
      const g=d.map((v,i)=>[v,i]).filter(([v])=>v>md*1.8);return g.length===1?(ps[g[0][1]]+ps[g[0][1]+1])/2:null;};
    const fr0=z0&&z0.pl?z0.rows.findIndex((r,ri)=>!taken[0][ri]&&r.seats.length):-1;
    const aisle=fr0>=0?aisleOf(z0.rows[fr0]):null;
    const bal=aisle!=null?(()=>{const r=z0.rows[fr0].seats;const l=r.filter(q=>q.proj<aisle).length;return Math.min(l,r.length-l)/r.length;})():0;
    if(aisle!=null&&bal>=0.3&&rest.length){
      const blk=(ri,side)=>z0.rows[ri].seats.filter(q=>side?q.proj>aisle:q.proj<aisle);const ptr=[0,0];
      const colFree=side=>{const o=[];for(let ri=ptr[side];ri<z0.rows.length;ri++){if(!taken[0][ri]&&blk(ri,side).length)o.push(ri);}return o;};
      const capOf=(side,ris)=>ris.reduce((a,ri)=>a+blk(ri,side).length,0);
      const put=(x,side,ris,n)=>{let left=n,last=ptr[side]-1;for(const ri of ris){if(!left)break;for(const q of near(blk(ri,side),aisle)){if(!left)break;res[q.k]=x.s.id;left--;}last=ri;}ptr[side]=last+1;return n-left;};
      while(rest.length){const x=rest[0];const fr=[colFree(0),colFree(1)],caps=[capOf(0,fr[0]),capOf(1,fr[1])];
        const depth=sd=>fr[sd].length?fr[sd][0]:1e9;const side=[0,1].sort((a,b)=>depth(a)-depth(b)||caps[b]-caps[a]).find(sd=>caps[sd]>=x.n);
        if(side!=null){put(x,side,fr[side],x.n);rest.shift();continue;}
        /* non entra in un blocco solo: occupa il resto di entrambi i blocchi, prima quello più avanti */
        if(caps[0]+caps[1]>=x.n){const ord=[0,1].sort((a,b)=>depth(a)-depth(b));const n1=put(x,ord[0],fr[ord[0]],Math.min(x.n,caps[ord[0]]));put(x,ord[1],fr[ord[1]],x.n-n1);rest.shift();continue;}
        break;}
      if(rest.length){const x=rest[0];const fr=[colFree(0),colFree(1)],caps=[capOf(0,fr[0]),capOf(1,fr[1])];const sd=caps[1]>caps[0]?1:0;
        if(zones.length<2)return null;
        if(x.dis>0&&order.indexOf(order.find(o=>o.s.id===x.s.id))>0)return {promote:order.find(o=>o.s.id===x.s.id)};
        if(caps[0]+caps[1]>0&&(fr[0].length+fr[1].length>=4||x.dis>0)){const n=put(x,0,fr[0],caps[0])+put(x,1,fr[1],caps[1]);rest[0]={...x,n:x.n-n,cont:true};}
        else{const fl=[...new Set([...fr[0],...fr[1]])].sort((a,b)=>a-b);
          if(caps[0]+caps[1]>0)notes.push({z:zones[0].nome,n:caps[0]+caps[1],file:fl.map(ri=>zones[0].rows[ri].fila).join(', '),scuola:x.s.nome||'la scuola successiva'});}}
      z0.rows.forEach((r,ri)=>{taken[0][ri]=true;});cz=1;
    }
    for(const x0 of rest){const x=x0.cont?order.find(o=>o.s.id===x0.s.id)||x0:x0;let left=x0.n,first=!x0.cont;
      while(left>0){if(cz>=zones.length)return null;
        if(x.dis>0&&!zones[cz].pl&&first)return {promote:x};
        const fr=freeRows(cz);const cap=fr.reduce((a,ri)=>a+zones[cz].rows[ri].seats.length,0);
        if(cap>=left){const ris=[];let c=0;for(const ri of fr){if(c>=left)break;ris.push(ri);c+=zones[cz].rows[ri].seats.length;}left-=fill(x,cz,ris,left);break;}
        if(cz===zones.length-1)return null;
        if(cap>0&&(fr.length>=2||x.dis>0)){left-=fill(x,cz,fr,cap);first=false;}
        else if(cap>0)notes.push({z:zones[cz].nome,n:cap,file:fr.map(ri=>zones[cz].rows[ri].fila).join(', '),scuola:x.s.nome||'la scuola successiva'});
        cz++;}}
    return {res,notes};};
  let order=sch0.slice(),out=null;
  for(let it=0;it<60;it++){out=place(order);if(!out||!out.promote)break;const i=order.indexOf(out.promote);if(i<=0){out=null;break;}order.splice(i,1);order.splice(i-1,0,out.promote);}
  let assign,mode='file',missing=0,notes=[];

  else{/* sala quasi piena: file condivise, sempre nello stesso ordine, prima la platea */
    const sq=zones.flatMap(z=>z.rows.flatMap((r,i)=>i%2?r.seats.slice().reverse():r.seats));assign={};let pos=0;
    for(const x of sch0){for(let c=0;c<x.n;c++){if(pos>=sq.length){missing++;continue;}assign[sq[pos++].k]=x.s.id;}}
    if(anchor){const own=assign[ck];if(own!==anchor.D.s.id){const sw=Object.keys(assign).find(k=>assign[k]===anchor.D.s.id);if(sw){assign[sw]=own;assign[ck]=anchor.D.s.id;}}}

  p.genHash=genHash(p);return missing;

function genHash(p){const c=Object.keys(p.carrozzina||{}).sort();return JSON.stringify([p.scuole.map(s=>[s.id,int(s.persone),s.livello,prioOf(s),int(s.disabili),int(s.classeDis)]),Object.keys(p.esclusi||{}).sort(),!!(p.opzioni&&p.opzioni.gap),...(c.length?[c]:[])]);}

function nextFila(f,abc){f=String(f||'').trim().toUpperCase();if(!f)return '';if(/^\d+$/.test(f))return String(+f+1);const A=(abc||'it')==='en'?FILE_EN:FILE_IT;

function suggestRow(a,b){

  if(V.draft){toast('Conferma o annulla prima la fila in corso','bad');return;}
  if(!t.nome.trim()){toast('Scrivi il nome del teatro','bad');document.getElementById('tNome').focus();return;}
  if(!t.zone.some(z=>z.rows.length)){toast('Aggiungi almeno una fila prima di salvare','bad');return;}
  btn.disabled=true;btn.textContent='Salvataggio…';
  try{
    const up=new Map();
    for(const z of t.zone){const b=V.bg[z.id];if(b&&b.blob){
      if(!S.assets){continue;}
      try{if(!up.has(b.blob))up.set(b.blob,(await S.assets.upload(b.blob)).id);z.bg=up.get(b.blob);b.blob=null;}
      catch(err){toast('Mappa salvata senza scansione ('+(err.code||'errore')+')','warn');}}}
    t.aggiornato=new Date().toISOString();
    if(V.linkTappa){const lt=S.c.tappe[V.linkTappa];if(lt&&lt.hsTeatro&&lt.hsTeatro.id&&!t.hsTeatroId&&!Object.values(S.c.teatri).some(x=>x.id!==t.id&&x.hsTeatroId===lt.hsTeatro.id))t.hsTeatroId=lt.hsTeatro.id;}
    const keep=clone(t);delete keep.zone;const out={...keep,id:t.id,nome:t.nome,citta:t.citta,aggiornato:t.aggiornato,zone:t.zone.map(z=>({id:z.id,nome:z.nome,tipo:z.tipo,w:z.w,h:z.h,bg:z.bg||null,front:z.front?{x1:f2(z.front.x1),y1:f2(z.front.y1),x2:f2(z.front.x2),y2:f2(z.front.y2)}:null,
      rows:z.rows.map(r=>({id:r.id,fila:r.fila,x1:f2(r.x1),y1:f2(r.y1),x2:f2(r.x2),y2:f2(r.y2),n:r.n??r.posti.length,primo:r.primo??'',spec:r.spec||'',posti:r.posti,bloccati:r.bloccati||[],...((r.carrozzina||[]).length?{carrozzina:r.carrozzina}:{}),...(+r.curva?{curva:Math.round(r.curva*1000)/1000}:{})}))}))};
    await put('teatri',t.id,out);V.dirty=false;toast('Mappa salvata');archSoon('t',t.id);
    if(V.linkTappa){const tp=S.c.tappe[V.linkTappa];if(tp&&tp.teatroId!==t.id){const o={...clone(tp),teatroId:t.id};delete o.id;await put('tappe',tp.id,o);toast('Mappa salvata e collegata alla data');}}
    const s=document.getElementById('edState');if(s)s.textContent='Salvata';
  }catch(err){toast('Salvataggio non riuscito ('+(err.code||err.message)+')','bad');}
  btn.disabled=false;btn.textContent='Salva mappa';
}

function prepP(p){p.scuole=p.scuole||[];p.assign=p.assign||{};p.esclusi=p.esclusi||{};p.carrozzina=p.carrozzina||{};p.opzioni=p.opzioni||{gap:false};
  p.scuole.forEach(s=>{if(s.priorita===true)s.priorita='P1';else if(s.priorita===false)s.priorita='';});return p;}
function newPiantina(teatroId){if(!S.c.teatri[teatroId])return;
  const p=prepP({id:uid('p'),teatroId,data:today(),replica:'09:00'});
  V={name:'piantina',p,tool:'pan',zoom:startZoom(),zi:0,showBg:false,saved:false};render();window.scrollTo(0,0);}
function openPiantina(id,from){const p=prepP(clone(S.c.piantine[id]));if(!p.genHash&&Object.keys(p.assign).length)p.genHash=genHash(p);
  V={name:'piantina',p,from:from||'',tool:'pan',zoom:startZoom(),zi:0,showBg:false,saved:true};
  const t=S.c.teatri[p.teatroId];if(t&&p.scuole.length&&!Object.keys(p.assign).length){distribute(t,p);scheduleSave();}
  render();window.scrollTo(0,0);}
function curT(){return S.c.teatri[V.p.teatroId];}

function drawPl(){
  const p=V.p,t=curT();const GT=geomT(t,p.esclusi);V.GT=GT;const x=GT.zs[V.zi];
  document.getElementById('plCanvas').style.width=(V.zoom*100)+'%';

  refreshStatuses();renderNote();centerOnce('plWrap');
}
function renderNote(){const el=document.getElementById('plNote');if(!el)return;const p=V.p;const nc=Object.keys(p.carrozzina||{}).length+(V.GT?Object.values(V.GT.byK).filter(q=>q.carr).length:0);
  const c1=p1Conflict(p.scuole,S.c.teatri[p.teatroId]);el.innerHTML=(c1?`<div class="banner warn" style="margin:8px 0">${c1.length} scuole con P1 in questa replica: ordine provvisorio (davanti la più piccola). Il referente di zona deve scegliere chi va davanti, correggendo la priorità su HubSpot.</div>`:'')+(p.distNote?`<div class="banner" style="margin:8px 0">${esc(p.distNote)}</div>`:'')+(nc?`<p class="muted small" style="margin:6px 0">♿ ${nc===1?'1 posto carrozzina segnato':nc+' posti carrozzina segnati'}: la scuola con studenti con disabilità si dispone attorno.</p>`:'');}
function updateStats(){
  const p=V.p,GT=V.GT;if(!GT)return;const all=Object.values(GT.byK);const cap=all.filter(s=>!s.blocked).length;const ex=all.filter(s=>s.excl).length;
  const tot=p.scuole.reduce((a,s)=>a+int(s.persone),0);let used=0;for(const k in p.assign){const s=GT.byK[k];if(s&&!s.blocked)used++;}
  document.getElementById('plStats').innerHTML=`<span><b>${cap}</b> posti disponibili</span>${ex?`<span><b>${ex}</b> esclusi per questa data</span>`:''}<span><b>${tot}</b> persone previste</span><span><b>${used}</b> assegnati</span><span><b>${cap-used}</b> liberi</span>${tot>cap?`<span class="pill bad">Mancano ${tot-cap} posti</span>`:''}`;
}
function schoolStatus(s){
  const GT=V.GT,p=V.p;if(!GT)return'';const n=countFor(GT,p.assign,s.id);const need=int(s.persone);const d=n-need;
  const pill=!need&&!n?'<span class="pill warn">Indica le persone</span>':d===0?`<span class="pill ok">${n} posti su ${need}</span>`:d<0?`<span class="pill warn">${n} su ${need} · mancano ${-d}</span>`:`<span class="pill bad">${n} su ${need} · ${d} in più</span>`;
  const rs=rangesFor(GT,p.assign,s.id);
  return pill+(rs.length?`<span class="ranges">${esc(rangesText(GT,rs))}</span>`:'');
}
function renderSchools(){
  const p=V.p;const el=document.getElementById('plPanel');
  el.innerHTML=`<div class="sec-head"><h3>Scuole</h3><button class="btn small" data-pl="addschool">+ Aggiungi a mano</button></div>
  <div class="schools">${p.scuole.length?p.scuole.map(s=>schoolCard(s)).join(''):`<div class="empty"><b>Nessuna scuola.</b><span class="muted small">${curTappa()?'Importale da HubSpot con il pulsante qui sopra, oppure aggiungile a mano.':'Aggiungi le scuole con il numero di persone, accompagnatori compresi.'}</span></div>`}</div>
  <label class="chk"><input type="checkbox" id="pGap" ${p.opzioni.gap?'checked':''}> Un posto libero tra una scuola e l’altra</label>
  <div class="row-btns">${V.confirmClear?`<button class="btn danger" data-pl="clearok">Sì, svuota tutti i posti</button><button class="btn ghost" data-pl="clearno">Annulla</button>`:`<button class="btn" data-pl="clear" ${Object.keys(p.assign||{}).length||Object.keys(p.esclusi||{}).length?'':'disabled'}>Svuota disposizione</button>`}</div>
  <p class="muted small" style="margin:4px 0 0">“Svuota disposizione” toglie i posti assegnati e quelli esclusi, ma lascia la pianta del teatro e l’elenco delle scuole. Poi premi “Rigenera piantina” in alto per ripartire da zero.</p>
  <details class="rules"><summary>Come vengono distribuiti i posti</summary><ol class="guide small">
   <li>Ordine dal palco: prima le <b>medie</b>, poi le <b>superiori</b>. Dentro ogni grado: <b>P1</b>, <b>P2</b>, <b>P3</b>, poi le scuole senza priorità. L’ordine si rispetta sempre. Le priorità arrivano dalle note del deal su HubSpot: si correggono lì.</li>
   <li>Le scuole stanno <b>una dietro l’altra</b>, mai affiancate: ogni fila è di una sola scuola.</li>
   <li>Si riempie prima la <b>platea</b>. Se una scuola non ci sta intera e restano almeno 2 file, si divide: davanti in platea, il resto in galleria. Se resta 1 fila sola, va tutta in galleria e la piantina indica i posti liberi in platea.</li>
   <li>Se la platea ha <b>due blocchi separati</b> dal corridoio, ogni scuola sta in <b>un blocco solo</b>, in colonna: la scuola successiva va nel blocco dove si arriva più avanti al palco.</li>
   <li>Una scuola con <b>studenti con disabilità</b> non va mai in galleria. Se segni un <b>posto carrozzina</b>, la scuola si dispone attorno a quel posto.</li>
   <li>Solo se la sala è quasi piena le scuole possono condividere una fila: l’app te lo segnala.</li></ol></details>`;
}
